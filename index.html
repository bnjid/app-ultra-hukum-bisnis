", "Hak perizinan usaha", "Hak pemegang saham", "Hak kepabeanan"], "answer": 0, "explanation": "Pencantuman nama merupakan salah satu aspek hak moral."}, {"slide": 9, "q": "Penggandaan dan pendistribusian karya berkaitan dengan apa?", "options": ["Hak ekonomi", "Pendaftaran badan hukum", "Klasifikasi KBLI", "Penetapan domisili"], "answer": 0, "explanation": "Materi memasukkan penggandaan dan distribusi dalam pembahasan hak ekonomi."}, {"slide": 11, "q": "Apa perbedaan dasar lisensi dengan pengalihan hak ekonomi?", "options": ["Lisensi memberi izin penggunaan sesuai lingkup perjanjian", "Lisensi selalu memindahkan seluruh kepemilikan", "Lisensi menghapus nama pencipta", "Lisensi hanya berlaku pada karya cetak"], "answer": 0, "explanation": "Izin menggunakan karya berbeda dari pengalihan hak ekonomi atas karya."}, {"slide": 7, "q": "Mengapa dokumentasi proses kreatif perlu disimpan?", "options": ["Membantu pembuktian penciptaan karya", "Membuat karya pasti viral", "Menghapus kebutuhan memeriksa lisensi", "Mengubah gagasan abstrak menjadi paten otomatis"], "answer": 0, "explanation": "Dokumentasi membantu menunjukkan proses dan asal-usul karya ketika timbul sengketa."}, {"slide": 13, "q": "Video diunggah ulang tanpa izin. Langkah awal yang relevan?", "options": ["Mengumpulkan bukti dan menggunakan kanal pelaporan platform", "Membalas dengan membajak akun", "Menghapus seluruh file asli", "Menyebarkan data pribadi pelaku"], "answer": 0, "explanation": "Materi membahas pelaporan pelanggaran dan langkah hukum; bukti perlu dijaga."}, {"slide": 14, "q": "Apa fungsi watermark dan metadata?", "options": ["Membantu identifikasi serta penelusuran karya", "Menjamin karya mustahil disalin", "Menggantikan semua syarat lisensi", "Menghapus hak moral"], "answer": 0, "explanation": "Watermark dan metadata membantu pelacakan, tetapi bukan jaminan pencegahan penyalinan."}, {"slide": 14, "q": "Mengapa Terms of Use karya digital perlu jelas?", "options": ["Menjelaskan izin penggunaan dan batasannya", "Membebaskan pengguna dari semua aturan", "Menjamin semua penggunaan merupakan pelanggaran", "Mengalihkan otomatis seluruh hak moral"], "answer": 0, "explanation": "Syarat penggunaan membantu pihak lain memahami lingkup izin yang diberikan."}]}, {"id": 7, "meeting": "7", "title": "Hak Cipta Perangkat Lunak & Open Source", "tag": "Software", "description": "Pahami lisensi MIT, GPL, Apache, audit lisensi, dan risiko software bajakan.", "file": "materi/04-Pert.-7-Hukum-Hak-Cipta-Perangkat-Lunak-dan-Open-Source.pptx", "slides": ["\nLISENSI\n\nKEKAYAAN INTELEKTUAL\n\nSUMBER TERBUKA\nHUKUM HAK CIPTA\nPERANGKAT LUNAK & OPEN SOURCE\nPRESENTER\nDr. Apik Anitasari Intan Saputri S.H.,M.H\n\nDEPARTEMEN\nKepatuhan Digital\nUNIVERSITAS AMIKOM PURWOKERTO\n\nHUKUM TI\nPRESENTASI LEGAL DIGITAL", "DITERBITKAN PADA 25 SEPTEMBER 2026\nDAFTAR ISI\nHUKUM HAK CIPTA & OPEN SOURCE\n\n01\nJUDUL PRESENTASI\n\n02\nTUJUAN PEMBELAJARAN\n\n03\nSTATUS HUKUM PERANGKAT LUNAK\n\n04\nPERLINDUNGAN KODE SUMBER\n\n05\nSTATUS HUKUM BASIS DATA\n\n06\nLISENSI: KOMERSIAL VS OSS\n\n07\nMEMAHAMI LISENSI OSS\n\n08\nJENIS: MIT LICENSE\n\n09\nJENIS: GNU GPL\n\n10\nJENIS: APACHE LICENSE\n\n11\nRISIKO SOFTWARE BAJAKAN\n\n12\nANCAMAN KEAMANAN BAJAKAN\n\n13\nTANGGUNG JAWAB PENGEMBANG\n\n14\nGANTI RUGI PENGGUNA\n\n15\nAUDIT LISENSI INTERNAL\n\n16\nMITIGASI PELANGGARAN\n\n17\nKESIMPULAN & RANGKUMAN\n\n\nLEGAL TECH\nMODUL EDUKASI 2026", "\nPERTEMUAN 07 // KULIAH\nHAK CIPTA\nSOFTWARE & OPEN SOURCE\n\n\n\"Memahami implikasi hukum, lisensi, dan risiko dalam ekosistem digital guna menjaga keberlanjutan inovasi teknologi modern.\"\n01.\nIMPLIKASI HUKUM\nMenganalisis perlindungan hukum bagi pengembang dan pengguna dalam menghadapi tantangan di era digital global.\n02.\nLISENSI PERANGKAT LUNAK\nMemahami berbagai jenis model lisensi yang mengatur distribusi dan penggunaan kode sumber secara legal.\n03.\nEKOSISTEM TERBUKA\nMenjaga keterbukaan aplikasi untuk mendorong kolaborasi komunitas dan mengurangi risiko monopoli teknologi.\n\nLARANA\nJUDUL PRESENTASI", "\n\nMODUL 01 // TUJUAN PEMBELAJARAN\nTARGET\nKOMPETENSI\n MAHASISWA\nMemahami aspek legalitas perangkat lunak guna meminimalisir risiko hukum dalam organisasi dan pengembangan sistem informasi profesional.\n\n\nStatus Hukum & UU Hak Cipta\nMemahami status hukum perangkat lunak dan basis data sesuai regulasi UU Hak Cipta yang berlaku di Indonesia.\n\n\nMekanisme Lisensi & OSS\nMenganalisis perbedaan fundamental antara mekanisme lisensi komersial dan Open Source Software (OSS).\n\n\nRisiko Software Bajakan\nMengidentifikasi dampak dan risiko hukum penggunaan software tidak resmi bagi stabilitas organisasi.\n\n\nTanggung Jawab Pengembang\nMemahami kewajiban hukum pengembang atas cacat program dan praktik audit lisensi internal perusahaan.\n\n\nHUKUM DIGITAL\nEDUKASI LISENSI & HAK CIPTA", "\nREGULASI PERANGKAT LUNAK\nSTATUS HUKUM DALAM UU\n\n\n\n\nOBJEK HUKUM\nBASIS DATA\nBagian Integral Sistem\n\n\nMASA BERLAKU\nEKSKLUSIF\nSesuai Regulasi Terkini\n\nPerangkat lunak dikategorikan sebagai karya cipta yang dilindungi, mencakup kode sumber (source code) dan program objek sebagai wujud ekspresi logika pemrograman yang diakui secara hukum.\n\nHAK CIPTA\nPERLINDUNGAN DIGITAL", "\n\n// STANDAR HUKUM\nKODE \nSUMBER\nKode sumber dilindungi sebagai ekspresi logika pemrogram yang unik untuk menjaga integritas dan orisinalitas perangkat lunak dalam ekosistem digital.\n\nEKSPRESI LOGIKA\nDILINDUNGI\n\nSTATUS HUKUM\nHAK CIPTA\n\nHAK MORAL\nAtribusi Pencipta\nHak yang melekat pada pencipta untuk dicantumkan namanya pada hasil karya kode sumber secara permanen.\n\nHAK EKONOMI\nKomersialisasi\nHak eksklusif pencipta untuk mendapatkan manfaat ekonomi dari penggunaan atau lisensi perangkat lunak.\n\nINTEGRITAS SISTEM\nLarangan Penggandaan Ilegal\nDilarang keras melakukan penggandaan tanpa izin pemilik hak cipta guna menjaga integritas dan keamanan ekosistem perangkat lunak secara menyeluruh.\nSTATUS LISENSI\n● TERLINDUNGI\n\n\nLEGALITAS\nPERLINDUNGAN DIGITAL", "\n\n\nDEFINISI PERLINDUNGAN\nSTATUS HUKUM \nBASIS DATA\nKriteria Orisinalitas Struktur\n\nBasis data dilindungi sebagai ciptaan yang menunjukkan orisinalitas dalam penyusunan struktur dan pemilihan data sesuai regulasi HKI.\n\nHak Eksklusif Pengelola\n\nSesuai Peraturan BPS No. 7 Tahun 2026, pengelola memiliki hak eksklusif atas ekstraksi dan pemanfaatan data secara komersial.\n\nDASAR HUKUM\nBPS 7/2026\n\nCAKUPAN HAK\nEKSTRAKSI\n\n\nLEGALITAS\nDIVISI BASIS DATA\nORISINALITAS STRUKTUR\nPERLINDUNGAN HKI\nHAK EKSKLUSIF\nEKSTRAKSI KOMERSIAL", "MEKANISME LISENSI:\nKOMERSIAL VS OPEN SOURCE\n\nLisensi merupakan izin hukum yang diberikan untuk penggunaan perangkat lunak secara sah sesuai aturan pengembang.\n\nPerangkat lunak milik perorangan atau perusahaan yang membatasi hak akses, modifikasi, dan redistribusi kode sumber.\n\nModel lisensi yang memberikan kebebasan penuh bagi pengguna untuk mempelajari, mengubah, dan membagikan kembali kode.\n\nBerfokus pada penjualan hak guna perangkat lunak melalui skema berbayar untuk mendapatkan keuntungan finansial.\n\nMengandalkan kolaborasi massal serta layanan pendukung teknis sebagai nilai tambah utama bagi para pengguna.\n\n\nHAK CIPTA\nMEKANISME LISENSI\n\n\nDEFINISI LISENSI\n\n\nPROPRIETARY SOFTWARE\n\n\nOPEN SOURCE\n\n\nBISNIS KOMERSIAL\n\n\nMODEL KOMUNITAS", "\nFILOSOFI PERANGKAT LUNAK\nMEMAHAMI \nLISENSI OSS\n\n01 //\nKebebasan & Karakteristik\nMenekankan kebebasan pengguna untuk menjalankan, memodifikasi, dan mendistribusikan kode melalui transparansi akses sumber terbuka yang mendorong inovasi global.\n\n02 //\nKeuntungan Kolaborasi\nSinergi pengembang meningkatkan keamanan dan efisiensi melalui kontribusi komunitas, mempercepat adopsi teknologi industri pada tren lisensi masa depan.\nNILAI INTI:\n\nTRANSPARANSI\n\nKEAMANAN\n\nINOVASI\n\n\nHUKUM HAK CIPTA\nOPEN SOURCE & LISENSI", "\n\n// JENIS LISENSI OSS\nMIT LICENSE\nLisensi perangkat lunak bebas yang sangat permisif, memberikan kebebasan luas bagi pengembang untuk menggunakan dan mendistribusikan kode.\n\n\nOSS\nPERMISIF\nKARAKTERISTIK\nLisensi ini bersifat sangat terbuka, mengizinkan penggunaan komersial dan modifikasi tanpa batasan ketat.\n\n\nLEGAL\nTANGGUNG JAWAB\nKETENTUAN UTAMA\nMewajibkan atribusi pencipta dan membatasi tanggung jawab hukum pengembang secara penuh.\n\n\nMODERN\nTEKNOLOGI\nCONTOH PROYEK\nSangat populer pada ekosistem pengembangan modern seperti React dan Vue.js di GitHub.\n\n\n100%\nFLEKSIBILITAS\nADOPSI GLOBAL\nStandar industri untuk memajukan inovasi kolaboratif dalam perangkat lunak sumber terbuka.\n\n\nOPEN SOURCE\nHUKUM HAK CIPTA", "JENIS LISENSI OSS:\nGNU GENERAL PUBLIC LICENSE (GPL)\n\nGPL menerapkan konsep Copyleft yang menjamin kebebasan pengguna untuk menjalankan, mempelajari, dan berbagi perangkat lunak.\n\nTerdapat kewajiban hukum untuk mendistribusikan ulang kode sumber jika perangkat lunak tersebut dimodifikasi oleh pengembang.\n\nPenggunaan library GPL menuntut transparansi kode, di mana seluruh produk turunan mungkin harus menggunakan lisensi GPL yang sama.\n\n\nHAK CIPTA\nPERANGKAT LUNAK & OSS\n\n\nKONSEP COPYLEFT\n\n\nKEWAJIBAN KODE\n\n\nPRODUK KOMERSIAL", "\nAPACHE\n// JENIS LISENSI OSS\nAPACHE LICENSE 2.0\n\nSTATUS STANDAR\nINDUSTRI\nFLEKSIBILITAS\nTINGGI\n\nHAK PENGGUNAAN\nIzin bebas untuk modifikasi dan distribusi perangkat lunak.\n\nPROTEKSI HUKUM\nPerlindungan klaim paten dari kontributor bagi pengguna.\n\nPERBEDAAN SPESIFIK\nWajib menyertakan hak cipta tanpa harus open source turunan.\n\nADOPSI BISNIS\nPilihan utama bagi startup dan korporasi teknologi besar.\n\nKEAMANAN LISENSI\nStandar industri yang aman dan fleksibel hingga kini.\n\n\nHAK CIPTA\nOPEN SOURCE LICENSING", "\nBAGIAN 02 // RISIKO UTAMA\nRISIKO HUKUM\nSOFTWARE BAJAKAN\n\n\n\"Penggunaan perangkat lunak bajakan melanggar hak ekonomi pencipta dan memicu sanksi pidana serta perdata yang berat bagi perusahaan.\"\n01.\nPELANGGARAN HAK EKONOMI\nEksploitasi tanpa izin merugikan pencipta secara finansial dan melanggar undang-undang hak cipta yang berlaku secara global.\n02.\nSANKSI PIDANA & PERDATA\nPerusahaan menghadapi tuntutan ganti rugi materiil yang besar serta ancaman hukuman penjara bagi manajemen yang bertanggung jawab.\n03.\nDAMPAK REPUTASI STARTUP\nPraktik ilegal merusak kepercayaan investor karena risiko operasional yang tinggi dan integritas bisnis yang dipertanyakan.\n\n\nKEPATUHAN\nHUKUM & LISENSI", "\n\nANCAMAN // SOFTWARE BAJAKAN\nANCAMAN KEAMANAN\nSOFTWARE BAJAKAN\n\n\nPenggunaan crack berisiko tinggi terhadap infeksi malware dan backdoor yang memicu kebocoran data sensitif perusahaan secara fatal.\n\nRisiko Malware: Backdoor pada perangkat lunak hasil crack mengancam integritas sistem.\n\nKebocoran Data: Kerentanan tinggi pada informasi rahasia dan aset digital perusahaan.\n\nTanpa Dukungan: Ketiadaan pembaruan keamanan (security patch) memicu eksploitasi sistem.\n\nSTATUS KERENTANAN\n\n\nRISIKO KRITIS\n\n\nKEAMANAN SIBER\nPROTEKSI DATA PERUSAHAAN", "\nETIKA & REGULASI\nTANGGUNG JAWAB HUKUM PENGEMBANG\n\n\nPengembang wajib menulis kode aman sesuai standar teknis. Cacat program (bug) dapat memicu sengketa hukum jika menyebabkan kerugian finansial pengguna.\n\n\nKlausul pembatasan tanggung jawab (Limitation of Liability) sangat krusial untuk memitigasi risiko ganti rugi dan melindungi data sesuai regulasi baru.\n\n\nCAKUPAN PROFESIONAL\nKODE AMAN & FUNGSIONAL\n\n\nMITIGASI RISIKO\nLIMITASI TANGGUNG JAWAB\n\n\nHUKUM HAK CIPTA\nPERANGKAT LUNAK & OPEN SOURCE", "\n\n// ASPEK TANGGUNG JAWAB\nGANTI RUGI \nPENGGUNA\nMekanisme hukum yang mengatur kompensasi finansial akibat kegagalan sistem atau bug dalam perangkat lunak komersial maupun terbuka.\n\nSTATUS KLAIM\nTERVALIDASI\n\nSTANDAR HUKUM\nPERDATA\n\nMEKANISME FINANSIAL\nPembuktian Kerugian\nKlaim didasarkan pada bukti nyata kerugian finansial yang dialami pengguna secara langsung akibat anomali sistem.\n\nDELIK HUKUM\nKelalaian Berat\nDistinksi krusial antara error teknis wajar dengan gross negligence yang menentukan tanggung jawab hukum pengembang.\n\nINSTRUMEN KONTRAK\nService Level Agreement (SLA)\nDokumen kunci sebagai pembatas tanggung jawab hukum dan penetapan standar layanan minimal yang harus dipenuhi oleh penyedia perangkat lunak.\nKEPATUHAN LAYANAN\n● STANDAR OPERASIONAL\n\n\nHUKUM HAK CIPTA\nPERANGKAT LUNAK & OPEN SOURCE", "\n\n\nHUKUM HAK CIPTA & OSS\nPRAKTIK AUDIT \nLISENSI INTERNAL\nUrgensi Inventarisasi Aset\n\nAudit lisensi krusial untuk perlindungan hukum. Perusahaan wajib melakukan inventarisasi aset software secara berkala guna memastikan kepatuhan hak cipta yang akurat.\n\nProsedur Pemeriksaan Kesesuaian\n\nMelibatkan pemeriksaan mendalam antara jumlah instalasi aktif dengan sertifikat lisensi yang dibeli untuk menghindari risiko pelanggaran penggunaan perangkat lunak.\n\nImplementasi Tools Otomatis\n\nPenggunaan perangkat otomatis sangat direkomendasikan untuk mendeteksi lisensi OSS dalam kode sumber guna memitigasi risiko hukum secara efisien.\n\nTARGET KEPATUHAN\n100% LEGAL\n\nTAHUN LAPORAN\n2026 STATE\n\n\nAUDIT HAK CIPTA\nDIVISI KEPATUHAN DIGITAL\nASET DIGITAL\nMANAJEMEN INVENTARIS\nOTOMATISASI\nDETEKSI LISENSI OSS", "LANGKAH MITIGASI\nPELANGGARAN LISENSI\n\nPenyusunan kebijakan penggunaan software perusahaan (IT Policy) yang ketat guna meminimalkan risiko hukum operasional.\n\nMelakukan edukasi rutin bagi seluruh karyawan mengenai bahaya penggunaan software ilegal dan dampaknya bagi perusahaan.\n\nPenyimpanan bukti pembelian dan sertifikat lisensi secara sistematis untuk memudahkan proses audit dan kepatuhan hak cipta.\n\n\nHAK CIPTA\nKEPATUHAN PERANGKAT LUNAK\n\n\nKEBIJAKAN IT\n\n\nEDUKASI KARYAWAN\n\n\nAUDIT LISENSI", "\nRINGKASAN AKHIR\nHUKUM \nBISNIS\n\n01 //\nFondasi Bisnis Teknologi\nKepatuhan hukum merupakan fondasi utama bagi keberlanjutan bisnis di sektor teknologi untuk menjamin keamanan operasional jangka panjang.\n\n02 //\nManajemen Lisensi Strategis\nPenerapan strategi lisensi yang tepat sangat krusial guna melindungi hak kekayaan intelektual bagi pengembang maupun entitas perusahaan.\n\nIntegrasi aspek hukum dalam siklus pengembangan perangkat lunak (SDLC) wajib diterapkan secara menyeluruh.\nFOKUS UTAMA:\n\nLISENSI\n\nHAK CIPTA\n\nSDLC\n\n\nLEGALITAS\nINOVASI & KEPATUHAN"], "questions": [{"slide": 5, "q": "Apa yang dilindungi pada perangkat lunak dalam materi?", "options": ["Ekspresi program berupa source code dan object code", "Semua ide abstrak tanpa perwujudan", "Setiap rumus matematika secara otomatis", "Seluruh model bisnis di industri"], "answer": 0, "explanation": "Materi membahas ekspresi program; hak cipta tidak sama dengan kepemilikan semua gagasan di balik program."}, {"slide": 8, "q": "Apa fungsi lisensi perangkat lunak?", "options": ["Mengatur izin dan syarat penggunaan software", "Menghapus hak cipta pemilik", "Menjamin program bebas bug", "Menerbitkan NIB pengembang"], "answer": 0, "explanation": "Lisensi menentukan hak dan kewajiban pengguna software."}, {"slide": 9, "q": "Apa karakter utama Open Source Software?", "options": ["Akses kode dan kebebasan sesuai ketentuan lisensi", "Selalu bebas dari semua kewajiban", "Tidak boleh digunakan untuk bisnis", "Tidak memiliki pemegang hak cipta"], "answer": 0, "explanation": "Open source tetap mempunyai lisensi yang harus diperhatikan pengguna."}, {"slide": 10, "q": "MIT License termasuk kategori apa?", "options": ["Permissive license", "Lisensi yang melarang semua modifikasi", "Lisensi tanpa izin distribusi", "Lisensi yang hanya berlaku internal"], "answer": 0, "explanation": "MIT memberikan izin luas dengan persyaratan, termasuk mempertahankan pemberitahuan lisensi dan hak cipta."}, {"slide": 11, "q": "Apa konsep utama GNU GPL?", "options": ["Copyleft", "Cybersquatting", "Forum shopping", "Risk-Based Approach"], "answer": 0, "explanation": "Copyleft mempertahankan kebebasan pengguna melalui kewajiban lisensi pada distribusi karya yang tercakup."}, {"slide": 11, "q": "Apakah setiap modifikasi GPL untuk pemakaian pribadi wajib diumumkan ke publik?", "options": ["Tidak, modifikasi privat tidak otomatis wajib dipublikasikan", "Ya, setiap perubahan satu baris wajib diumumkan", "Ya, meskipun tidak didistribusikan", "Tidak boleh melakukan modifikasi apa pun"], "answer": 0, "explanation": "Penjelasan GNU membedakan modifikasi privat dari distribusi. Kewajiban source code mengikuti ketentuan distribusi yang berlaku."}, {"slide": 12, "q": "Apa fitur Apache License 2.0 yang dibahas?", "options": ["Pemberian lisensi paten dari kontributor sesuai ketentuannya", "Larangan semua penggunaan komersial", "Kewajiban semua turunan selalu GPL", "Penghapusan semua pemberitahuan hak cipta"], "answer": 0, "explanation": "Apache 2.0 memuat patent grant dengan lingkup dan syarat tertentu, bukan jaminan terhadap seluruh paten pihak lain."}, {"slide": 14, "q": "Apa risiko keamanan software hasil crack?", "options": ["Malware atau backdoor", "Jaminan pembaruan keamanan", "Peningkatan validitas lisensi", "Pelindungan data otomatis"], "answer": 0, "explanation": "Crack dapat membawa malware dan tidak menjamin dukungan pembaruan keamanan."}, {"slide": 16, "q": "Apa fungsi Service Level Agreement (SLA)?", "options": ["Menetapkan standar layanan dan kewajiban yang disepakati", "Menghapus semua hak konsumen", "Menggantikan lisensi semua library", "Menjamin software tidak memiliki bug"], "answer": 0, "explanation": "SLA membantu memperjelas tingkat layanan dan tanggung jawab para pihak."}, {"slide": 17, "q": "Apa kegiatan utama audit lisensi internal?", "options": ["Membandingkan penggunaan software dengan izin lisensinya", "Menghapus seluruh bukti pembelian", "Memasang software tanpa inventaris", "Menganggap semua library memiliki lisensi sama"], "answer": 0, "explanation": "Inventarisasi, bukti pembelian, dan pemeriksaan lisensi membantu kepatuhan."}]}, {"id": 8, "meeting": "8–9", "title": "Hukum ITE & Delik Siber dalam Bisnis Digital", "tag": "Hukum siber", "description": "Pelajari akses ilegal, privasi komunikasi, fake review, dan mitigasi risiko siber.", "file": "materi/03-Pert.-8-9-Hukum-ITE-dan-Delik-Siber-dalam-Bisnis-Digital.pptx", "slides": ["\n\nHukum ITE dan Delik Siber\ndalam Bisnis Digital\n\nDisajikan Oleh:\nDr. Apik Anitasari Intan Saputri S.H.,M.H\nDisajikan Kepada:\nMahasiswa S1 Bisnis Digital \nUniversitas Amikom Purwokerto", "\n\nDaftar Isi\n\n\n01\nPendahuluan Pertemuan 9\n\n02\nPerkembangan Regulasi UU ITE di Indonesia\n\n03\nAnalisis UU No. 1 Tahun 2024: Poin Perubahan Penting\n\n04\nPerbuatan yang Dilarang: Pencemaran Nama Baik & Ujaran Kebencian\n\n05\nDelik Siber: Akses Ilegal dan Hacking\n\n06\nIntersepsi Ilegal dan Penyadapan Informasi\n\n07\nTanggung Jawab Penyelenggara Sistem Elektronik (PSSE)\n\n08\nKonsep Safe Harbor Principle bagi Marketplace\n\n09\nKewajiban Media Sosial terhadap Konten Pengguna\n\n10\nStudi Kasus: Konten Promosi dan Endorsement\n\n11\nMasalah Hukum Ulasan Palsu (Fake Review)\n\n12\nUpaya Mitigasi Risiko Hukum Bisnis Digital\n\n13\nKesimpulan dan Diskusi", "\nPendahuluan Pertemuan 9\n\nSesi Belajar\nSelamat datang di sesi pembelajaran mendalam mengenai Hukum ITE dan Delik Siber.\n\nTujuan Utama\nMemahami batasan hukum serta kewajiban yang harus dipenuhi oleh setiap platform digital.\n\nUrgensi Bisnis\nKepatuhan hukum sangat krusial bagi keberlangsungan operasional bisnis di era digital saat ini.\n\nFokus Kajian\nIntegrasi regulasi siber dalam strategi bisnis untuk mitigasi risiko pelanggaran hukum.", "\nPerkembangan Regulasi UU ITE di Indonesia\n\n\n\nEvolusi hukum dari UU No. 11/2008 ke UU No. 19/2016 memperkuat kepastian hukum. Kini, UU No. 1/2024 merevisi aturan bisnis digital dan tindak pidana siber guna menjawab tantangan ekonomi digital serta perlindungan data yang dinamis di Indonesia.", "\nAnalisis UU No. 1 Tahun 2024: Poin Penting\nPenyesuaian krusial dalam regulasi terbaru untuk menjamin kepastian hukum dan keadilan di ekosistem digital Indonesia.\n\nPenyesuaian Pasal Krusial\nMengatur ulang delik pencemaran nama baik dan ujaran kebencian demi keadilan yang lebih baik bagi pengguna ruang digital.\n\nHarmonisasi Hak Hukum\nKeseimbangan antara kebebasan berpendapat dengan perlindungan hukum terhadap hak pribadi serta reputasi bisnis.\n\nImplikasi Pelaku Usaha\nBisnis digital wajib meningkatkan standar moderasi konten dan transparansi algoritma guna menghindari jerat pidana terbaru.", "\nPencemaran Nama Baik & Ujaran Kebencian\nMemahami batasan hukum dalam transmisi informasi elektronik untuk menjaga kehormatan dan ketertiban sosial di ruang siber bisnis digital.\n\n\nDefinisi & Delik Hukum\nPenghinaan mencakup transmisi informasi yang menyerang kehormatan, termasuk memviralkan fakta tanpa verifikasi hukum.\n\nBatasan SARA\nLarangan keras penyebaran informasi yang memicu kebencian atau permusuhan berdasarkan suku, agama, ras, dan antargolongan.\nSanksi Pidana ITE\nPelanggar konten negatif menghadapi hukuman penjara dan denda materiil sesuai dengan revisi terbaru UU ITE.", "\nDelik Siber:\nAkses Ilegal dan Hacking\n\n\nPasal 30 ayat (1) UU ITE melarang peretasan guna melindungi integritas data milik pihak lain dalam sistem elektronik.\n\n\nKUHP baru memperkuat perlindungan hukum terhadap penyadapan dan akses ilegal demi menjaga keamanan privasi masyarakat.\n\nTindakan masuk ke sistem tanpa izin diklasifikasikan sebagai pelanggaran serius yang merusak integritas data dan sistem milik orang lain.", "\n\nIntersepsi Ilegal\ndan Penyadapan\n\n\n1\nLarangan Hukum: Larangan melakukan intersepsi transmisi elektronik secara melawan hukum kini diselaraskan dalam KUHP baru dan UU ITE.\n\n2\nPrivasi Data: Regulasi ini bertujuan untuk melindungi privasi komunikasi digital bagi seluruh warga negara secara komprehensif.\n\n3\nPengecualian: Pengecualian tindakan intersepsi hanya berlaku secara resmi untuk kepentingan penegakan hukum oleh otoritas berwenang.\n\n4\nRisiko Pidana: Pelaku penyadapan data digital pribadi menghadapi ancaman risiko pidana berat sesuai ketentuan hukum yang berlaku.\n\n5\nTransisi Hukum: Sanksi pelanggaran akan sepenuhnya beralih ke mekanisme KUHP nasional yang baru pada bulan September 2026 mendatang.", "\nTanggung Jawab PSSE\nKewajiban platform dalam moderasi informasi mendesak dan tata kelola konten digital sesuai regulasi ITE yang berlaku di Indonesia.\n\nModerasi Konten\nRegulasi\n✓\nKelola konten mendesak\n✓\nKepatuhan aturan PDP\n✓\nStandar moderasi info\n\nAspek Hukum\nSanksi\n✓\nTanggung jawab perdata\n✓\nSanksi administratif\n✓\nKepastian hukum platform\n\nTake Down Konten\nMekanisme\n✓\nHapus konten ilegal\n✓\nProsedur pemutusan akses\n✓\nPengawasan informasi", "\nPrinsip Safe Harbor\n\nPerlindungan Hukum bagi Perantara Digital\n\nIntermediary\nMarketplace berperan sebagai perantara yang tidak bertanggung jawab penuh atas konten ilegal pihak ketiga.\nDoktrin ini melindungi platform dari tuntutan hukum langsung terkait transaksi atau data pengguna.\n\n\nSyarat & Take Down\nPlatform bebas tuntutan jika memiliki kebijakan 'take down' yang responsif terhadap laporan pelanggaran.\nKepatuhan terhadap regulasi ITE menjadi kunci utama dalam menjaga status perlindungan hukum ini.", "\nKewajiban Media Sosial\n\nTanggung jawab platform dalam moderasi konten di bawah hukum ITE Indonesia.\n\n\n1\nModerasi Konten\nMedia sosial berperan krusial dalam moderasi konten ilegal melalui standar komunitas yang ketat.\n\n\n2\nKepatuhan Hukum\nPenerapan standar komunitas harus selaras dengan regulasi hukum ITE yang berlaku di wilayah Indonesia.\n\n\n3\nRisiko Platform\nKelalaian memenuhi kewajiban hukum dapat mengakibatkan risiko pemblokiran akses platform secara nasional.", "\nKonten Promosi\n& Endorsement\nAnalisis kepatuhan hukum dalam pemasaran digital dan tanggung jawab hukum bagi para pelaku industri kreatif sesuai regulasi ITE terbaru.\n\nAnalisis Barang Ilegal\n✓\nLarangan promosi barang ilegal sesuai revisi UU ITE\n✓\nVerifikasi legalitas produk sebelum kampanye\n✓\nKepatuhan pada standar pidana siber terbaru\n\nTanggung Jawab Hukum\n✓\nBeban hukum kolektif antara influencer dan brand\n✓\nValidasi akurasi informasi dalam iklan digital\n✓\nMitigasi risiko hukum terhadap delik siber\n\nInformasi Menyesatkan\n✓\nPelanggaran UU ITE terkait konten manipulatif\n✓\nSanksi atas penyebaran berita iklan palsu\n✓\nPerlindungan konsumen dalam transaksi digital\n✓\nTransparansi klaim dalam materi endorsement", "\nMasalah Hukum Ulasan Palsu (Fake Review)\nAnalisis fenomena manipulasi ulasan di platform e-commerce yang merugikan konsumen serta implikasi hukumnya berdasarkan peraturan perundang-undangan di Indonesia.\n\nFenomena Manipulasi\nManipulasi ulasan dalam ekosistem bisnis e-commerce merupakan praktik curang yang menciptakan persaingan tidak sehat dan merugikan kepercayaan pasar secara digital.\n\nKategorisasi Delik\nTindakan penyebaran ulasan palsu diklasifikasikan sebagai bentuk penipuan konsumen atau penyebaran informasi menyesatkan yang secara eksplisit melanggar ketentuan UU ITE.\n\nSanksi & Denda\nPemilik bisnis dan penyedia jasa ulasan manipulatif terancam sanksi pidana penjara serta denda material yang berat sebagai konsekuensi dari pelanggaran hukum siber.\n\nKepatuhan Hukum\nIntegritas data ulasan sangat krusial bagi kepatuhan hukum bisnis digital. Perusahaan wajib memastikan kejujuran informasi untuk menghindari jeratan hukum pidana siber.", "\nUpaya Mitigasi Risiko Hukum Bisnis Digital\nLangkah strategis dalam mengelola kepatuhan dan keamanan operasional di era digital.\n\nAudit Kepatuhan Hukum\nMelakukan audit hukum secara berkala sangat penting untuk mendeteksi celah regulasi sedini mungkin dan memastikan kepatuhan penuh.\n\nPenyusunan ToS Kuat\nPenyusunan Syarat dan Ketentuan (Terms of Service) yang komprehensif berfungsi sebagai perlindungan hukum utama bagi platform digital.\n\nEdukasi Tim Internal\nMemberikan pemahaman mendalam kepada tim internal mengenai batasan delik siber guna meminimalisir risiko pelanggaran UU ITE secara tidak sengaja.", "\nKesimpulan dan Diskusi\n\nRingkasan\nUU ITE dan UU No. 1/2024 mewajibkan PSSE bertanggung jawab atas konten ilegal dan keamanan data bisnis digital.\n\nTanya Jawab\nSesi diskusi interaktif mengenai navigasi hukum siber dan penerapan aturan dalam operasional bisnis harian.\n\nPenutup\nEvaluasi akhir pemahaman materi mengenai batasan hukum siber serta implementasi prinsip Safe Harbor.\n\nLangkah Lanjut\nPenerapan kepatuhan regulasi digital secara berkelanjutan untuk mitigasi risiko delik siber di masa depan."], "questions": [{"slide": 3, "q": "Apa tujuan mempelajari delik siber untuk bisnis?", "options": ["Memahami batasan hukum dan mengurangi risiko operasional", "Mempelajari cara menyembunyikan pelanggaran", "Menghapus seluruh moderasi", "Menjamin bisnis tidak pernah digugat"], "answer": 0, "explanation": "Materi mengaitkan kepatuhan siber dengan keberlangsungan bisnis digital."}, {"slide": 7, "q": "Apa ciri utama akses ilegal dalam materi?", "options": ["Mengakses sistem pihak lain tanpa hak atau izin", "Masuk ke akun sendiri sesuai izin", "Melakukan audit sesuai kewenangan", "Mengganti kata sandi akun sendiri"], "answer": 0, "explanation": "Batas hak dan izin membedakan akses sah dari akses tanpa kewenangan."}, {"slide": 8, "q": "Apa kepentingan yang dilindungi dari penyadapan ilegal?", "options": ["Privasi komunikasi digital", "Popularitas merek", "Biaya pengiriman barang", "Jumlah promosi"], "answer": 0, "explanation": "Pembahasan intersepsi menekankan pelindungan kerahasiaan komunikasi."}, {"slide": 9, "q": "Apa makna take-down dalam tata kelola konten?", "options": ["Penghapusan atau pemutusan akses konten yang ditindaklanjuti", "Pembelian domain baru", "Penerbitan sertifikat merek", "Penggantian seluruh pegawai"], "answer": 0, "explanation": "Take-down merupakan bagian mekanisme penanganan konten yang melanggar."}, {"slide": 10, "q": "Bagaimana prinsip safe harbor sebaiknya dipahami?", "options": ["Pelindungan bersyarat, bukan kekebalan otomatis platform", "Kekebalan mutlak semua marketplace", "Izin menjual barang ilegal", "Penghapusan semua kewajiban moderasi"], "answer": 0, "explanation": "Batas tanggung jawab harus dilihat bersama syarat dan hukum yang berlaku; keberadaan kebijakan saja bukan jaminan bebas tanggung jawab."}, {"slide": 11, "q": "Bagaimana hubungan standar komunitas dengan hukum?", "options": ["Penerapannya perlu selaras dengan hukum yang berlaku", "Standar komunitas selalu mengalahkan hukum", "Hukum tidak berlaku di media sosial", "Standar komunitas menghapus hak pengguna"], "answer": 0, "explanation": "Materi membahas kepatuhan platform terhadap hukum di wilayah operasinya."}, {"slide": 12, "q": "Apa langkah sebelum menerima endorsement produk?", "options": ["Memeriksa legalitas produk dan akurasi klaim", "Mengikuti seluruh klaim brand tanpa pemeriksaan", "Menyembunyikan identitas produk", "Mengganti semua ulasan negatif"], "answer": 0, "explanation": "Verifikasi produk dan klaim membantu mencegah promosi menyesatkan."}, {"slide": 13, "q": "Mengapa fake review merugikan konsumen?", "options": ["Menciptakan gambaran menyesatkan tentang produk", "Memperjelas pengalaman pembeli asli", "Meningkatkan akurasi informasi", "Menggantikan kebutuhan pengaduan"], "answer": 0, "explanation": "Manipulasi ulasan mengganggu kepercayaan dan keputusan konsumen; pertanggungjawaban memerlukan penilaian unsur hukum."}, {"slide": 14, "q": "Mengapa tim internal perlu edukasi hukum siber?", "options": ["Mengenali batas tindakan dan risiko pelanggaran", "Menghindari seluruh dokumentasi", "Menggantikan audit keamanan", "Membenarkan akses tanpa izin"], "answer": 0, "explanation": "Pemahaman batasan hukum membantu mencegah pelanggaran dalam aktivitas operasional."}, {"slide": 14, "q": "Paket mitigasi mana sesuai materi?", "options": ["Audit kepatuhan, ToS yang jelas, dan edukasi tim", "Menghapus log dan menutup pengaduan", "Membeli fake review dan menyalin iklan", "Mengabaikan laporan serta keamanan"], "answer": 0, "explanation": "Materi menyebut audit, penyusunan ToS, dan edukasi sebagai langkah mitigasi."}]}, {"id": 9, "meeting": "10", "title": "Kebijakan Platform & Tanggung Jawab Penyelenggara", "tag": "Platform", "description": "Telaah moderasi konten, notice and takedown, serta akuntabilitas marketplace.", "file": "materi/02-Pert.-10-Kebijakan-Platform-dan-Tanggung-Jawab-Hukum-Penyelenggara.pptx", "slides": ["\nKebijakan Platform dan Tanggung Jawab Hukum Penyelenggara\n\nAnalisis mendalam mengenai kerangka regulasi, kewajiban kepatuhan, dan implikasi hukum bagi penyelenggara platform digital di era modern.\nVOLUME I — RISET & ANALISIS\n\nREGULASI\nLAPORAN HUKUM DIGITAL\nEDISI NO. 01\nARSIP GLOBAL 2026\n\nPERNYATAAN PEMBUKA\n", "\n\nHUKUM DIGITAL\nKEBIJAKAN PLATFORM & TANGGUNG JAWAB\n\nDaftar Isi\n\nPENDAHULUAN PERTEMUAN SEPULUH\n01\n\nKEBIJAKAN INTERNAL VS HUKUM POSITIF\n02\n\nMEKANISME MODERASI KONTEN DIGITAL\n03\n\nPROSEDUR NOTICE AND TAKEDOWN\n04\n\nPELANGGARAN HAK CIPTA DI RANAH DIGITAL\n05\n\nTANGGUNG JAWAB HUKUM E-COMMERCE\n06\n\nPENANGANAN PRODUK PALSU DI MARKETPLACE\n07\n\nANALISIS REGULASI E-COMMERCE TERKINI\n08\n\nSTUDI KASUS GUGATAN HUKUM PLATFORM\n09\n\nEVALUASI MEKANISME TAKE-DOWN\n10\n\nKESIMPULAN DAN DISKUSI\n11\n\nTINJAUAN KOMPREHENSIF MENGENAI TANGGUNG JAWAB HUKUM PENYELENGGARA PLATFORM DIGITAL", "\n\nREGULASI\nPLATFORM DIGITAL\npendahuluan\nPERTEMUAN SEPULUH\n\n\"Selamat datang di sesi kesepuluh mengenai regulasi platform digital, mengevaluasi kebijakan moderasi dan mekanisme take-down.\"\nMateri ini mencakup tata kelola konten dan tanggung jawab hukum penyelenggara, termasuk kewajiban kepatuhan terhadap kebijakan moderasi di Indonesia yang akan berlaku penuh.\n\nTanggung Jawab\nHukum Penyelenggara.\n\n\nBATAS WAKTU\nSEP 2026\nFOKUS SESI\nTAKE DOWN\nEvaluasi mendalam terhadap mekanisme tata kelola konten guna memastikan kepatuhan hukum dan transparansi operasional platform digital di Indonesia.\n\nMULAI MATERI\n\nPELAJARI LAGI", "\n\nLEGAL POLICY\nPLATFORM GOVERNANCE GROUP\nANALISIS HUKUM 2024\nStudi Regulasi No. 02\nKebijakan Internal vs Hukum Positif\nTANGGUNG JAWAB PENYELENGGARA\n\nDEFINISI COMMUNITY GUIDELINES SEBAGAI KONSTITUSI PRIVAT PLATFORM GLOBAL.\nPerbandingan standar internal platform dengan hukum nasional Indonesia bertujuan mengidentifikasi titik temu dan potensi konflik regulasi. Kebijakan global harus beradaptasi dengan hukum positif untuk memastikan kepatuhan hukum lokal.\n\nLIHAT DATA\n\nPELAJARI LEBIH LANJUT\n\n\n\nFOKUS UTAMA\nKonstitusi Privat / Standar Global\nSTATUS REGULASI\nHukum Positif / Harmonisasi Nasional", "\n\n\nKURASI HIBRIDA\nProses kurasi mengombinasikan algoritma AI dan tinjauan manusia untuk akurasi optimal dalam mendeteksi konten. Sistem ini memastikan keseimbangan antara efisiensi teknologi dan penilaian konteks manusia secara real-time.\nKEPATUHAN HUKUM\nKonten dilarang mencakup pelanggaran hukum nasional dan hak cipta. Alur kerja sistematis meliputi deteksi, pelaporan, hingga penghapusan konten ilegal secara cepat sesuai regulasi perundang-undangan yang berlaku di Indonesia.\nKONTEKS SLIDE\nAlur Kerja Sistem\nSERI REGULASI\nARSIP 2026\n\n\nDIGITAL MARKETING SEPT 2026\n\nKEBIJAKAN\nPLATFORM & TANGGUNG JAWAB HUKUM\nModerasi, \nMEKANISME KONTEN DIGITAL", "\n\n\nKEBIJAKAN\nTANGGUNG JAWAB HUKUM PLATFORM\nProsedur\nNOTICE AND TAKEDOWN\n\nMekanisme hukum bagi pemegang hak untuk melaporkan dan meminta penghapusan konten ilegal. Langkah ini mencakup verifikasi hak, notifikasi formal, serta validasi oleh platform untuk memutus akses pelanggaran secara cepat.\nDEFINISI & PROSEDUR\n\n\nVERIFIKASI PEMEGANG HAK\nLangkah Pelaporan Formal\n\nRESPONS CEPAT PLATFORM\nValidasi & Pemutusan Akses", "\n\n\n\nSTATUS KEPATUHAN\nPenegakan HUKUM\n\nREGULASI\nTANGGUNG JAWAB HUKUM\n\nIDENTIFIKASI\nProses identifikasi konten yang melanggar HKI mencakup perlindungan bagi pencipta karya dalam ekosistem platform sesuai standar tanggung jawab hukum tidak langsung.\nSANKSI PLATFORM\nPlatform yang membiarkan pelanggaran akan dikenakan sanksi administratif tegas demi kepatuhan kekayaan intelektual dan integritas ekosistem digital secara global.\npelanggaran \nHAK CIPTA DIGITAL", "\n\n\nREGULASI\nPLATFORM E-COMMERCE\n\nPrinsip Safe Harbor Policy melindungi platform dari konten pihak ketiga selama bertindak sebagai perantara pasif. Batas tanggung jawab ini bergantung pada kewajiban verifikasi merchant secara ketat.\n\"Kewajiban verifikasi merchant oleh penyelenggara perdagangan elektronik bertujuan guna mencegah pelanggaran hukum di marketplace.\"\nHukum \nE-COMMERCE\n\n\nINDEKS KEPATUHAN HUKUM\n94.8 SKOR", "\n\n\nVerifikasi ketat merchant dan mekanisme pelaporan proaktif sangat penting guna menjaga kepercayaan publik.\n\nINTEGRITAS\n\n\n01.\nLIABILITAS HUKUM\nPenyelenggara wajib memfilter produk untuk menghindari jeratan hukum sesuai regulasi terbaru.\n02.\nPROTEKSI KONSUMEN\nStrategi perlindungan dari penipuan pihak ketiga melalui verifikasi merchant yang transparan.\n\nKEBIJAKAN\nTANGGUNG JAWAB HUKUM\nProduk Palsu di \nMARKETPLACE\n\"Peredaran barang palsu berdampak buruk pada ekonomi dan keamanan konsumen secara global.\"\n\nPlatform kini memikul tanggung jawab hukum lebih besar dalam memfilter produk pelanggar merek untuk menghindari liabilitas yang merugikan ekosistem digital.\n", "\n\nAnalisis \nREGULASI TERKINI\nTahun 2026 menjadi titik balik penguatan regulasi transaksi elektronik melalui Permendag 19/2026 yang menekankan akuntabilitas platform secara menyeluruh di ekosistem digital.\nPerubahan besar ini menggeser fokus dari sekadar kepatuhan menjadi peran platform sebagai penjaga gerbang digital, dengan penegakan hukum ketat terhadap segala kelalaian operasional.\n\nTINJAUAN EKOSISTEM 2026\n\nREGULASI\nKEBIJAKAN E-COMMERCE\nTANGGUNG JAWAB HUKUM\n\n\nAUDIT 2026", "\n\nLEGALITAS\nKEBIJAKAN PLATFORM DIGITAL\nANALISIS KASUS / 2024 ARSIP\n\nSTUDI KASUS \nGUGATAN HUKUM PLATFORM\n\nAnalisis kasus nyata penjualan produk palsu di marketplace besar menyoroti kelalaian moderasi konten. Penggugat berargumen bahwa platform bertanggung jawab atas peredaran barang ilegal karena kurangnya pengawasan preventif.\nKasus\nPRODUK PALSU\nKelalaian moderasi marketplace\nHukum\nARGUMEN PENGGUGAT\nTanggung jawab preventif platform\nVonis\nPUTUSAN HAKIM\nFilter ketat perlindungan konsumen\n\n\nBUKTI DIGITAL A-101", "\n\nEvaluasi \nMEKANISME\n\nMenilai efektivitas pelaporan konten sesuai Kepmen Komdigi 127/2026. Analisis mendalam terhadap sistem pelaporan konten saat ini untuk menjamin kepatuhan hukum yang optimal.\n\n\nTUJUAN UTAMA\nMewujudkan sistem moderasi masa depan yang lebih adil dan responsif melalui transparansi algoritma dan pemulihan hak pengguna yang komprehensif.\n\n\nTINGKAT KEPATUHAN\n85%\n\n\nTARGET EFEKTIVITAS SISTEM PELAPORAN.\n\nKESEIMBANGAN HUKUM\nMenyeimbangkan kebebasan berpendapat dengan kewajiban hukum yang sangat ketat.\n\nREKOMENDASI TEKNIS\nPeningkatan transparansi algoritma untuk sistem moderasi yang lebih objektif.\n\n\n\nSTATUS: IMPLEMENTASI\nKEPMEN KOMDIGI / SEKTOR DIGITAL\n\nREGULASI\nPLATFORM DIGITAL INDONESIA\nFOKUS EVALUASI\nMEKANISME TAKE-DOWN", "\n\nHUKUM DIGITAL\nKEBIJAKAN PLATFORM & TANGGUNG JAWAB\nKesimpulan \nDAN DISKUSI MATERI\nRingkasan menekankan moderasi konten sebagai keseimbangan antara pedoman internal dan hukum nasional, termasuk tanggung jawab hak cipta data AI serta refleksi hukum e-commerce sebelum sesi materi berikutnya.\n\n\nTANYA JAWAB\nImplementasi PRAKTIS\n\n\nPERSIAPAN\nMateri LANJUTAN\n\nAKHIRI SESI\n\nMODUL HUKUM CYBER - PERTEMUAN AKHIR\n\n08"], "questions": [{"slide": 4, "q": "Apa hubungan community guidelines dengan hukum nasional?", "options": ["Kebijakan platform perlu diselaraskan dengan hukum", "Pedoman platform selalu mengesampingkan undang-undang", "Hukum hanya berlaku pada toko fisik", "Kebijakan internal menghapus seluruh tanggung jawab"], "answer": 0, "explanation": "Materi menekankan harmonisasi pedoman internal dengan hukum positif."}, {"slide": 5, "q": "Apa yang dimaksud moderasi hibrida?", "options": ["Gabungan algoritma dan tinjauan manusia", "Seluruh konten dihapus otomatis", "Seluruh laporan diabaikan", "Moderasi hanya melalui polling pengguna"], "answer": 0, "explanation": "Moderasi hibrida menggabungkan efisiensi teknologi dengan penilaian konteks manusia."}, {"slide": 5, "q": "Mengapa tinjauan manusia penting dalam moderasi?", "options": ["Menilai konteks yang mungkin tidak dipahami algoritma", "Menjamin semua keputusan selalu benar", "Menghapus kebutuhan prosedur pelaporan", "Menggantikan semua standar komunitas"], "answer": 0, "explanation": "Penilaian manusia dapat membantu menangani konteks dan kekeliruan deteksi otomatis."}, {"slide": 6, "q": "Apa tujuan notice and takedown?", "options": ["Melaporkan dan menindaklanjuti konten yang diduga melanggar", "Mendaftarkan badan usaha", "Menerbitkan izin fintech", "Membuat sertifikat tanda tangan"], "answer": 0, "explanation": "Mekanisme ini menghubungkan laporan pemegang hak dengan verifikasi dan tindak lanjut platform."}, {"slide": 6, "q": "Apa yang perlu diverifikasi dalam laporan pelanggaran hak cipta?", "options": ["Identitas atau kewenangan pelapor dan dasar hak yang diklaim", "Jumlah pengikut pelapor saja", "Warna profil pelapor", "Popularitas konten semata"], "answer": 0, "explanation": "Validasi diperlukan agar penanganan laporan memiliki dasar yang dapat ditelusuri."}, {"slide": 8, "q": "Mengapa verifikasi merchant relevan bagi marketplace?", "options": ["Membantu mengenali penjual dan mengurangi risiko pelanggaran", "Menjamin seluruh produk pasti asli", "Menghapus semua pengaduan", "Menggantikan seluruh kewajiban konsumen"], "answer": 0, "explanation": "Verifikasi mendukung akuntabilitas, tetapi tidak menjamin tidak ada pelanggaran."}, {"slide": 9, "q": "Apa dampak peredaran barang palsu yang dibahas?", "options": ["Merugikan kepercayaan dan keamanan konsumen", "Selalu meningkatkan kualitas pasar", "Menghapus sengketa merek", "Menjamin harga yang adil"], "answer": 0, "explanation": "Barang palsu dapat merugikan konsumen dan pemegang hak."}, {"slide": 11, "q": "Dalam kasus platform, apa yang perlu dianalisis sebelum menyimpulkan tanggung jawab?", "options": ["Peran platform, tindakan yang dilakukan, dan fakta pelanggaran", "Jumlah warna pada situs", "Popularitas penggugat saja", "Jumlah iklan tanpa melihat fakta lain"], "answer": 0, "explanation": "Studi kasus menuntut penilaian fakta dan tindakan platform, bukan kesimpulan otomatis."}, {"slide": 12, "q": "Apa tujuan transparansi mekanisme moderasi?", "options": ["Membantu pengguna memahami alasan dan proses keputusan", "Membocorkan seluruh data pribadi pengguna", "Menghapus mekanisme keberatan", "Menjamin algoritma tidak pernah salah"], "answer": 0, "explanation": "Transparansi mendukung akuntabilitas keputusan dan pemulihan hak pengguna."}, {"slide": 12, "q": "Apa indikator layanan pelaporan yang lebih baik?", "options": ["Laporan dapat dilacak dan ditindaklanjuti secara jelas", "Tidak tersedia konfirmasi penerimaan", "Tidak ada penjelasan hasil", "Semua laporan ditolak tanpa pemeriksaan"], "answer": 0, "explanation": "Pelacakan dan tindak lanjut yang jelas membantu evaluasi efektivitas mekanisme pelaporan."}]}];

try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))progress=saved;localStorage.setItem(KEY,JSON.stringify(progress));}catch{storageOK=false;}

function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',4000);}
function stats(){const items=MODULES.map(m=>progress[m.id]).filter(p=>p&&Number.isFinite(p.best));return {done:items.length,avg:items.length?Math.round(items.reduce((a,p)=>a+p.best,0)/items.length):0};}
function renderPage(p){clearInterval(ticker);page=p;quiz=null;document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===p);b.setAttribute('aria-current',b.dataset.page===p?'page':'false');});if(p==='library')library();if(p==='progress')progressPage();if(p==='about')about();window.scrollTo(0,0);}
function library(){const s=stats();main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">RUANG BELAJAR BISNIS DIGITAL</div><h1>Pahami hukumnya.<br><em>Bangun bisnisnya.</em></h1><p>Jelajahi materi kuliah, pelajari presentasi, lalu uji pemahamanmu. Satu ruang untuk belajar hukum bisnis dengan lebih terarah.</p><div class="actions"><a class="btn lime" href="#koleksi">Jelajahi materi <span>↗</span></a><button class="btn ghost" data-action="guide">Cara belajar</button></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 380 300" fill="none"><path d="M55 242H330M70 227H316M90 209H296" stroke="#e4edce" stroke-width="8" stroke-linecap="round"/><path d="M95 108L192 58L290 108Z" fill="#d9e7bd"/><path d="M108 119H277" stroke="#e4edce" stroke-width="8"/><path d="M119 132V197M167 132V197M218 132V197M265 132V197" stroke="#bad097" stroke-width="17"/><circle cx="192" cy="88" r="7" fill="#547252"/><rect x="240" y="174" width="77" height="82" rx="15" fill="#dff4ad" transform="rotate(10 240 174)"/><path d="M257 210L269 224L294 198" stroke="#264f3e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M72 80L77 65L82 80L97 85L82 90L77 105L72 90L57 85Z" fill="#b7c99c"/><circle cx="306" cy="71" r="5" fill="#cfab6b"/></svg></div></section><section class="stats" aria-label="Statistik pembelajaran"><div class="stat"><strong>9</strong><span>Modul pembelajaran</span></div><div class="stat"><strong>90</strong><span>Soal latihan</span></div><div class="stat"><strong>20 detik</strong><span>Waktu setiap soal</span></div><div class="stat"><strong>${s.done}<span style="display:inline;font-size:17px"> / 9</span></strong><span>Modul selesai dikuiskan</span></div></section><section id="koleksi"><div class="section-top"><div><div class="eyebrow" style="margin-bottom:7px">PERPUSTAKAAN MATERI</div><h2>Mulai dari rasa ingin tahu.</h2><p>Pilih pertemuan, baca materi, dan tantang pemahamanmu.</p></div><input class="search" id="search" type="search" placeholder="Cari materi atau topik…" aria-label="Cari materi" value="${esc(query)}"></div><div class="filters" aria-label="Filter materi">${['Semua','Fondasi & bisnis','Kekayaan intelektual','Siber & platform'].map(x=>`<button class="chip ${filter===x?'selected':''}" data-filter="${x}" aria-pressed="${filter===x}">${x}</button>`).join('')}</div><div id="cards" class="grid"></div><p class="small muted" style="margin-top:20px">Pertemuan 8–9 digabung mengikuti presentasi sumber. Setiap modul memiliki 10 soal.</p></section>`;cards();document.querySelector('#search').addEventListener('input',e=>{query=e.target.value;cards();});}
function cards(){const ms=MODULES.filter(m=>(filter==='Semua'||(filter==='Fondasi & bisnis'&&m.id<=3)||(filter==='Kekayaan intelektual'&&m.id>=4&&m.id<=7)||(filter==='Siber & platform'&&m.id>=8))&&(`${m.title} ${m.tag} ${m.meeting} ${m.description}`).toLowerCase().includes(query.toLowerCase().trim()));document.querySelector('#cards').innerHTML=ms.length?ms.map(m=>{const p=progress[m.id];return `<article class="card"><div class="card-top"><span class="number">${m.meeting.padStart(2,'0')}</span><span class="tag">${m.tag}</span></div><h3>${m.title}</h3><p>${m.description}</p><div class="card-meta"><span>▤ ${m.slides.length} slide</span><span>◷ 10 soal · 20 dtk/soal</span></div><div class="actions"><button class="btn" data-material="${m.id}">Buka materi ↗</button><button class="btn primary" data-start="${m.id}">Mulai kuis →</button></div><div class="best"><span>${p?.read?'Materi pernah dibuka':'Siap dipelajari'}</span><span>${Number.isFinite(p?.best)?`Terbaik ${p.best}/100`:'Belum dikuiskan'}</span></div></article>`;}).join(''):'<div class="empty"><h3>Materi tidak ditemukan</h3><p>Coba kata kunci lain atau pilih filter Semua.</p></div>';}
function showMaterial(id,idx=0){clearInterval(ticker);quiz=null;current=MODULES.find(m=>m.id===id);slideIndex=Math.max(0,Math.min(idx,current.slides.length-1));page='material';progress[id]={...progress[id],read:true};save();const m=current;main.innerHTML=`<button class="back" data-action="home">← Semua materi</button><section class="detail-head"><div><div class="eyebrow">PERTEMUAN ${m.meeting} / ${m.tag}</div><h1>${m.title}</h1><p>${m.description}</p></div><button class="btn primary" data-start="${m.id}">Mulai kuis →</button></section><div class="panel"><div class="actions"><a class="btn primary" href="${encodeURI(m.file)}" download>↓ Unduh PowerPoint asli</a><button class="btn" data-action="original">Lihat PPT online ↗</button><a class="btn" href="${DRIVE}" target="_blank" rel="noopener">Folder Google Drive ↗</a></div><p class="small muted" style="margin:13px 0 0">PowerPoint asli tersedia di paket ini. Tampilan asli dapat dibuka dengan PowerPoint/Keynote atau penampil online setelah aplikasi dipublikasikan.</p></div>${notes(m.id)}<div class="reader-layout"><aside class="slide-list" aria-label="Daftar slide">${m.slides.map((s,i)=>`<button class="slide-pick ${i===slideIndex?'selected':''}" data-slide="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(slideTitle(s))}</span></button>`).join('')}</aside><section class="panel"><div class="reader-top"><strong>Pembaca teks slide</strong><select id="slide-select" aria-label="Pilih slide">${m.slides.map((s,i)=>`<option value="${i}" ${i===slideIndex?'selected':''}>Slide ${i+1} / ${m.slides.length}</option>`).join('')}</select></div><div class="notice">Teks diekstrak dari presentasi. Gambar, tabel visual, dan tata letak asli tersedia dalam file PowerPoint.</div><div class="slide-text" id="slide-text"></div><div class="reader-top" style="margin-bottom:0"><button id="prev" class="btn" data-action="prev">← Sebelumnya</button><span id="slide-counter" class="muted small"></span><button id="next" class="btn" data-action="next">Berikutnya →</button></div></section></div>`;paintSlide();document.querySelector('#slide-select').onchange=e=>{slideIndex=Number(e.target.value);paintSlide();};window.scrollTo(0,0);}
function slideTitle(s){return s.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,2).join(' · ').slice(0,75);}
function paintSlide(){document.querySelector('#slide-text').textContent=current.slides[slideIndex].replace(/\n\s*\n(?:\s*\n)+/g,'\n\n').trim()||'Slide ini tidak memiliki teks yang dapat diekstrak. Silakan buka presentasi asli.';document.querySelector('#slide-select').value=slideIndex;document.querySelector('#slide-counter').textContent=`${slideIndex+1} / ${current.slides.length}`;document.querySelector('#prev').disabled=slideIndex===0;document.querySelector('#next').disabled=slideIndex===current.slides.length-1;document.querySelectorAll('[data-slide]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.slide)===slideIndex));}
function notes(id){let n='';if(id===3)n='Catatan pembelajaran: gunakan pembagian risiko rendah, menengah rendah, menengah tinggi, dan tinggi. Judul “skala 1 sampai 6” pada slide 8 tidak digunakan sebagai dasar soal.';if(id===7)n='Catatan pembelajaran: modifikasi GPL untuk penggunaan privat tidak otomatis wajib dipublikasikan. Kewajiban mengikuti ketentuan distribusi lisensi. Klaim Peraturan BPS 7/2026 pada slide 7 belum tervalidasi dan tidak digunakan sebagai dasar kuis.';if(id===8)n='Catatan pembelajaran: KUHP nasional mulai berlaku 2 Januari 2026, bukan September 2026 sebagaimana tertulis pada slide 8. Safe harbor bukan kekebalan otomatis. Kuis tidak menguji tanggal atau ancaman pidana yang perlu ditelaah lebih lanjut.';if(id===9)n='Catatan pembelajaran: nomor regulasi dan angka indeks pada slide 10–12 belum tervalidasi. Kuis berfokus pada konsep moderasi, verifikasi, dan penanganan laporan.';if(id===6)n='Catatan pembelajaran: hak cipta melindungi ekspresi karya, bukan otomatis setiap ide atau alur fungsional UX. Pencatatan membantu pembuktian; pelindungan bukan baru lahir karena pencatatan.';return n?`<div class="note">${n} <button class="btn ghost" data-action="guide" style="margin-top:8px;padding:5px 12px">Lihat panduan & sumber</button></div>`:'';}
function askStart(id){const m=MODULES.find(x=>x.id===id);document.querySelector('#modal-body').innerHTML=`<div class="eyebrow">LATIHAN / PERTEMUAN ${m.meeting}</div><h2 id="modal-title">Siap menguji pemahaman?</h2><p>${m.title}</p><ul><li>10 soal pilihan ganda, satu jawaban benar.</li><li>20 detik untuk setiap soal, termasuk ketika berpindah tab.</li><li>Waktu habis dihitung sebagai tidak terjawab.</li><li>Pembahasan muncul setelah menjawab. Lanjutkan saat siap.</li></ul><p class="small">Skor: 10 poin per jawaban benar. Tidak ada pengurangan nilai. Urutan pilihan diacak.</p><div class="actions"><button class="btn primary" data-begin="${id}">Mulai sekarang →</button><button class="btn" data-action="close">Nanti dulu</button></div>`;modal.showModal();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function begin(id){modal.close();page='quiz';const m=MODULES.find(x=>x.id===id);quiz={module:m,index:0,answers:[],locked:false,questions:m.questions.map(q=>{const options=shuffle(q.options.map((text,i)=>({text,correct:i===q.answer})));return {...q,options};})};window.scrollTo(0,0);question();}
function question(){clearInterval(ticker);quiz.locked=false;quiz.deadline=Date.now()+20000;const q=quiz.questions[quiz.index];main.innerHTML=`<div class="quiz-shell"><button class="back" data-action="quit">← Keluar dari kuis</button><div class="quiz-top"><div><div class="eyebrow" style="margin-bottom:5px">PERTEMUAN ${quiz.module.meeting}</div><p>${quiz.module.title}</p></div><div class="timer" id="timer" role="timer" aria-label="Sisa waktu 20 detik">20</div></div><div class="track"><span style="width:${quiz.index*10}%"></span></div><section class="panel"><div class="small muted">SOAL ${quiz.index+1} DARI 10 <span style="float:right">PILIH SATU JAWABAN</span></div><h1 class="question" tabindex="-1">${q.q}</h1><div class="options">${q.options.map((o,i)=>`<button class="option" data-answer="${i}"><span class="letter">${'ABCD'[i]}</span><span>${o.text}</span></button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="quiz-bottom"><span class="small muted">Jawaban langsung dikunci setelah dipilih.</span><button class="btn primary" id="continue" data-action="continue" disabled>${quiz.index===9?'Lihat hasil':'Soal berikutnya'} →</button></div></section></div>`;document.querySelector('.question').focus({preventScroll:true});ticker=setInterval(tick,100);tick();}
function tick(){if(!quiz||quiz.locked)return;const left=Math.max(0,Math.ceil((quiz.deadline-Date.now())/1000));const el=document.querySelector('#timer');el.textContent=left;el.setAttribute('aria-label',`Sisa waktu ${left} detik`);el.classList.toggle('urgent',left<=5);if(left===0)answer(null);}
function answer(i){if(!quiz||quiz.locked)return;if(Date.now()>=quiz.deadline)i=null;quiz.locked=true;clearInterval(ticker);const q=quiz.questions[quiz.index],correct=i!==null&&q.options[i].correct;quiz.answers.push({selected:i,correct});document.querySelectorAll('[data-answer]').forEach((b,k)=>{b.disabled=true;if(q.options[k].correct)b.classList.add('correct');else if(k===i)b.classList.add('wrong');});if(i===null)document.querySelector('#timer').textContent='0';document.querySelector('#feedback').innerHTML=`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'✓ Jawaban benar':i===null?'◷ Waktu habis':'Jawaban belum tepat'}</strong><p>${q.explanation}</p><span class="small">Rujukan: presentasi pertemuan ${quiz.module.meeting}, slide ${q.slide}${quiz.module.id===7&&q.slide===11?' · klarifikasi GNU GPL FAQ':''}.</span></div>`;document.querySelector('#continue').disabled=false;}
function results(){clearInterval(ticker);const session=quiz,m=session.module,right=session.answers.filter(a=>a.correct).length,timeout=session.answers.filter(a=>a.selected===null).length,score=right*10;const old=progress[m.id]||{};progress[m.id]={...old,best:Math.max(Number(old.best)||0,score),last:score,attempts:(Number(old.attempts)||0)+1,date:new Date().toISOString()};save();page='results';quiz=null;main.innerHTML=`<div class="quiz-shell"><section class="panel result-hero"><div class="eyebrow">LATIHAN SELESAI · PERTEMUAN ${m.meeting}</div><div class="score">${score}<small> / 100</small></div><h1>${score>=80?'Pemahamanmu semakin kuat.':score>=50?'Fondasinya sudah terbentuk.':'Mari pelajari lagi materinya.'}</h1><p>${right} benar · ${10-right-timeout} salah · ${timeout} tidak terjawab</p><p class="small">Skor terbaik: ${progress[m.id].best}/100 · Percobaan ke-${progress[m.id].attempts}</p><div class="actions"><button class="btn primary" data-start="${m.id}">Ulangi kuis ↻</button><button class="btn" data-material="${m.id}">Pelajari materi</button><button class="btn" data-action="home">Semua modul</button></div></section><section class="panel"><h2>Pembahasan jawaban</h2><p class="small">Buka setiap soal untuk meninjau pilihan dan penjelasannya.</p>${session.questions.map((q,i)=>{const a=session.answers[i];return `<details class="review"><summary>${a.correct?'✓':'○'} ${i+1}. ${q.q}</summary><p class="${a.correct?'right':'wrong-text'}">Jawabanmu: ${a.selected===null?'Tidak terjawab':q.options[a.selected].text}</p><p class="right">Jawaban benar: ${q.options.find(o=>o.correct).text}</p><p>${q.explanation}</p><button class="btn" data-review="${m.id}" data-ref="${q.slide-1}">Baca slide ${q.slide} ↗</button></details>`;}).join('')}</section></div>`;window.scrollTo(0,0);}
function progressPage(){const s=stats();main.innerHTML=`<div class="eyebrow">CATATAN BELAJAR</div><h1 style="font-size:38px">Langkah kecil, pemahaman baru.</h1><p>Riwayat latihan tersimpan di browser perangkat ini. Tidak disinkronkan antarperangkat.</p>${storageOK?'':'<div class="note">Penyimpanan browser tidak tersedia. Riwayat hanya bertahan selama sesi ini.</div>'}<section class="stats"><div class="stat"><strong>${s.done}/9</strong><span>Modul dikuiskan</span></div><div class="stat"><strong>${s.avg}</strong><span>Rata-rata skor terbaik</span></div><div class="stat"><strong>${MODULES.reduce((a,m)=>a+(Number(progress[m.id]?.attempts)||0),0)}</strong><span>Total percobaan</span></div><div class="stat"><strong>${MODULES.filter(m=>progress[m.id]?.read).length}</strong><span>Materi pernah dibuka</span></div></section><section class="panel">${MODULES.map(m=>{const p=progress[m.id]||{};return `<div class="progress-row"><div><h3>${m.meeting}. ${m.title}</h3><p>${p.attempts?`${p.attempts} percobaan · Skor terakhir ${p.last}/100`:'Belum menyelesaikan kuis'}</p></div><strong>${Number.isFinite(p.best)?p.best+'/100':'—'}</strong><button class="btn" data-start="${m.id}">Latihan →</button></div>`;}).join('')}</section><button class="btn ghost" data-action="reset">Hapus riwayat perangkat ini</button>`;}
function about(){main.innerHTML=`<section class="prose"><div class="eyebrow">PANDUAN PEMBELAJARAN</div><h1 style="font-size:38px">Ruang belajar yang mengikuti ritmemu.</h1><div class="panel"><h2>Cara menggunakan aplikasi</h2><ol><li>Pilih satu dari 9 modul pada Ruang belajar. Pertemuan 8–9 mengikuti satu file presentasi gabungan.</li><li>Buka materi untuk membaca teks setiap slide. Untuk gambar dan tata letak lengkap, unduh PowerPoint asli.</li><li>Pilih Mulai kuis. Waktu 20 detik dimulai setiap soal tampil dan tetap berjalan jika tab berpindah.</li><li>Setelah jawaban atau waktu habis, baca pembahasan. Klik Soal berikutnya saat siap. Jeda pembahasan tidak diberi timer.</li><li>Tinjau hasil dan ulangi latihan. Skor terbaik serta jumlah percobaan tersimpan di browser ini.</li></ol><h3>Akses presentasi asli</h3><p>Semua file PPTX disertakan tanpa perubahan di folder materi. Tombol unduh mengakses file masing-masing secara langsung. Tombol Lihat PPT online menggunakan Microsoft Office Viewer dan memerlukan URL aplikasi yang sudah publik serta koneksi internet. Bila penampil gagal, gunakan unduhan atau <a href="${DRIVE}" target="_blank" rel="noopener">folder Google Drive</a>.</p><h3>Sumber materi</h3><p>Sembilan presentasi yang diberikan pengguna, dengan nama pengajar pada materi: Dr. Apik Anitasari Intan Saputri, S.H., M.H. Materi menyebut Universitas Amikom Purwokerto. Kuis dan pembahasan disusun untuk latihan berdasarkan tema presentasi; bukan soal ujian resmi dari pengajar.</p><h3>Catatan penelaahan</h3><p>Presentasi asli dipertahankan. Beberapa pernyataan belum dapat dijadikan fakta hukum yang terverifikasi. Catatan modul menandai bagian yang relevan, dan kuis menghindari rincian yang belum tervalidasi. Tinjauan ini tidak merupakan audit hukum menyeluruh.</p><ul><li>Pertemuan 3, slide 8: judul skala risiko “1 sampai 6” tidak dipakai dalam kuis.</li><li>Pertemuan 6, slide 6 dan 14: bedakan ekspresi karya dari ide/fungsi; pencatatan bukan syarat timbulnya hak cipta.</li><li>Pertemuan 7, slide 7: klaim hak eksklusif basis data menurut Peraturan BPS 7/2026 belum tervalidasi. Slide 11: modifikasi privat GPL tidak otomatis wajib diumumkan.</li><li>Pertemuan 8–9, slide 8: tanggal berlakunya KUHP adalah 2 Januari 2026. Pernyataan perpindahan seluruh sanksi pada September tidak digunakan dalam kuis.</li><li>Pertemuan 10: Permendag 19/2026, Kepmen Komdigi 127/2026, angka indeks, dan contoh putusan tanpa identitas perkara belum tervalidasi dan tidak dijadikan soal fakta.</li><li>Safe harbor tidak berarti kekebalan otomatis. Penilaian tanggung jawab memerlukan hukum dan fakta yang sesuai.</li></ul><h3>Rujukan penelaahan</h3><ul><li><a href="https://www.gnu.org/licenses/gpl-faq.en.html" target="_blank" rel="noopener">GNU — FAQ lisensi GPL</a></li><li><a href="https://www.jdih.kemenkeu.go.id/dok/uu-28-tahun-2014" target="_blank" rel="noopener">JDIH Kementerian Keuangan — UU 28 Tahun 2014</a></li><li><a href="https://djpp.kemenkum.go.id/publikasi/indeks-berita/reformasi-hukum-indonesia-melalui-tiga-aturan-hukum-pidana-yang-baru" target="_blank" rel="noopener">Kementerian Hukum — Pemberlakuan aturan pidana nasional</a></li></ul><h3>Data dan penggunaan</h3><p>Aplikasi tidak meminta akun. Progres disimpan secara lokal; menghapus data browser akan menghapus riwayat. Tautan Google Drive dan penampil Office membuka layanan eksternal. Kunci jawaban tersedia dalam kode aplikasi karena latihan ini berjalan di browser, sehingga aplikasi ini ditujukan untuk belajar mandiri, bukan ujian berpengawasan.</p></div><button class="btn primary" data-action="home">Mulai belajar →</button></section>`;}
function confirmExit(next){document.querySelector('#modal-body').innerHTML=`<h2 id="modal-title">Keluar dari kuis?</h2><p>Percobaan yang belum selesai tidak disimpan. Timer soal tetap berjalan selama konfirmasi ini terbuka.</p><div class="actions"><button class="btn primary" id="exit-confirm">Keluar</button><button class="btn" data-action="close">Lanjutkan kuis</button></div>`;modal.showModal();document.querySelector('#exit-confirm').onclick=()=>{modal.close();clearInterval(ticker);quiz=null;next();};}
function navigate(p){if(page==='quiz'&&quiz)confirmExit(()=>renderPage(p));else renderPage(p);}
document.addEventListener('click',e=>{const b=e.target.closest('button,a.brand');if(!b)return;if(b.matches('a.brand')){e.preventDefault();navigate('library');return;}if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('selected',x.dataset.filter===filter);x.setAttribute('aria-pressed',x.dataset.filter===filter);});cards();return;}if(b.dataset.material){showMaterial(Number(b.dataset.material));return;}if(b.dataset.start){askStart(Number(b.dataset.start));return;}if(b.dataset.begin){begin(Number(b.dataset.begin));return;}if(b.dataset.answer!==undefined){answer(Number(b.dataset.answer));return;}if(b.dataset.slide!==undefined){slideIndex=Number(b.dataset.slide);paintSlide();return;}if(b.dataset.review){showMaterial(Number(b.dataset.review),Number(b.dataset.ref));return;}switch(b.dataset.action){case'home':navigate('library');break;case'guide':navigate('about');break;case'close':modal.close();break;case'prev':slideIndex=Math.max(0,slideIndex-1);paintSlide();break;case'next':slideIndex=Math.min(current.slides.length-1,slideIndex+1);paintSlide();break;case'continue':if(quiz?.locked){if(quiz.index===9)results();else{quiz.index++;question();window.scrollTo(0,0);}}break;case'quit':confirmExit(()=>renderPage('library'));break;case'original':if(location.protocol==='file:'||location.hostname==='terminal.local'||location.hostname==='localhost'||location.hostname==='127.0.0.1'){toast('Penampil online aktif setelah aplikasi memiliki URL publik. Gunakan Unduh PowerPoint asli sekarang.');}else{window.open('https://view.officeapps.live.com/op/view.aspx?src='+encodeURIComponent(new URL(current.file,location.href).href),'_blank','noopener');}break;case'reset':document.querySelector('#modal-body').innerHTML='<h2 id="modal-title">Hapus riwayat belajar?</h2><p>Seluruh skor dan penanda materi pada browser ini akan dihapus.</p><div class="actions"><button class="btn primary" id="reset-confirm">Hapus riwayat</button><button class="btn" data-action="close">Batal</button></div>';modal.showModal();document.querySelector('#reset-confirm').onclick=()=>{progress={};save();modal.close();progressPage();toast('Riwayat dihapus.');};break;}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
window.addEventListener('beforeunload',e=>{if(page==='quiz'&&quiz){e.preventDefault();e.returnValue='';}});
renderPage('library');

</script></body></html>
