<dialog id="modal" aria-labelledby="modal-title"><div id="modal-body"></div></dialog><div id="toast" role="status"></div><script>
const MODULES = [{"id": 1, "meeting": "1", "title": "Pengantar Hukum Bisnis & Lanskap Regulasi Ekonomi Digital", "tag": "Fondasi", "description": "Kenali hubungan hukum, kepatuhan, dan etika dalam ekosistem bisnis digital.", "file": "materi/01-Pert.-1-Pengantar-Hukum-Bisnis-Lanskap-Regulasi-Ekonomi-Digital.pptx", "slides": ["Pertemuan 1: Pengantar Hukum Bisnis & Lanskap Regulasi Ekonomi Digital\n\nDr. Apik Anitasari Intan Saputri S.H.,M.H", "Contents\n01.\nPengantar Hukum dalam Ekosistem Bisnis Digital\n02.\nManajemen Kepatuhan dan Risiko Hukum (Compliance & Risk)\n03.\nPeta Jalan Regulasi Ekonomi Digital di Indonesia\n04.\nEtika Profesi dan Tanggung Jawab Hukum Technopreneur", "01\nPengantar Hukum dalam Ekosistem Bisnis Digital", "Definisi dan Kontrak Kuliah (RPS)\n Rencana Pembelajaran Semester (RPS) dirancang untuk memberikan pemahaman komprehensif mengenai kerangka hukum yang mengatur transaksi elektronik, perlindungan data, dan hak kekayaan intelektual dalam ekonomi digital.\nStruktur Kurikulum\n Sistem evaluasi mencakup partisipasi aktif, analisis studi kasus hukum nyata, serta proyek akhir yang berfokus pada penyusunan dokumen hukum dasar bagi startup digital.\nKriteria Penilaian\n Mahasiswa ditekankan untuk menjunjung tinggi integritas ilmiah, menghindari plagiarisme dalam riset hukum, dan memahami pentingnya kepatuhan regulasi sejak dalam tahap pendidikan.\nEtika Akademik", "Karakteristik Bisnis Digital vs Konvensional\n\n\nBisnis digital mampu melakukan ekspansi pasar secara eksponensial dengan infrastruktur fisik yang minimal dibandingkan bisnis konvensional.\nSkalabilitas dan Kecepatan\nMengandalkan platform perantara dan pengumpulan data besar (big data) untuk mempersonalisasi layanan bagi konsumen secara real-time.\nModel Interaksi Pengguna\nMemiliki biaya operasional tambahan yang sangat rendah untuk setiap unit layanan baru setelah infrastruktur teknologi utama terbentuk.\nStruktur Biaya Marginal\n\n\n\n", "\n\nUrgensi Literasi Hukum bagi Technopreneur\n\nMemberikan fondasi kuat dalam mengamankan inovasi, merek, dan algoritma sebagai aset strategis perusahaan.\nPerlindungan kekayaan intelektual\n\n\n\nMemahami batasan hukum untuk meminimalkan potensi sengketa dan pelanggaran regulasi dalam menjalankan platform digital.\nMitigasi risiko operasional\nMenunjukkan kepatuhan tata kelola yang baik guna menarik pendanaan dan membangun kredibilitas di mata pemangku kepentingan.\nPeningkatan kepercayaan investor", "02\nManajemen Kepatuhan dan Risiko Hukum (Compliance & Risk)", "Pelaku bisnis wajib memastikan bahwa seluruh sistem elektronik, mulai dari penyimpanan data hingga mekanisme transaksi, mematuhi standar teknis dan hukum yang ditetapkan oleh otoritas seperti Kominfo dan Bank Indonesia.\nPrinsip Kepatuhan Regulasi (Compliance)\nStandarisasi operasional\nPerusahaan harus mampu menyelaraskan prosedur internal mereka dengan regulasi nasional serta standar internasional (seperti GDPR jika melayani pengguna global) untuk menghindari sanksi administratif dan menjaga kredibilitas di pasar.\nHarmonisasi hukum\nMelakukan evaluasi rutin terhadap kepatuhan operasional secara proaktif guna mendeteksi adanya celah hukum sebelum menjadi masalah formal yang dapat menghambat keberlangsungan bisnis.\nAudit berkala", "Pelanggaran privasi data\nRisiko kebocoran informasi pribadi konsumen dan ketidakpatuhan terhadap regulasi perlindungan data pribadi yang berlaku.\nKetidakpastian regulasi operasional\nRisiko munculnya peraturan baru yang dapat membatasi model bisnis digital atau mengubah struktur biaya operasional secara signifikan.\nPelanggaran hak kekayaan intelektual\nRisiko penggunaan tanpa izin atas merek dagang, hak cipta perangkat lunak, atau teknologi pihak ketiga dalam ekosistem digital.\nIdentifikasi Risiko Hukum dalam Bisnis Digital", "\n01\n\nImplementasi Good Corporate Governance\nMemastikan struktur tata kelola perusahaan yang transparan untuk meminimalkan penyalahgunaan wewenang dan konflik kepentingan.\nAudit Kepatuhan Regulasi Berkala\nMelakukan peninjauan rutin terhadap kepatuhan operasional guna menyesuaikan diri dengan perubahan hukum dan regulasi ekonomi digital yang dinamis.\nPerlindungan Kekayaan Intelektual dan Data\nMenyusun protokol perlindungan aset intelektual serta enkripsi data pengguna untuk mencegah kebocoran informasi dan konsekuensi hukum terkait.\nStrategi Mitigasi Risiko bagi Startup\n\n02\n\n\n03\n", "03\nPeta Jalan Regulasi Ekonomi Digital di Indonesia", "UU ITE dan Regulasi Transaksi Elektronik\n\nPayung hukum\nUU Informasi dan Transaksi Elektronik berfungsi sebagai fondasi utama yang memberikan legalitas pada dokumen elektronik dan tanda tangan digital dalam transaksi bisnis.\n\nPenegakan konten\n\nPenyelenggaraan sistem\nRegulasi ini mengatur larangan penyebaran informasi palsu (hoaks) serta konten ilegal secara sengaja, yang bertujuan untuk menjaga integritas informasi di ruang siber Indonesia.\nSetiap agen atau operator bisnis digital wajib memastikan keandalan sistem elektronik yang digunakan guna menjamin keamanan pengguna selama berinteraksi di platform mereka.\n1\n2\n3", "Pelindungan Data Pribadi (UU PDP) dan Privasi\n\n\n01\nMemastikan pemrosesan data pribadi dilakukan sesuai dengan dasar hukum yang sah dan transparan bagi subjek data.\nKepatuhan Tata Kelola Data\n\n\n02\nMenjamin pemenuhan hak individu untuk mengakses, memperbaiki, dan menghapus data pribadi mereka guna melindungi privasi di platform digital.\nHak Subjek Data\n\n\n03\nMenetapkan standar keamanan teknis dan organisasional yang ketat untuk mencegah kebocoran data serta memitigasi risiko hukum.\nKewajiban Pengendali Data", "\n\n\n\n\n\n\n\n\nRegulasi PMSE dan Hak Kekayaan Intelektual\nPerlindungan Konsumen Digital\nMewajibkan penyelenggara sarana perdagangan melalui sistem elektronik untuk menyediakan mekanisme pengaduan dan resolusi sengketa yang efektif.\nKepatuhan Lisensi HKI\nMendorong platform e-commerce untuk memvalidasi keaslian produk guna mencegah pelanggaran hak cipta dan merek dagang di pasar digital.\nHarmonisasi Regulasi Sektoral\nMenyelaraskan ketentuan Peraturan Pemerintah tentang perdagangan elektronik dengan undang-undang perlindungan data pribadi dan kekayaan intelektual.", "04\nEtika Profesi dan Tanggung Jawab Hukum Technopreneur", "\nPengembangan teknologi dan kecerdasan buatan (AI) harus menghindari bias sistemik untuk memastikan perlakuan yang adil bagi semua pengguna tanpa diskriminasi.\nKeadilan Algoritma\nPelaku usaha wajib menjaga integritas pasar dengan menghindari praktik monopoli atau penyalahgunaan posisi dominan yang dapat mematikan inovasi kompetitor kecil.\nPersaingan Sehat\nPerusahaan harus memberikan informasi yang jelas mengenai cara kerja teknologi yang mereka tawarkan, terutama terkait fitur yang dapat memengaruhi pengambilan keputusan konsumen secara signifikan.\nTransparansi Inovasi\n\n\nEtika Bisnis dalam Inovasi Teknologi", "Tanggung Jawab Hukum Penyelenggara Sistem Elektronik (PSE)\n\n\nKepatuhan sistem operasional\nMemastikan seluruh sistem elektronik beroperasi sesuai dengan standar teknis dan prosedur yang ditetapkan pemerintah.\n\n\nModerasi konten digital\nBertanggung jawab atas pengawasan dan penghapusan konten ilegal yang melanggar ketentuan hukum di platform mereka.\n\n\nPerlindungan data pribadi\nMenjamin keamanan dan kerahasiaan data pengguna sesuai dengan regulasi perlindungan data yang berlaku.", "Standar Profesional dan Integritas Digital\n\n\nKejujuran Intelektual\nMenjunjung tinggi hak kekayaan intelektual orang lain dan menghindari segala bentuk plagiarisme dalam pengembangan produk digital.\n\nAkuntabilitas Data\nMemastikan transparansi dalam pengelolaan data pengguna serta bertanggung jawab penuh atas keamanan informasi digital.\n\nKepatuhan Kode Etik\nMenjalankan praktik bisnis yang selaras dengan norma hukum dan standar moral dalam industri teknologi informasi.", "Terima kasih"], "questions": [{"slide": 6, "q": "Mengapa literasi hukum penting bagi technopreneur?", "options": ["Mengamankan inovasi dan mengurangi risiko sengketa", "Menggantikan seluruh kegiatan pemasaran", "Menjamin bisnis selalu untung", "Menghapus kebutuhan kontrak"], "answer": 0, "explanation": "Literasi hukum membantu pelindungan aset, mitigasi risiko, dan kepercayaan investor."}, {"slide": 5, "q": "Apa ciri skalabilitas bisnis digital yang dibahas dalam materi?", "options": ["Ekspansi dengan kebutuhan infrastruktur fisik relatif minimal", "Setiap pelanggan memerlukan kantor baru", "Penjualan hanya dapat dilakukan secara lokal", "Pertumbuhan selalu bergantung pada toko fisik"], "answer": 0, "explanation": "Skalabilitas memungkinkan layanan menjangkau pasar lebih luas melalui infrastruktur teknologi."}, {"slide": 8, "q": "Apa tujuan audit kepatuhan berkala?", "options": ["Mendeteksi celah hukum sebelum menjadi masalah", "Menghapus semua regulasi eksternal", "Menggantikan persetujuan pengguna", "Menjamin tidak akan ada pesaing"], "answer": 0, "explanation": "Audit membantu perusahaan mengevaluasi dan menyesuaikan kepatuhan operasional."}, {"slide": 9, "q": "Startup memakai software pihak lain tanpa izin. Risiko apa yang paling terkait?", "options": ["Pelanggaran kekayaan intelektual", "Perubahan musim penjualan", "Kekurangan inventaris fisik", "Keterlambatan pengiriman barang"], "answer": 0, "explanation": "Penggunaan software tanpa izin dapat melanggar hak cipta atau ketentuan lisensinya."}, {"slide": 10, "q": "Apa tujuan Good Corporate Governance?", "options": ["Meningkatkan transparansi dan mengurangi konflik kepentingan", "Memusatkan semua keputusan tanpa pengawasan", "Menutup informasi dari semua pemangku kepentingan", "Menggantikan izin usaha"], "answer": 0, "explanation": "Tata kelola yang transparan membantu mengurangi penyalahgunaan wewenang."}, {"slide": 13, "q": "Bagaimana prinsip pemrosesan data pribadi yang baik?", "options": ["Memiliki dasar hukum yang sah dan transparan", "Mengumpulkan semua data tanpa tujuan", "Menyimpan data tanpa pengamanan", "Mengabaikan permintaan subjek data"], "answer": 0, "explanation": "Materi menekankan dasar hukum, transparansi, dan keamanan pemrosesan data."}, {"slide": 14, "q": "Fitur apa yang mendukung perlindungan konsumen pada perdagangan elektronik?", "options": ["Mekanisme pengaduan dan penyelesaian sengketa", "Penghapusan identitas penjual", "Penolakan semua keluhan", "Penyembunyian syarat transaksi"], "answer": 0, "explanation": "Mekanisme pengaduan membantu konsumen menindaklanjuti masalah transaksi."}, {"slide": 16, "q": "Sistem AI memperlakukan kelompok pengguna secara tidak adil. Prinsip apa yang perlu diperbaiki?", "options": ["Keadilan algoritma", "Biaya marginal", "Pendaftaran domain", "Kecepatan produksi"], "answer": 0, "explanation": "Keadilan algoritma bertujuan menghindari bias dan diskriminasi dalam layanan."}, {"slide": 17, "q": "Manakah bagian tanggung jawab PSE dalam materi?", "options": ["Keamanan sistem dan pelindungan data pengguna", "Menjamin keuntungan seluruh merchant", "Mengambil alih semua hak cipta pengguna", "Membebaskan bisnis dari regulasi"], "answer": 0, "explanation": "PSE perlu memperhatikan keandalan operasional, moderasi, dan pelindungan data."}, {"slide": 18, "q": "Tindakan mana mencerminkan kejujuran intelektual?", "options": ["Menghormati karya pihak lain dan menghindari plagiarisme", "Menyalin kode tanpa memeriksa lisensi", "Menghapus nama pencipta dari karya", "Mengklaim seluruh karya internet sebagai milik sendiri"], "answer": 0, "explanation": "Kejujuran intelektual berarti menghargai hak pihak lain dan menghindari plagiarisme."}]}, {"id": 2, "meeting": "2", "title": "Hukum Kontrak Elektronik & Syarat Sah Perjanjian", "tag": "Kontrak", "description": "Pahami persetujuan digital, ToS, tanda tangan elektronik, dan penyelesaian sengketa.", "file": "materi/08-Pert.-2-Hukum-Kontrak-Elektronik-dan-Syarat-Sah-Perjanjian.pptx", "slides": ["\n\n\n\nHukum Kontrak Elektronik dan\nSyarat Sah Perjanjian\n\nTINJAUAN HUKUM SIBER DI INDONESIA\n\nDISAJIKAN OLEH\nDr. Apik Anitasari Intan Saputri S.H.,M.H\n\nUniversitas Amikom Purwokerto", "\n\n\nHUKUM KONTRAK ELEKTRONIK DAN SYARAT SAH PERJANJIAN\n\n\n01\nTujuan Pembelajaran dan Pendahuluan\n\n\n02\nKonsep Dasar Hukum Perjanjian Konvensional\n\n\n03\nPenerapan Pasal 1320 KUH Perdata dalam Konteks Digital\n\n\n04\nPerbedaan Kontrak Tradisional vs Kontrak Elektronik\n\n\n05\nAnatomi E-Contract: Terms of Service dan Kontrak Baku\n\n\n06\nKebijakan Privasi dan Perlindungan Data Pribadi\n\n\n07\nMekanisme Persetujuan: Klik-wrap vs Browse-wrap\n\n\n08\nTanda Tangan Elektronik Menurut UU ITE\n\n\n09\nSertifikat Elektronik dan Peran Balai Sertifikasi\n\n\n10\nYurisdiksi Hukum dalam Transaksi Lintas Batas\n\n\n11\nMasalah Hukum Cross-Border E-Commerce\n\n\n12\nStudi Kasus: Analisis Cacat Hukum ToS Aplikasi\n\n\n13\nKesimpulan dan Rekomendasi Praktis", "\n\nTujuan Pembelajaran dan Pendahuluan\n\n\nPemahaman Kontrak Digital\nPeserta diharapkan mampu memahami keabsahan hukum kontrak digital secara komprehensif, mencakup elemen validitas hukum dalam ekosistem digital saat ini.\n\n\nAnalisis Legalitas Transaksi\nMampu menganalisis aspek legalitas transaksi elektronik di Indonesia serta pentingnya kepastian regulasi untuk mendukung pertumbuhan ekonomi digital nasional.\n\n\nUrgensi Regulasi E-Contract\nMenjelaskan urgensi regulasi E-Contract karena kontrak baku dan transaksi digital sering memicu sengketa, sehingga KUH Perdata perlu melakukan pembenahan.\n\n\nKepastian Hukum Digital\nFokus utama sesi ini adalah memastikan validitas hukum dalam transaksi elektronik guna menciptakan lingkungan bisnis digital yang aman dan terpercaya.", "\n\n\n\nSyarat Sah & Pilar Utama Perjanjian\nBerdasarkan Pasal 1320 KUH Perdata, keabsahan kontrak bersandar pada empat pilar utama: Kesepakatan, Kecakapan, Objek Tertentu, dan Sebab yang Halal sebagai fondasi vital legalitas.\n\n\nRelevansi Klasik di Era Digital\nPenerapan nilai hukum perdata memastikan bahwa meskipun medium berubah menjadi elektronik, esensi kepastian hukum tetap terjaga sepenuhnya bagi para pihak yang terlibat dalam transaksi.\n\nKonsep Dasar Hukum Perjanjian Konvensional", "\n\n\n\n\n01\nMekanisme Konsensus Elektronik\nKesepakatan digital terbentuk melalui tindakan aktif seperti klik tombol \"Setuju\" atau \"Beli\". Hal ini merupakan manifestasi kehendak para pihak yang dilakukan secara elektronik dan sah menurut hukum.\n\n\n\n02\nVerifikasi Kecakapan Pihak\nValidasi kapasitas hukum dilakukan melalui sistem identifikasi digital, autentikasi data kependudukan, atau pernyataan mandiri pengguna secara online guna memastikan kecakapan subjek hukum.\n\n\n\n03\nValiditas Objek Digital\nProduk digital, informasi, atau jasa daring diakui sebagai objek perjanjian yang sah (objek tertentu). Syaratnya adalah memenuhi aspek kebendaan dan tidak bertentangan dengan peraturan perundang-undangan.\nPenerapan Pasal 1320 KUH Perdata dalam Konteks Digital", "\n\nPerbedaan Kontrak Tradisional vs Kontrak Elektronik\n\n\n\n01\nTransformasi Kontrak\nKontrak bertransformasi dari media kertas konvensional menjadi data elektronik yang efisien, mengubah cara interaksi hukum secara fundamental.\n\n\n\n02\nAsas Kebebasan\nAsas kebebasan berkontrak tetap berlaku di ruang siber, memberi fleksibilitas bagi para pihak menentukan klausula secara mandiri dan legal.\n\n\n\n03\nItikad Baik (Good Faith)\nPrinsip itikad baik menjadi fondasi utama e-commerce guna menjamin perlindungan hukum dan kejujuran bagi konsumen serta pelaku usaha.\n\n\n\n04\nIntegritas Kontrak\nPenerapan teknologi digital memastikan integritas kontrak elektronik setara dengan kontrak fisik tradisional dalam kekuatan pembuktian hukum.", "\n\n\n\n\n\nDefinisi dan Fungsi Terms of Service (ToS)\nTerms of Service (ToS) berfungsi sebagai kontrak adhesi yang mengatur hak dan kewajiban digital pengguna dalam transaksi elektronik. Instrumen ini menjadi standar hukum utama dalam ekosistem e-commerce modern saat ini.\n\n\nKedudukan Hukum Kontrak Baku\nKontrak baku sangat krusial dalam perlindungan konsumen karena sifatnya yang non-negotiable. Pengguna tidak dapat menegosiasikan persyaratan secara individual, sehingga pengawasan hukum menjadi sangat penting.\nAnatomi E-Contract: Terms of Service dan Kontrak Baku", "\n\nHukum Kontrak Elektronik dan Syarat Sah Perjanjian\n\n\n\nKEWAJIBAN PLATFORM\nPengelolaan Data Transparan\nPenyedia platform wajib mengelola data secara transparan dan aman sebagai bagian integral dari perjanjian elektronik guna menjamin integritas layanan digital.\n\n\n\nKEPATUHAN REGULASI\nPrivacy Policy & UU PDP\nKebijakan Privasi merupakan instrumen vital untuk memenuhi standar kepatuhan UU Perlindungan Data Pribadi dalam setiap transaksi dan kontrak elektronik.\n\n\n\nHAK PENGGUNA\nAkses & Kontrol Digital\nPengguna memiliki hak penuh untuk mengakses, memperbaiki, dan menghapus data pribadi mereka di dalam ekosistem kontrak digital yang telah disepakati bersama.\n\n\n\nPERLINDUNGAN DATA\nKewajiban Pengelolaan Data\nFokus utama pada kewajiban hukum penyedia platform dalam mengelola data pribadi pengguna secara aman sesuai dengan koridor hukum yang berlaku di Indonesia.", "\n\nMekanisme Persetujuan: Klik-wrap vs Browse-wrap\n\nPerbedaan Teknis & Legalitas Mekanisme\nMekanisme Klik-wrap mengharuskan tindakan aktif pengguna seperti mencentang kotak persetujuan, sedangkan Browse-wrap hanya mengandalkan penggunaan situs. Klik-wrap memiliki kekuatan pembuktian yang jauh lebih kuat dalam sistem hukum Indonesia karena merepresentasikan kesepakatan nyata yang dapat dibuktikan secara digital, memberikan kepastian hukum bagi para pihak yang bertransaksi secara elektronik.\n\nPraktik Terbaik Untuk Transparansi\nUntuk memastikan keabsahan perjanjian, perusahaan harus menerapkan desain antarmuka yang menonjol dan memberikan akses mudah ke dokumen hukum. Memberikan persetujuan eksplisit adalah kunci utama dalam memenuhi standar transparansi hukum. Fokus pada mitigasi risiko ini tidak hanya menjamin kepatuhan tetapi juga membangun kepercayaan pengguna jangka panjang melalui struktur kontrak elektronik yang jelas dan sah secara formal.", "\n\n\n\n\n01\nPengertian Berdasarkan Pasal 1 UU ITE\nInformasi elektronik yang terasosiasi dengan informasi lainnya sebagai alat verifikasi identitas penandatangan sesuai Pasal 1 angka 12 UU ITE.\n\n\n02\nFungsi Verifikasi dan Autentikasi\nBerfungsi secara teknis sebagai alat untuk memastikan keaslian identitas digital dan integritas dokumen elektronik yang telah ditandatangani secara sah.\n\n\n03\nLegalitas Hukum di Pengadilan\nMemiliki kekuatan dan akibat hukum yang sah dalam pembuktian di pengadilan setara tanda tangan basah selama memenuhi syarat otoritas sertifikasi.\nTanda Tangan Elektronik Menurut UU ITE", "\n\nSertifikat Elektronik dan Peran Balai Sertifikasi\n\n\nVALIDITAS HUKUM TTE\nTanda Tangan Elektronik (TTE) Tersertifikasi vs Tidak\nTTE tersertifikasi memiliki kekuatan pembuktian tertinggi karena diterbitkan oleh PSrE yang diakui pemerintah. Sebaliknya, TTE tidak tersertifikasi memiliki validitas hukum yang lebih lemah dalam sistem pembuktian digital.\n\n\nINTEGRITAS & REGULASI\nPeran PSrE dan Kekuatan Hukum Sertifikat Elektronik\nPSrE berfungsi sebagai pihak ketiga tepercaya untuk menjamin integritas dokumen. Berdasarkan regulasi, sertifikat elektronik merupakan alat bukti hukum yang sah dan mengikat secara legal dalam proses persidangan.", "\n\n\n\n\nKonsep Titik Tangkap & Pilihan Hukum\nDalam e-commerce global, Konsep Titik Tangkap menentukan hukum yang berlaku berdasarkan lokasi server atau domisili pihak. Sangat penting menyertakan Klausul Pilihan Hukum untuk kepastian hukum.\n\n\n\nPilihan Forum Penyelesaian Sengketa\nPilihan Forum diperlukan guna menetapkan pengadilan atau lembaga arbitrase yang berwenang menyelesaikan sengketa kontrak elektronik lintas negara, memberikan perlindungan hukum bagi para pihak.\nYurisdiksi Hukum dalam Transaksi Lintas Batas", "\n\nHukum Kontrak Elektronik dan Syarat Sah Perjanjian\n\n\nMasalah Hukum Cross-Border E-Commerce\n1. Tantangan Yurisdiksi: Penegakan hukum sulit saat pihak berada di negara berbeda, terutama terkait eksekusi putusan pengadilan internasional.\n2. Risiko Forum Shopping: Pelaku usaha atau konsumen cenderung memilih pengadilan yang paling menguntungkan posisi mereka secara sepihak.\n3. Harmonisasi Global: UNCITRAL mendorong standardisasi hukum digital untuk kepastian transaksi internasional. \n", "\n\nStudi Kasus: Analisis Cacat Hukum ToS Aplikasi\n\n\n\n01\nIdentifikasi Klausula Baku\nDitemukan klausul eksonerasi yang mengalihkan tanggung jawab pelaku usaha secara sepihak, sehingga merugikan posisi konsumen dalam perjanjian elektronik tersebut.\n\n\n\n02\nKetidaksesuaian Standar Hukum\nAnalisis kontrak menunjukkan pelanggaran terhadap standar UU ITE dan Pasal 18 UU Perlindungan Konsumen mengenai larangan pencantuman klausul baku tertentu.\n\n\n\n03\nContoh Pelanggaran Nyata\nPenerapan klausul pembebasan tanggung jawab sepihak atas kehilangan data atau kerugian finansial akibat kesalahan sistem yang melanggar ketentuan hukum yang berlaku.", "\n\nKesimpulan dan Rekomendasi Praktis\n\n\nRingkasan Keabsahan Kontrak\nKeabsahan kontrak elektronik wajib memenuhi Pasal 1320 KUH Perdata dan UU ITE. Pastikan transparansi dalam penyusunan klausul guna menghindari cacat hukum dalam setiap transaksi digital yang dilakukan perusahaan.\n\n\nRekomendasi Penyusunan E-Contract\nPraktisi hukum disarankan menggunakan tanda tangan tersertifikasi dan rutin melakukan audit kepatuhan regulasi terbaru untuk menjamin kepastian hukum dan memenuhi syarat legalitas yang berlaku.\n\nIlustrasi Kepatuhan Hukum Digital"], "questions": [{"slide": 4, "q": "Apa empat syarat sah perjanjian yang dibahas?", "options": ["Kesepakatan, kecakapan, objek tertentu, sebab yang halal", "Nama domain, logo, server, iklan", "Harga, diskon, ongkir, stok", "Tanda tangan, meterai, saksi, cap pada setiap kontrak"], "answer": 0, "explanation": "Materi menguraikan empat syarat Pasal 1320 KUH Perdata, yang juga relevan bagi kontrak elektronik."}, {"slide": 5, "q": "Pengguna menekan tombol Setuju setelah membaca syarat. Tindakan ini terutama menunjukkan apa?", "options": ["Manifestasi kesepakatan secara elektronik", "Pendaftaran merek", "Penerbitan izin usaha", "Pengalihan otomatis semua hak cipta"], "answer": 0, "explanation": "Tindakan aktif pengguna dapat menjadi bukti pernyataan persetujuan."}, {"slide": 7, "q": "Apa fungsi utama Terms of Service (ToS)?", "options": ["Mengatur hak dan kewajiban pengguna serta penyedia layanan", "Menggantikan seluruh undang-undang", "Menentukan warna aplikasi", "Menerbitkan sertifikat merek"], "answer": 0, "explanation": "ToS merupakan dokumen kontraktual yang mengatur hubungan penggunaan layanan."}, {"slide": 7, "q": "Apa ciri kontrak baku yang dibahas dalam materi?", "options": ["Ketentuannya disiapkan terlebih dahulu dan umumnya tidak dinegosiasikan individual", "Selalu berbentuk akta notaris", "Selalu tidak sah", "Hanya berlaku pada transaksi tunai"], "answer": 0, "explanation": "Sifat non-negotiable menjadikan transparansi dan perlindungan konsumen penting."}, {"slide": 9, "q": "Apa pembeda utama click-wrap dari browse-wrap?", "options": ["Click-wrap memerlukan tindakan persetujuan aktif", "Click-wrap hanya berlaku di toko fisik", "Browse-wrap selalu memakai sertifikat elektronik", "Keduanya selalu membutuhkan sidik jari"], "answer": 0, "explanation": "Click-wrap memakai tindakan seperti mencentang kotak, sedangkan browse-wrap mengandalkan penggunaan situs."}, {"slide": 9, "q": "Desain antarmuka mana yang mendukung persetujuan transparan?", "options": ["Syarat mudah dibuka sebelum pengguna menyetujui", "Tautan syarat sengaja disembunyikan", "Kotak persetujuan tidak dapat dibatalkan", "Syarat baru ditampilkan setelah sengketa"], "answer": 0, "explanation": "Akses yang jelas terhadap dokumen hukum membantu pengguna memahami persetujuannya."}, {"slide": 10, "q": "Apa fungsi teknis utama tanda tangan elektronik?", "options": ["Verifikasi identitas dan integritas dokumen", "Menghilangkan kebutuhan menyimpan kontrak", "Mendaftarkan hak paten", "Menjamin pihak tidak pernah bersengketa"], "answer": 0, "explanation": "TTE membantu autentikasi identitas serta mendeteksi perubahan pada dokumen sesuai mekanismenya."}, {"slide": 11, "q": "Apa peran PSrE dalam materi?", "options": ["Pihak tepercaya dalam penyelenggaraan sertifikasi elektronik", "Penentu harga produk marketplace", "Pengganti pengadilan dalam semua perkara", "Penyedia otomatis izin perdagangan"], "answer": 0, "explanation": "PSrE mendukung verifikasi identitas dan kepercayaan pada sertifikat elektronik."}, {"slide": 12, "q": "Apa tujuan klausul pilihan forum?", "options": ["Menentukan forum penyelesaian sengketa", "Menetapkan warna tombol persetujuan", "Menghapus kewajiban para pihak", "Menentukan lokasi penyimpanan foto"], "answer": 0, "explanation": "Pilihan forum membahas pengadilan atau lembaga penyelesaian sengketa yang dipilih para pihak."}, {"slide": 14, "q": "Klausul mana perlu ditelaah karena merugikan konsumen?", "options": ["Pengalihan seluruh tanggung jawab kesalahan sistem kepada pengguna", "Penjelasan fungsi layanan", "Alamat layanan pengaduan", "Penjelasan cara mengakhiri akun"], "answer": 0, "explanation": "Materi menyoroti klausul eksonerasi sepihak dan larangan klausul baku tertentu."}]}, {"id": 3, "meeting": "3", "title": "Hukum Perusahaan Startup & Perizinan OSS RBA", "tag": "Startup", "description": "Jelajahi bentuk badan usaha, NIB, KBLI, serta pendekatan perizinan berbasis risiko.", "file": "materi/07-Pert.-3-Hukum-Perusahaan-Startup-dan-Aspek-Perizinan-Berusaha-OSS-RBA.pptx", "slides": ["\n\nS\n\nSEMINAR HUKUM\n\nHukum Perusahaan\n Startup dan Aspek\nOSS RBA\n\nNavigasi Regulasi dan Kepatuhan Perizinan Berusaha \nINTEGRASI SISTEM BERBASIS RISIKO DALAM EKOSISTEM DIGITAL\n\nDISAJIKAN OLEH\nDr. Apik Anitasari Intan Saputri S.H.,M.H\nUniversitas Amikom Purwokerto\n\n\n\n", "\nDaftar Isi: Hukum Perusahaan Startup & Perizinan OSS RBA\n\n\n\n\n\n01\nPendahuluan Pertemuan Hukum Startup\n\n\n\n\n\n02\nPerbandingan Bentuk Badan Usaha Startup\n\n\n\n\n\n03\nMengenal PT Perorangan bagi Pendiri Tunggal\n\n\n\n\n\n04\nProses Pendirian Badan Usaha melalui AHU Online\n\n\n\n\n\n05\nKonsep Dasar OSS Risk-Based Approach\n\n\n\n\n\n06\nSkala Risiko Usaha 1 sampai 6 dalam OSS\n\n\n\n\n\n07\nJenis-Jenis Perizinan Berusaha\n\n\n\n\n\n08\nPerizinan Khusus Sektor Digital dan E-Commerce\n\n\n\n\n\n09\nRegulasi Spesifik Sektor Fintech dan SaaS\n\n\n\n\n\n10\nPenentuan KBLI yang Tepat untuk Startup\n\n\n\n\n\n11\nSimulasi Praktis Pembuatan NIB Fiktif\n\n\n\n\n\n12\nStudi Kasus Startup E-Commerce dan Fintech\n\n\n\n\n\n13\nRingkasan dan Kesiapan Legalitas Startup", "\nPendahuluan Pertemuan Hukum Startup\nSelamat datang di materi Pertemuan 3: Skalabilitas dan Regulasi Bisnis\n\n\nBadan Usaha Ideal\nMemilih entitas hukum yang tepat sangat krusial untuk mendukung skalabilitas bisnis digital secara berkelanjutan.\n•\nMendukung ekspansi operasional.\n•\nPerlindungan aset pendiri startup.\n\n\nSistem OSS RBA\nImplementasi standar baru perizinan berbasis risiko di Indonesia memberikan kepastian hukum bagi para pelaku usaha.\n•\nPenyederhanaan proses birokrasi.\n•\nKlasifikasi risiko usaha yang akurat.\n\n\nTujuan Pembelajaran\nPeserta diharapkan mampu menguasai aspek legalitas melalui pemahaman:\n•\nStruktur badan usaha startup.\n•\nMekanisme perizinan digital.\n•\nPeningkatan kepatuhan regulasi.", "\nPerbandingan: Bentuk Badan Usaha Startup\n\nPT: Standar Emas\nPT adalah standar emas startup karena adanya pemisahan aset pribadi yang melindungi pendiri secara hukum.\nStruktur ini memungkinkan akses modal luas, memudahkan pendanaan dari berbagai investor ventura.\n\n\nRisiko & Kredibilitas\nBerbeda dengan CV, usaha perorangan memiliki risiko harta pribadi tersita jika terjadi kerugian bisnis.\nPT menawarkan kredibilitas tinggi bagi mitra digital, menjadikannya pilihan utama bagi ekosistem startup.", "\nMengenal PT Perorangan bagi Pendiri Tunggal\nAspek Hukum dan Perizinan Berusaha Startup melalui Sistem OSS RBA\n\n\nUU Cipta Kerja\nPT Perorangan memungkinkan pendiri tunggal menjalankan badan hukum dengan proses pendirian yang sangat sederhana dan efisien.\n\n\n1\nKonsep PT Perorangan\nEntitas hukum baru untuk UMK yang didirikan oleh satu orang tanpa memerlukan akta notaris yang rumit.\n\n\n2\nKriteria & Batasan Modal\nModal wajib memenuhi kriteria usaha mikro/kecil dengan batasan tanggung jawab hukum sesuai setoran modal.\n\n\n3\nPemisahan Kekayaan\nMelindungi aset pribadi founder startup dari risiko operasional bisnis melalui pemisahan harta yang sah secara hukum.", "\n\n\nProses Pendirian Badan Usaha melalui AHU Online\n\nLangkah & Dokumen Persyaratan\n\nProses digital meliputi pengajuan nama, data perusahaan, dan input pemegang saham.\n\nMenyiapkan dokumen wajib seperti KTP, NPWP, serta pernyataan pendirian resmi.\n\nPengesahan Hukum Digital\n\nPengesahan badan hukum dilakukan secara otomatis melalui sistem terintegrasi AHU.\n\nMendukung aspek legalitas startup melalui layanan perseroan perorangan digital.", "\nKonsep Dasar OSS RBA\nTransformasi regulasi untuk kemudahan legalitas startup.\n\n01\nPerubahan Paradigma\nMengubah sistem dari berbasis izin tradisional menjadi berbasis risiko untuk menyederhanakan proses legalitas usaha.\n\n02\nTujuan Implementasi\nMeningkatkan efisiensi birokrasi serta menciptakan ekosistem bisnis yang lebih transparan dan akuntabel bagi pelaku startup.\n\n03\nLegalitas Utama NIB\nPenggunaan Nomor Induk Berusaha (NIB) sebagai identitas hukum tunggal yang wajib dimiliki oleh setiap pelaku usaha.", "\nSkala Risiko Usaha 1 sampai 6 dalam OSS\nPenjelasan tingkat risiko rendah, menengah rendah, menengah tinggi, dan tinggi dalam sistem perizinan.\n\n\n\n1\nTingkat risiko menentukan dokumen: Rendah (NIB), Menengah (NIB+Sertifikat Standar), dan Tinggi (NIB+Izin Utama).\n\n\n\n2\nSistem melakukan validasi otomatis berdasarkan skala usaha dan KBLI untuk memastikan efisiensi proses perizinan digital.\n\n\n\n3\nIntegrasi dokumen elektronik mempercepat legalitas startup, menciptakan ekosistem bisnis yang lebih transparan dan terstruktur.", "\n\nJenis-Jenis\nPerizinan Berusaha\n\n1\nNIB sebagai identitas tunggal bagi seluruh pelaku usaha startup di Indonesia.\n\n2\nSertifikat Standar untuk risiko menengah dan Izin untuk sektor risiko tinggi.\n\n", "\nPerizinan Khusus: Sektor Digital dan E-Commerce\n\n\nKlasifikasi KBLI\nLegalitas startup di Indonesia berfokus pada KBLI 63122 untuk E-Commerce guna menjamin kepatuhan operasional.\nSetiap platform wajib melalui sistem OSS RBA untuk memenuhi standar legalitas dan melindungi data pengguna secara sah.\n\n\n\nKewajiban PSE\nPendaftaran Penyelenggara Sistem Elektronik (PSE) di Kominfo sangat penting untuk menjamin keamanan operasional platform.\nKepatuhan terhadap regulasi teknologi yang dinamis memastikan startup memiliki aspek legalitas yang kokoh dan terpercaya.", "\nRegulasi Spesifik Fintech dan SaaS\n\n\n1\nKlasifikasi KBLI Bisnis SaaS\nPemilihan kode KBLI yang tepat (seperti 62029 atau 63111) sangat krusial bagi operasional software perusahaan.\n\n\n2\nKepatuhan OJK dan BI\nFintech wajib terdaftar dan memenuhi standar regulasi OJK serta Bank Indonesia untuk akses sistem pembayaran resmi.\n\n\n3\nPersyaratan Modal Minimum\nPemenuhan syarat modal disetor minimum sesuai klasifikasi risiko sektor keuangan digital untuk izin usaha.", "\n\nPenentuan KBLI yang Tepat untuk Startup\nHukum Perusahaan Startup dan Aspek Perizinan Berusaha OSS RBA\n\n\nMetode Pemilihan\nKode 5 Digit\nPilih kode sesuai model bisnis digital untuk menentukan struktur pajak dan izin operasional secara akurat agar legalitas terjamin.\n\n\n\nStudi Kasus\nIzin Spesifik\nMarketplace menggunakan KBLI 63122, sedangkan Aplikasi Payment memerlukan izin khusus sektor keuangan dari otoritas terkait.", "\n\n\nSimulasi Praktis Pembuatan NIB Fiktif\nPanduan komprehensif langkah-langkah teknis perizinan berusaha melalui platform digital.\n\n\nNavigasi Dashboard\nEksplorasi antarmuka sistem OSS RBA terbaru untuk memahami alur kerja pendaftaran secara mandiri dan efisien.\n\n\nInput Data Proyek\nProsedur pengisian data pelaku usaha serta rincian spesifik mengenai rencana proyek startup digital Anda secara akurat.\n\n\nPenerbitan Real-Time\nMempercepat operasional melalui penerbitan NIB instan untuk legalitas bisnis yang adaptif di era transformasi digital.", "\n\nStartup E-Commerce & Fintech\nAnalisis Perizinan & Mitigasi Hukum\n\n\nIzin OSS RBA: Analisis dokumen NIB dan izin usaha berbasis risiko melalui platform resmi OSS RBA untuk legalitas marketplace.\n\n\nPendaftaran PSE: Langkah krusial pendaftaran izin PSE Kominfo guna menjamin operasional dan keamanan platform digital.\n\n\nMitigasi Risiko: Perlindungan entitas bisnis sejak dini untuk menghindari sengketa kepatuhan hukum di masa depan secara efektif.", "\n\n\nRingkasan & Kesiapan Legalitas\nIntegrasi entitas bisnis dan sistem OSS RBA sebagai fondasi kepatuhan hukum startup.\n\n\n1. Struktur & Lisensi OSS\nPemilihan badan usaha (PT/CV) dan lisensi OSS RBA sangat krusial untuk memastikan kepatuhan hukum yang menyeluruh dan tepat sasaran.\n\n\n2. Daya Tarik Investasi\nKepatuhan legalitas menjadi faktor vital untuk menarik kepercayaan investor dan memfasilitasi kebutuhan scaling bisnis di era digital.\n\n\n3. Mitigasi Risiko Bisnis\nPemenuhan aspek perizinan melindungi startup dari sanksi administratif dan memberikan kepastian operasional dalam jangka panjang.\n\n\n4. Sesi Tanya Jawab\nDiskusi interaktif mengenai implementasi praktis regulasi perusahaan dan penutupan sesi materi kesiapan legalitas startup."], "questions": [{"slide": 3, "q": "Mengapa pemilihan badan usaha penting bagi startup?", "options": ["Mendukung struktur hukum dan rencana pertumbuhan", "Menggantikan kebutuhan produk yang baik", "Menjamin investor pasti mendanai", "Membebaskan semua kewajiban pajak"], "answer": 0, "explanation": "Bentuk usaha memengaruhi tata kelola, pendanaan, dan risiko pendiri."}, {"slide": 4, "q": "Apa karakter PT yang ditekankan dalam materi?", "options": ["Pemisahan kekayaan perseroan dan pribadi pemegang saham", "Tidak memerlukan tata kelola", "Seluruh utang selalu menjadi utang pribadi", "Hanya dapat menjual barang fisik"], "answer": 0, "explanation": "Pemisahan kekayaan menjadi karakter utama PT; penerapannya tetap tunduk pada ketentuan hukum."}, {"slide": 5, "q": "PT Perorangan dalam materi ditujukan untuk siapa?", "options": ["Pendiri tunggal yang memenuhi kriteria UMK", "Setiap perusahaan multinasional tanpa batas", "Kelompok tanpa identitas pendiri", "Hanya badan usaha asing"], "answer": 0, "explanation": "Materi mengenalkan perseroan perorangan untuk usaha mikro dan kecil dengan satu pendiri."}, {"slide": 6, "q": "Layanan apa yang dibahas untuk administrasi pendirian badan hukum?", "options": ["AHU Online", "e-Merek", "Portal pengaduan konsumen", "Repositori source code"], "answer": 0, "explanation": "AHU Online digunakan dalam administrasi badan hukum."}, {"slide": 7, "q": "Apa dasar pendekatan OSS RBA?", "options": ["Tingkat risiko kegiatan usaha", "Jumlah pengikut media sosial", "Warna identitas merek", "Panjang nama perusahaan"], "answer": 0, "explanation": "Risk-Based Approach mengaitkan perizinan dengan risiko kegiatan usaha."}, {"slide": 7, "q": "Apa kepanjangan NIB?", "options": ["Nomor Induk Berusaha", "Nomor Izin Beriklan", "Nama Identitas Bisnis", "Nomor Inventaris Barang"], "answer": 0, "explanation": "NIB merupakan identitas pelaku usaha dalam sistem perizinan."}, {"slide": 8, "q": "Apa yang memengaruhi kebutuhan dokumen perizinan?", "options": ["Klasifikasi dan tingkat risiko kegiatan usaha", "Jumlah unggahan promosi", "Pilihan font aplikasi", "Nama panggilan pendiri"], "answer": 0, "explanation": "Materi menghubungkan risiko kegiatan usaha dengan NIB, sertifikat standar, dan izin."}, {"slide": 12, "q": "Bagaimana prinsip memilih KBLI?", "options": ["Menyesuaikan kegiatan usaha yang benar-benar dijalankan", "Mengikuti kode pesaing tanpa pemeriksaan", "Memilih nomor yang paling pendek", "Memilih berdasarkan logo"], "answer": 0, "explanation": "KBLI harus mencerminkan kegiatan usaha, bukan sekadar kemiripan nama startup."}, {"slide": 11, "q": "Mengapa startup fintech perlu menelaah aturan sektoral?", "options": ["Jenis layanan keuangan dapat memerlukan persyaratan khusus", "Semua fintech bebas pengawasan", "NIB selalu menggantikan semua izin keuangan", "Semua fintech memiliki izin yang sama"], "answer": 0, "explanation": "Kewajiban sektoral perlu ditentukan menurut kegiatan dan otoritas yang relevan."}, {"slide": 15, "q": "Bagaimana legalitas dapat membantu pendanaan startup?", "options": ["Meningkatkan kepercayaan investor", "Menjamin valuasi tidak turun", "Menghilangkan semua risiko bisnis", "Menghapus kebutuhan laporan keuangan"], "answer": 0, "explanation": "Kepatuhan legalitas membantu kredibilitas dan kesiapan pertumbuhan bisnis."}]}, {"id": 4, "meeting": "4", "title": "Pengantar Kekayaan Intelektual & Bisnis Digital", "tag": "Kekayaan intelektual", "description": "Bedakan hak cipta, merek, paten, serta pelindungan informasi bisnis rahasia.", "file": "materi/09-Pert.-4.-Pengantar-Hukum-Kekayaan-Intelektual-HAKI-dan-Bisnis-Digital.pptx", "slides": ["\nMODUL PEMBELAJARAN KOMPREHENSIF\nPENGANTAR HUKUM KEKAYAAN\nINTELEKTUAL & BISNIS DIGITAL\n\n\nREGULASI & INOVASI\nMateri Utama\n\n\n\n\nDOSEN PENGAMPU UTAMA\nDr. apik anitasari intan saputri S.H.,M.H\nEDISI\n2026 / VOL. 1\n01\nPERLINDUNGAN ASET DIGITAL / STRATEGI BISNIS MODERN\nKLIK UNTUK MASUK\nMULAI SESI\n", "\nAGENDA\n\n\nDAFTAR ISI MATERI\nTANGGAL PERTEMUAN\n25 SEPTEMBER 2026\n\n\n01\nPEMBUKAAN\nAGENDA PERTEMUAN HARI INI\n\n\n02\nSTRATEGI\nPENTINGNYA HAKI SEBAGAI ASET STRATEGIS BISNIS\n\n\n03\nKONSEP\nDEFINISI DAN FILOSOFI DASAR PELINDUNGAN HAKI\n\n\n04\nPRINSIP\nHAK EKONOMI VS HAK MORAL\n\n\n05\nKATEGORI\nKLASIFIKASI UMUM HAK KEKAYAAN INTELEKTUAL\n\n\n06\nKONTEN\nHAK CIPTA (COPYRIGHT) DALAM DUNIA DIGITAL\n\n\n07\nINDUSTRI\nHAK KEKAYAAN INDUSTRI: PATEN DAN DESAIN INDUSTRI\n\n\n08\nIDENTITAS\nPERAN MEREK (TRADEMARK) DALAM BRANDING DIGITAL\n\n\n09\nPROSEDUR\nSTRATEGI PENDAFTARAN MEREK DI DJKI\n\n\n10\nKERAHASIAAN\nRAHASIA DAGANG (TRADE SECRETS) UNTUK TEKNOLOGI\n\n\n11\nDATA\nMELINDUNGI BASIS DATA PELANGGAN (DATABASE)\n\n\n12\nANALISIS\nSTUDI KASUS: SENGKETA MEREK DI MARKETPLACE\n\n\n13\nMITIGASI\nSTRATEGI MITIGASI RISIKO PELANGGARAN HAKI\n\n\n14\nPENUTUP\nKESIMPULAN DAN LANGKAH SELANJUTNYA", "\nAGENDA PERTEMUAN HARI INI\n\nSESI PENGANTAR HAKI & BISNIS DIGITAL\n\n\nPENGANTAR SINKRON\nSELAMAT DATANG DI SESI HAKI\n\nFokus utama sesi ini adalah menguasai perlindungan kekayaan intelektual sebagai aset strategis dalam ekosistem bisnis digital modern. Pahami bagaimana HAKI melindungi inovasi Anda di pasar yang kompetitif.\n\nSILABUS MATERI\nGAMBARAN LIMA POIN UTAMA\n\nMencakup filosofi hak moral/ekonomi, klasifikasi HAKI, pendaftaran merek di DJKI, rahasia dagang untuk algoritma, serta studi kasus sengketa marketplace yang relevan dengan industri saat ini.\n\n", "\nPENTINGNYA HAKI SEBAGAI ASET STRATEGIS BISNIS\n\nPERLINDUNGAN INOVASI DIGITAL\nFONDASI VITAL\nKEAMANAN IDE BISNIS\nHAKI melindungi inovasi dan kreativitas dari eksploitasi pihak lain. Perlindungan hukum ini menjamin keamanan ide serta memberikan nilai tambah signifikan.\n\nKEUNGGULAN KOMPETITIF GLOBAL\nIDENTITAS BRAND\nPOSISI PASAR STRATEGIS\nMenciptakan keunggulan kompetitif di pasar global, memperkuat identitas brand, dan memposisikan bisnis digital lebih unggul dibandingkan dengan pesaing.", "\n\nFILOSOFI PELINDUNGAN HAKI\nPENGANTAR HUKUM KEKAYAAN INTELEKTUAL DAN BISNIS DIGITAL\n\"Memahami esensi hak eksklusif bagi pencipta atas karya intelektualnya sebagai pilar utama inovasi dalam ekosistem hukum bisnis digital di Indonesia.\"\n\n\nDEFINISI HAKI\nHAK EKSKLUSIF\nHAKI adalah hak eksklusif bagi pencipta atas karya intelektualnya, memberikan wewenang penuh untuk mengelola hasil olah pikir manusia.\n\n\nFILOSOFI DASAR\nKESEIMBANGAN HAK\nMenjaga harmoni antara hak ekonomi kreator dan kepentingan publik, memastikan akses pengetahuan tetap terbuka bagi masyarakat umum.\n\n\nREGULASI\nPERLINDUNGAN HUKUM\nLandasan hukum Indonesia secara tegas menjamin perlindungan bagi setiap inovasi dan kreativitas intelektual di era transformasi digital.", "\n\nHAK EKONOMI VS MORAL\nPENGANTAR HUKUM KEKAYAAN INTELEKTUAL (HAKI) // V.01\n\n01\n\n\nHAK EKONOMI\nHak untuk mendapatkan keuntungan finansial dari eksploitasi karya. Hak ini memiliki batas waktu tertentu sesuai dengan ketentuan hukum yang berlaku.\n\nINTEGRASI BISNIS DIGITAL\n\n\n\n\n\n02\n\n\nHAK MORAL\nMelindungi hak pencantuman nama dan integritas karya. Hak ini melekat selamanya pada diri pencipta dan tidak dapat dihapus meskipun hak ekonomi berakhir.", "\nKLASIFIKASI UMUM HAKI\n\nHUKUM KEKAYAAN INTELEKTUAL / 2026\n\n\n\n\nBAGIAN 01\nKATEGORI BESAR\n\nHAK CIPTA & KEKAYAAN INDUSTRI\nPembagian mencakup Hak Cipta untuk karya seni/sastra serta Hak Kekayaan Industri meliputi Paten, Merek, dan Desain Industri.\n\nINOVASI & SISTEM DIGITAL\nMelindungi inovasi dan identitas bisnis melalui sertifikat elektronik DJKI.\n\nPENGELOLAAN STRATEGIS\nKolaborasi kreator, inventor, dan konsultan hukum untuk aset digital.", "\n\nHAK CIPTA DIGITAL\nHUKUM KEKAYAAN INTELEKTUAL & BISNIS\n\n\n\n\n\nPOIN 01: PERLINDUNGAN OBJEK\nCakupan Karya Dunia Digital\nHak Cipta melindungi berbagai karya kreatif mulai dari musik, film, buku, hingga kode program (software). Perlindungan ini bersifat otomatis atau deklaratif segera setelah karya tersebut diwujudkan secara nyata dalam bentuk fisik maupun digital.\nMUSIK, FILM & LITERATUR\nPERANGKAT LUNAK (SOFTWARE)\n\n\n\n\n\nPOIN 02: ASPEK PEMBUKTIAN\nUrgensi Dokumentasi Karya\nMeskipun perlindungan timbul secara otomatis, dokumentasi keaslian tetap menjadi hal krusial sebagai alat bukti hukum yang kuat. Pencatatan karya berfungsi untuk melindungi hak moral dan ekonomi pencipta di tengah ekosistem bisnis digital global.\nBUKTI KEASLIAN HUKUM\nVALIDASI HAK CIPTA DIGITAL", "\n\nHUKUM KEKAYAAN INDUSTRI / 02\nPATEN & DESAIN\n\nPerlindungan Inovasi Digital\nBISNIS DIGITAL & HAKI 2024\n\nPATEN TEKNIS\nMelindungi invensi teknologi baru, proses teknis, perangkat keras, dan algoritma sebagai solusi.\n\nDESAIN PRODUK\nPerlindungan estetika, bentuk luar, dan penampilan visual agar tidak ditiru oleh kompetitor bisnis.\n\nRELEVANSI AI\nKrusial bagi inovasi perangkat keras dan algoritma tertentu dalam ekosistem digital modern.\n\n\n\n\n\n\"Paten menjaga inti teknologi, sementara desain industri menjaga identitas visual sebuah produk.\"\n— PERSPEKTIF HUKUM INDUSTRI\n\n\nPATEN\nINVENSI TEKNIS\n\nDESAIN\nASPEK ESTETIKA\n\nFOKUS PERLINDUNGAN\n\n\n\nAlgoritma\n\nHardware\n\nUI/UX Visual\n\nProses Teknis", "\n\nBISNIS DIGITAL & HAKI\nPERAN MEREK\n\n\n\"Identitas unik yang menjadi jiwa bisnis, pembeda utama dalam ekosistem marketplace yang kompetitif untuk loyalitas jangka panjang.\"\n\nIDENTITAS BISNIS\n\nDEFINISI\nJIWA SEBUAH BISNIS\nMerek merupakan identitas unik yang menjadi representasi visual dan emosional dari nilai-nilai inti sebuah entitas bisnis digital.\n\nPEMBEDA PASAR\n\nSTRATEGI\nKOMPETISI MARKETPLACE\nBerfungsi sebagai elemen pembeda utama agar produk mudah dikenali oleh konsumen di tengah persaingan pasar global yang sangat ketat.\n\nASET STRATEGIS\n\nPROTEKSI\nPERLINDUNGAN HUKUM\nMerek berfungsi sebagai aset strategis untuk perlindungan bisnis jangka panjang melalui sistem pendaftaran kekayaan intelektual resmi.\n\nLOYALITAS PELANGGAN\n\nTUJUAN\nKEKUATAN LOGO & NAMA\nPenggunaan nama dan logo yang kuat sangat krusial untuk membangun kepercayaan serta menjaga loyalitas pelanggan secara berkelanjutan.", "\n\nSTRATEGI PENDAFTARAN MEREK\n\nHAKI & BISNIS DIGITAL\nDJKI_REG\n2024\n\nSISTEM ONLINE\nALUR PENDAFTARAN\nProsedur melalui sistem online DJKI meliputi tahap permohonan, publikasi, serta pemeriksaan formal dan substantif yang ketat.\n\nLEGALITAS\nVERIFIKASI HUKUM\nPendaftar harus memastikan merek tidak melanggar hak pihak lain dan memiliki daya pembeda kuat agar lolos verifikasi hukum.\n\nEKONOMI KREATIF\nTARIF KHUSUS UMK\nTersedia penyesuaian tarif khusus untuk UMKM guna meringankan beban biaya registrasi aset digital mereka secara resmi.\n\nBRAND STRATEGY\nFILOSOFI BISNIS\nGunakan nama unik yang mencerminkan filosofi bisnis untuk menghindari sengketa di marketplace di masa depan.", "\nRAHASIA DAGANG TEKNOLOGI\nPERLINDUNGAN HUKUM ASET DIGITAL\n\nLINGKUP PERLINDUNGAN\nALGORITMA & MODEL BISNIS\n\nPerlindungan informasi bisnis rahasia mencakup algoritma perangkat lunak kompleks dan model bisnis yang unik untuk mempertahankan keunggulan kompetitif di pasar.\n\nKRITERIA UTAMA\nKESIAPAN ERA KECERDASAN AI\n\nKriteria mencakup nilai ekonomi, kerahasiaan terjaga, dan upaya perlindungan khusus sesuai standar kesiapan AI untuk keamanan data teknologi mutakhir.\n\n", "\nMELINDUNGI BASIS DATA PELANGGAN\n\nASET DIGITAL & RAHASIA DAGANG\nURGENSI KEAMANAN\nPERLINDUNGAN REZIM HUKUM DJKI\nBasis data pelanggan adalah aset strategis. Keamanan data sangat mendesak guna mencegah kerugian kompetitif dari pencurian oleh kompetitor atau mantan karyawan melalui perlindungan Rahasia Dagang.\n\nNON-DISCLOSURE AGREEMENT (NDA)\nLANGKAH PREVENTIF\nINSTRUMEN HUKUM OPERASIONAL\nPenerapan NDA wajib dilakukan untuk mengikat staf dan mitra bisnis. Hal ini memastikan kewajiban hukum untuk menjaga kerahasiaan data perusahaan dan mencegah penyebaran informasi secara ilegal.", "\n\nSENGKETA MEREK MARKETPLACE\nANALISIS PELANGGARAN HAKI DI E-COMMERCE\n\"Analisis konflik peniruan brand di e-commerce menunjukkan penguatan pelindungan bagi UMKM terhadap pelanggaran kekayaan intelektual secara digital.\"\n\n\nREGULASI\nPELINDUNGAN UMKM\nPenguatan regulasi pasar digital guna melindungi pelaku usaha kecil dari praktik peniruan identitas brand yang merugikan ekosistem.\n\n\nSANKSI\nKONSEKUENSI HUKUM\nPenggunaan merek tanpa izin berdampak pada sanksi hukum serius seiring pengetatan pengawasan transaksi elektronik oleh pemerintah.\n\n\nRESOLUSI\nJALUR SENGKETA\nPenyelesaian melalui litigasi (gugatan) atau non-litigasi seperti mediasi dan fitur pelindungan HAKI pada platform marketplace.", "\n\nSTRATEGI MITIGASI RISIKO HAKI\nPENGANTAR HUKUM KEKAYAAN INTELEKTUAL DAN BISNIS DIGITAL // V.01\n\n01\n\n\nAUDIT INTERNAL\nMelakukan audit internal secara rutin terhadap aset intelektual perusahaan untuk memastikan semua hak terlindungi sepenuhnya.\n\nPERLINDUNGAN BISNIS DIGITAL\n\n\n\n\n\n02\n\n\nLANGKAH PREVENTIF\nPemantauan pasar berkala untuk deteksi pemalsuan dan langkah preventif sebelum peluncuran produk baru ke publik.\nManfaatkan kemudahan pendaftaran merek DJKI khusus UMKM demi ketenangan operasional bisnis.", "\nKESIMPULAN & LANGKAH\n\nHUKUM KEKAYAAN INTELEKTUAL / 2026\n\n\n\n\nRINGKASAN\nPOIN UTAMA\n\nFONDASI PERTUMBUHAN 2026\nHAKI adalah aset strategis dan fondasi hukum krusial bagi startup digital 2026. Melindungi algoritma dan merek sejak dini mencegah sengketa di marketplace.\n\nDAFTAR PERIKSA KEPATUHAN\n1. Audit Aset (Merek/Cipta) | 2. Pendaftaran DJKI | 3. Monitoring Pelanggaran.\n\nTANYA JAWAB & PENUTUP\nMari diskusikan strategi perlindungan aset Anda. Terima kasih."], "questions": [{"slide": 4, "q": "Mengapa kekayaan intelektual merupakan aset strategis?", "options": ["Dapat memperkuat keunggulan kompetitif bisnis", "Selalu menjamin monopoli seluruh pasar", "Menggantikan kualitas produk", "Menghapus persaingan"], "answer": 0, "explanation": "Pelindungan aset intelektual mendukung nilai bisnis dan identitas produk."}, {"slide": 5, "q": "Apa keseimbangan yang dibahas dalam filosofi HKI?", "options": ["Kepentingan pemegang hak dan kepentingan publik", "Warna logo dan ukuran layar", "Pendapatan dan jumlah pegawai saja", "Harga server dan biaya listrik"], "answer": 0, "explanation": "Filosofi pelindungan mempertimbangkan hak pemilik dan akses masyarakat."}, {"slide": 6, "q": "Manakah contoh hak moral pencipta?", "options": ["Pencantuman nama pencipta", "Penetapan tarif pajak", "Penerbitan NIB", "Pendaftaran badan usaha"], "answer": 0, "explanation": "Atribusi dan integritas karya berkaitan dengan hak moral."}, {"slide": 6, "q": "Manakah yang berkaitan dengan hak ekonomi?", "options": ["Pemanfaatan komersial karya melalui lisensi", "Penentuan alamat domisili", "Pembuatan nomor telepon", "Pemilihan badan usaha"], "answer": 0, "explanation": "Hak ekonomi berkaitan dengan pemanfaatan karya dan manfaat ekonominya."}, {"slide": 7, "q": "Manakah pasangan yang termasuk kekayaan industri?", "options": ["Paten dan merek", "NIB dan NPWP", "ToS dan privacy policy", "Domain dan alamat email secara otomatis"], "answer": 0, "explanation": "Materi membedakan hak cipta dari kekayaan industri, seperti paten, merek, dan desain industri."}, {"slide": 8, "q": "Kapan prinsip pelindungan hak cipta otomatis berlaku?", "options": ["Saat ciptaan diwujudkan dalam bentuk nyata sesuai persyaratan hukum", "Hanya setelah karya menjadi viral", "Hanya setelah memperoleh investor", "Setelah nama domain dibeli"], "answer": 0, "explanation": "Prinsip deklaratif dikaitkan dengan perwujudan ciptaan, bukan popularitasnya."}, {"slide": 10, "q": "Apa fungsi utama merek dalam pasar?", "options": ["Membedakan barang atau jasa", "Menggantikan izin operasional", "Memberi hak atas semua ide bisnis", "Menghapus kontrak dengan pelanggan"], "answer": 0, "explanation": "Merek membantu konsumen mengenali dan membedakan sumber barang atau jasa."}, {"slide": 12, "q": "Apa unsur penting informasi sebagai rahasia dagang?", "options": ["Rahasia, bernilai ekonomi, dan dijaga kerahasiaannya", "Sudah diumumkan luas tanpa batas", "Tidak memiliki nilai bisnis", "Wajib ditempel di situs publik"], "answer": 0, "explanation": "Materi menekankan sifat rahasia, nilai ekonomi, dan upaya pelindungan."}, {"slide": 13, "q": "Apa fungsi NDA bagi staf dan mitra?", "options": ["Mengatur kewajiban menjaga informasi rahasia", "Mengalihkan otomatis seluruh merek", "Menerbitkan izin usaha", "Menggantikan semua pengamanan teknis"], "answer": 0, "explanation": "NDA membantu menetapkan kewajiban kerahasiaan para pihak."}, {"slide": 15, "q": "Apa contoh mitigasi risiko HKI sebelum peluncuran?", "options": ["Audit aset intelektual dan penelusuran hak pihak lain", "Mengabaikan lisensi agar cepat diluncurkan", "Menyalin logo pesaing", "Menghapus dokumentasi pengembangan"], "answer": 0, "explanation": "Audit dan pemantauan membantu mendeteksi risiko pelanggaran lebih dini."}]}, {"id": 5, "meeting": "5", "title": "Strategi Pelindungan Merek & Rahasia Dagang", "tag": "Kekayaan intelektual", "description": "Pelajari klasifikasi merek, NDA, dan langkah menjaga informasi strategis.", "file": "materi/06-Pert.-5-Strategi-Pelindungan-Merek-dan-Rahasia-Dagang-di-Era-Digital.pptx", "slides": ["\n\n\nWAWASAN STRATEGIS TENTANG HAK KEKAYAAN INTELEKTUAL\n& KEAMANAN DATA DI EKOSISTEM DIGITAL\n\n\nStrategi Pelindungan Merek dan Rahasia Dagang di Era Digital.\n\nLAPORAN KHUSUS\n\n\nDIPRESENTASIKAN OLEH\nDr. Apik Anitasari Intan Saputri S.H.,M.H\n\nDIGITAL\n\nLEGAL SOLUTIONS", "\n\nDJKI\n\nDIGITAL PROPERTY RIGHTS 2026\n25 September 2026\n\nDaftar Isi\n\n\nBAGIAN 01\nPendahuluan dan Tujuan Pembelajaran\n\n\nBAGIAN 02\nPendaftaran Merek via e-Merek DJKI\n\n\nBAGIAN 03\nLangkah Pendaftaran Merek Online\n\n\nBAGIAN 04\nPersyaratan Dokumen Administrasi\n\n\nBAGIAN 05\nAlur Proses dan Timeline Pendaftaran\n\n\nBAGIAN 06\nStruktur Biaya Pendaftaran Merek\n\n\nBAGIAN 07\nAnalisis Nice untuk Bisnis Digital\n\n\nBAGIAN 08\nStrategi Kelas 9 dan Kelas 35\n\n\nBAGIAN 09\nStrategi Kelas 38 dan Kelas 41\n\n\nBAGIAN 10\nStrategi Kelas 42: SaaS dan Cloud\n\n\nBAGIAN 11\nPerjanjian Kerahasiaan (NDA) Strategis\n\n\nBAGIAN 12\nJenis NDA: Unilateral vs Mutual\n\n\nBAGIAN 13\nCakupan dan Durasi Rahasia Dagang\n\n\nBAGIAN 14\nSanksi Pelanggaran Rahasia Dagang\n\n\nBAGIAN 15\nPelindungan dari Insider Threat\n\n\nBAGIAN 16\nStrategi Mitigasi dan Audit Trail\n\n\nBAGIAN 17\nStudi Kasus: Bad Faith Merek Digital\n\n\nBAGIAN 18\nPutusan Pengadilan dan Pelajaran\n\n\nBAGIAN 19\nKesimpulan dan Rencana Aksi", "\nNOLAJ\n\nLEGAL STRATEGY\n\nPendahuluan & Tujuan.\n\n\nBAGIAN 01\n\nStrategi\nPendaftaran\nSaaS\n\nMerancang strategi pendaftaran dan mitigasi risiko intelektual bagi perusahaan platform online.\n\n\nBAGIAN 02\n\nPelindungan\nAset Digital\n100%\n\nMemahami urgensi penguatan pelindungan rahasia dagang untuk mengamankan aset strategis bisnis.\n\n\nBAGIAN 03\n\nSinergi\nRegulasi\nDJKI\n\nKolaborasi dengan mitra internasional untuk memperkuat ekosistem pelindungan kekayaan intelektual.\n", "\n\n\n\nDJKI\n\nKEMENKUMHAM RI\n\nSistem\ne-Merek.\nPENDAFTARAN DIGITAL EFISIEN\n\n\nWAWASAN AHLI\nDJKI mempromosikan e-Merek untuk efisiensi pendaftaran melalui strategi digital yang menghemat waktu dan biaya. Terdapat penyesuaian tarif terbaru di mana pelaku UMK tetap mendapatkan keringanan biaya khusus untuk mendukung daya saing ekonomi kreatif di era digital saat ini secara menyeluruh.", "\n\nDJKI\n\nPENDAFTARAN MEREK\nStrategi Pelindungan Merek Digital\nLangkah \nPendaftaran\n Merek Online.\n\n\n\n02\nInput Data Detail\nTahapan input data merek dan pengunggahan dokumen digital label merek.\n\n\nPastikan semua informasi akurat untuk mempermudah alur proses verifikasi dan mitigasi risiko penolakan di masa depan. Unggah dokumen persyaratan digital seperti surat pernyataan hak dengan teliti.\n\n01\nBuat Akun e-Merek\nProsedur teknis dimulai dengan pembuatan akun di sistem e-Merek melalui situs resmi DJKI.\nAkurat\nProses Verifikasi\n", "\nDJKI\n\nPELINDUNGAN MEREK\n\n\nDAFTAR DOKUMEN YANG DIPERLUKAN SEPERTI LABEL MEREK DAN SURAT PERNYATAAN KEPEMILIKAN UNTUK PENDAFTARAN RESMI.\nPersyaratan &\nAdministrasi.\nMISI ADMINISTRASI\n\"Menjamin kepastian hukum melalui kelengkapan dokumen identitas dan bukti kepemilikan hak kekayaan intelektual.\"\n\nProses pendaftaran menuntut ketelitian dalam penyampaian label digital, surat pernyataan, serta bukti pembayaran PNBP untuk memvalidasi hak eksklusif pemilik merek di era digital.\n\n\nDokumen Utama Merek\nMenyertakan Label Merek dalam format digital, Surat Pernyataan Kepemilikan yang sah, dan Bukti Bayar PNBP resmi.\n\n\nPemohon Perorangan\nPersyaratan identitas diri yang mencakup KTP atau dokumen identitas resmi lainnya bagi pendaftar individu.\n\n\nBadan Hukum\nWajib melampirkan Akta Pendirian perusahaan dan surat pengesahan resmi dari instansi pemerintah terkait.\n\n\nKategori UMK\nFasilitas kemudahan bagi UMK melalui penyertaan Surat Keterangan Binaan sesuai regulasi Permenkum nomor 5 tahun 2026.\n", "\n\n\n\n\nDJKI\n\nALUR PENDAFTARAN\n\nAlur Proses &\nTimeline Merek.\n\n\nTAHAPAN PENGUMUMAN\nMasa pengumuman 2 bulan untuk oposisi publik setelah permohonan online diajukan ke e-Merek DJKI.\n\n\nPEMERIKSAAN & SERTIFIKAT\nPemeriksaan substantif 150 hari kerja. Sertifikat terbit dalam 2 bulan mengikuti standar layanan 2026.", "\n\n\nSTRATEGI\n\nERA DIGITAL\n\nStruktur Biaya\nPendaftaran.\n\n\nRINCIAN BIAYA PNBP UNTUK KATEGORI UMKM DAN UMUM SESUAI KETENTUAN SEPTEMBER 2026.\nPELINDUNGAN MEREK\n\nKETENTUAN TARIF PNBP TERBARU\n\n\nKategori UMKM\nRp500.000 per kelas (online). Wajib melampirkan dokumen pendukung UMKM yang valid untuk mendapatkan tarif khusus ini.\n\n\nKategori Umum\nRp1.800.000 per kelas (online). Berlaku untuk pemohon non-UMKM dengan sistem perhitungan biaya kelipatan per kelas tambahan.\n\n\nSistem Multi-Kelas\nBiaya dihitung per kelas barang/jasa. Permohonan dengan beberapa kelas akan dikenakan biaya tambahan sesuai kategori pemohon.", "\n\nSTRATEGI\n\nERA DIGITAL\n\nAnalisis Nice Classification \nuntuk Bisnis Digital.\n\n\nSistem Global\n\n01\nEd. 13\nWIPO akan menerapkan edisi ke-13 pada 1 Januari 2026 guna memperkuat proteksi hukum merek internasional.\n\n\nKetepatan Kelas\n\n02\nHak Eksklusif\nPemilihan kelas yang akurat menentukan luas cakupan hak eksklusif dan perlindungan platform di pasar global.\n\n\nProteksi Merek\n\n03\n2026\nKlasifikasi barang dan jasa internasional menjadi esensial untuk jangkauan perlindungan hukum merek digital.", "\n\n\nPELINDUNGAN KEKAYAAN INTELEKTUAL\n\n\nKelas 9\nMencakup perangkat lunak (software) dan aplikasi seluler sebagai aset inti teknologi digital Anda.\n\n\nKelas 35\nMelindungi manajemen bisnis digital serta periklanan online agar identitas platform tetap eksklusif.\n\n\nIntegrasi kelas ini sangat krusial untuk menghadapi tantangan AI dan pengiklanan modern serta memastikan skalabilitas bisnis jangka panjang di pasar global.\n\nSTRATEGI\n\nERA DIGITAL\n\nMELINDUNGI ASET INTI TEKNOLOGI MELALUI PEMILIHAN KELAS PENDAFTARAN YANG TEPAT DAN STRATEGIS.\nKelas 9 &\nKelas 35.\nFOKUS PENDAFTARAN MEREK\n", "\n\n\nINTEGRASI ASET STRATEGIS\n\nKELAS 38\nLayanan Transmisi & Akses Internet\n\nKELAS 41\nHiburan Digital & Pelatihan Online\n\nHAKI DIGITAL\n\nERA KONEKTIVITAS\n\n\n\nPerlindungan merek di era digital kini berfokus pada sektor telekomunikasi dan hiburan untuk mitigasi risiko pelanggaran di masa depan.\nStrategi\nKelas 38 & 41.\nKONEKTIVITAS DAN KONTEN\n", "\nERA DIGITAL\n\nSTRATEGI MEREK\n\n\nPELINDUNGAN KHUSUS UNTUK PENYEDIA SOFTWARE AS A SERVICE (SAAS), RISET, DAN KOMPUTASI AWAN.\nStrategi Kelas 42:\nSaaS dan Cloud.\nINTI TEKNOLOGI\nKelas 42 memberikan pelindungan krusial bagi fondasi bisnis digital melalui standar hukum perlindungan data yang ketat.\n\n\nLayanan Komputasi Awan\nFondasi utama untuk skalabilitas infrastruktur digital modern.\n\n\nKeamanan Data Pengguna\nImplementasi program pelindungan data pribadi yang terstruktur.\n\n\nRiset & Pengembangan\nInovasi teknologi berkelanjutan untuk menjaga daya saing pasar.\n\n\nSAAS V.42", "\nSTRATEGI IP\n\nERA DIGITAL 2024\n\n\nMEMPERKUAT EKOSISTEM PLATFORM DIGITAL MELALUI\nMITIGASI RISIKO KEBOCORAN DATA STRATEGIS.\nPerjanjian\nKerahasiaan (NDA).\n\n\nIdentitas Pihak\nMenetapkan subjek hukum yang terlibat secara jelas untuk memastikan akuntabilitas dalam menjaga data sensitif.\n\n\nBatasan Rahasia\nKlasifikasi mendalam mengenai apa yang termasuk informasi rahasia, termasuk aset digital dan teknis perusahaan.\n\n\nDurasi & Sanksi\nPenetapan jangka waktu perlindungan serta konsekuensi hukum yang tegas bagi setiap bentuk pelanggaran kontrak.\n\n\nIde Bisnis\nMelindungi konsep inovatif dan strategi pasar agar tidak dieksploitasi oleh kompetitor selama proses negosiasi.\n\n\nAlgoritma Digital\nPerlindungan terhadap kekayaan intelektual berupa kode sumber dan algoritma yang menjadi inti operasional platform.\n\n\nSinergi Institusi\nKolaborasi DJKI dan DKPTO memperkuat NDA sebagai instrumen mitigasi risiko kebocoran data pada ekosistem digital.\n", "\nSTRATEGI\n\nERA DIGITAL\n\nJenis NDA: Unilateral vs Mutual.\n\n\nTIPE 01\n\nNDA\nUnilateral\nSatu Arah\n\nDigunakan untuk karyawan guna mencegah kebocoran internal di mana informasi hanya mengalir dari perusahaan ke individu.\n\n\nTIPE 02\n\nNDA\nMutual\nDua Arah\n\nDiterapkan pada kemitraan strategis saat kedua pihak saling berbagi data sensitif untuk kolaborasi bisnis digital.\n\n\nPANDUAN\n\nKapan\nDigunakan?\nStrategi Tepat\n\nPilih Unilateral untuk kontrol internal; pilih Mutual untuk merger atau integrasi sistem API dengan partner eksternal.\n", "\n\n\nAnalisis Proteksi Informasi\n\nDEFINISI SENSITIF\nMetode produksi & nilai ekonomi teknologi informasi.\nBATAS WAKTU\nKetentuan pasca-kontrak dan validitas perjanjian kerja.\n\nSTRATEGI\n\nMEREK & RAHASIA\n\nCakupan &\nDurasi.\nRAHASIA DAGANG DIGITAL\n\n\nWAWASAN AHLI\nInformasi sensitif mencakup metode produksi, teknologi, atau bisnis yang memiliki nilai ekonomi. Pelindungan ini diperkuat melalui sinergi DJKI dan DKPTO guna mencegah kebocoran data di era digital. Durasi kerahasiaan harus ditentukan secara tegas dalam kontrak, tetap berlaku efektif bahkan setelah hubungan kerja berakhir.", "\n\n\nSTRATEGI\n\nERA DIGITAL\nPelindungan Merek dan Rahasia Dagang\nSanksi \nPelanggaran\n Rahasia.\n\n\n\nADR\nLitigasi & Arbitrase\nPenyelesaian sengketa kebocoran informasi melalui pengadilan negeri atau jalur arbitrase.\n\n\nPenegakan Non-Disclosure Agreement (NDA) sangat krusial untuk memitigasi risiko pembocoran data oleh pihak internal maupun eksternal perusahaan digital. Mekanisme hukum yang tegas menjamin keberlangsungan inovasi dan kerahasiaan aset bisnis yang paling berharga di era kompetisi global.\n\nUU 30\nTahun 2000\nPelanggar dikenakan klausul ganti rugi materiil serta konsekuensi pidana penjara atau denda sesuai regulasi.\nNDA\nMitigasi Risiko Data\n", "\nSTRATEGI DIGITAL\n\nRAHASIA DAGANG 2024\n\n\nMENJAGA INTEGRITAS BISNIS MELALUI PENGAWASAN KETAT\nTERHADAP AKSES INFORMASI INTERNAL YANG BERSIFAT RAHASIA.\nPembajakan\nInternal.\nDASAR HUKUM\n\"Pelanggaran rahasia dagang oleh pihak dengan akses sah yang menyalahgunakan informasi sensitif.\"\n\nBerdasarkan UU No. 30 Tahun 2000, ancaman internal melibatkan penyalahgunaan kepercayaan oleh oknum yang secara sadar membocorkan rahasia demi keuntungan tertentu.\n\n\nPencurian Data Sensitif\nRisiko utama melibatkan pengambilan data pelanggan atau dokumen rahasia oleh karyawan untuk kepentingan kompetitor.\n\n\nKebocoran Algoritma\nPenyalahgunaan akses kode sumber atau algoritma teknis oleh pihak terafiliasi yang merugikan nilai kompetitif perusahaan.\n\n\nPengawasan Ketat\nMitigasi memerlukan sistem monitoring akses data yang real-time untuk mendeteksi anomali perilaku pengguna internal.\n\n\nSanksi Hukum Tegas\nPenerapan tindakan hukum pidana dan perdata sesuai regulasi untuk memberikan efek jera terhadap pelanggar internal.\n", "\n\n\n\n\nRAHASIA DAGANG\n\nERA DIGITAL\n\nStrategi Mitigasi\ndan Audit Trail.\n\n\nAKSES TERBATAS & LOG\nImplementasi RBAC untuk akses terbatas dan log aktivitas sebagai alat pembuktian hukum internal.\n\n\nSINKRONISASI UU PDP\nAudit keamanan rutin untuk sinkronisasi dengan UU PDP guna mencegah kebocoran data perusahaan.", "\n\n\nSTRATEGI\n\nERA DIGITAL\n\nSengketa\nMerek Digital.\n\n\nANALISIS TERHADAP PENDAFTARAN DOMAIN DAN MEREK OLEH PIHAK KETIGA DENGAN ITIKAD TIDAK BAIK.\nSTUDI KASUS HUKUM\n\nYURISPRUDENSI & PERLINDUNGAN HUKUM\n\n\nAnalisis Cybersquatting\nPenyerobotan domain populer oleh pihak ketiga demi keuntungan ilegal dan eksploitasi reputasi merek terkenal secara global.\n\n\nItikad Tidak Baik\nKriteria pendaftaran yang meniru merek terkenal atau menghalangi kompetitor berdasarkan standar yurisprudensi di Indonesia.\n\n\nMitigasi & Penegakan\nPentingnya langkah preventif dan penegakan hukum tegas terhadap pendaftaran yang membonceng ketenaran pihak lain.", "\n\nLEGALITAS\n\nDIGITAL ERA\n\nPutusan Pengadilan dan Pelajaran Berharga.\n\n\nHasil Putusan\n\n01\nBad Faith\nPengadilan membatalkan merek yang didaftarkan dengan iktikad buruk guna melindungi hak pemilik asli.\n\n\nLangkah Preventif\n\n02\nRiset & Daftar\nLakukan riset komprehensif dan daftarkan merek segera untuk menghindari potensi sengketa hukum.\n\n\nProteksi Berlanjut\n\n03\nMonitor\nPantau pendaftaran merek serupa secara berkala untuk menjaga integritas aset kekayaan intelektual Anda.", "\n\n\nLANGKAH KONKRET PENGAMANAN IP\n\n\nProteksi Identitas\nGunakan e-Merek dan NDA ketat untuk menjaga aset internal dari ancaman insider secara menyeluruh.\n\n\nAudit & Pemantauan\nAudit rutin dan akses terbatas untuk mencegah cybersquatting serta penyalahgunaan merek digital.\n\n\n\nIP PROTECT\n\nDIGITAL STRATEGY\n\nINTEGRASI MEREK DAN RAHASIA DAGANG SEBAGAI PILAR UTAMA KEAMANAN KEKAYAAN INTELEKTUAL DIGITAL.\nKesimpulan\n& Aksi.\nSTRATEGI PELINDUNGAN STARTUP\n"], "questions": [{"slide": 5, "q": "Apa langkah awal teknis pendaftaran merek daring yang dibahas?", "options": ["Membuat akun pada sistem resmi e-Merek", "Memesan ulasan palsu", "Membagikan kata sandi perusahaan", "Menghapus identitas pemohon"], "answer": 0, "explanation": "Materi mengenalkan pembuatan akun dan pengisian data pada layanan resmi."}, {"slide": 6, "q": "Mengapa dokumen pendaftaran perlu lengkap dan akurat?", "options": ["Mendukung pemeriksaan administratif permohonan", "Menjamin permohonan pasti diterima", "Menghapus pemeriksaan substantif", "Menggantikan daya pembeda merek"], "answer": 0, "explanation": "Kelengkapan mendukung proses pemeriksaan, tetapi tidak menjamin penerimaan merek."}, {"slide": 9, "q": "Apa kegunaan Nice Classification?", "options": ["Mengelompokkan barang dan jasa untuk pendaftaran merek", "Mengukur risiko kredit", "Menetapkan pajak perusahaan", "Mengklasifikasikan serangan siber"], "answer": 0, "explanation": "Pemilihan kelas membantu mengidentifikasi barang atau jasa yang dimohonkan."}, {"slide": 10, "q": "Kelas yang dibahas untuk software sebagai barang adalah?", "options": ["Kelas 9", "Kelas 35", "Kelas 38", "Kelas 41"], "answer": 0, "explanation": "Materi mengaitkan kelas 9 dengan software; rincian jenis barang tetap perlu diperiksa."}, {"slide": 12, "q": "Kelas yang dibahas untuk layanan SaaS adalah?", "options": ["Kelas 42", "Kelas 9", "Kelas 35", "Kelas 38"], "answer": 0, "explanation": "Materi menempatkan Software as a Service dalam pembahasan kelas 42."}, {"slide": 13, "q": "Apa yang perlu diperjelas dalam NDA?", "options": ["Informasi yang dirahasiakan dan kewajiban para pihak", "Hanya warna dokumen", "Hanya slogan perusahaan", "Jumlah unggahan media sosial"], "answer": 0, "explanation": "NDA perlu mengatur pihak, lingkup informasi, durasi, dan konsekuensi pelanggaran."}, {"slide": 14, "q": "Kapan NDA mutual tepat digunakan?", "options": ["Kedua pihak saling mengungkap informasi rahasia", "Hanya satu pihak memberi informasi", "Semua informasi telah tersedia untuk umum", "Tidak ada pihak yang berbagi informasi"], "answer": 0, "explanation": "NDA mutual mengatur kewajiban kerahasiaan dua arah."}, {"slide": 17, "q": "Karyawan mengambil data rahasia untuk pesaing. Risiko apa yang dicontohkan?", "options": ["Penyalahgunaan akses oleh pihak internal", "Kekurangan kapasitas server", "Kegagalan promosi musiman", "Perubahan klasifikasi barang"], "answer": 0, "explanation": "Akses yang sah tidak berarti pengguna boleh menyalahgunakan informasi perusahaan."}, {"slide": 18, "q": "Apa fungsi audit trail?", "options": ["Mencatat aktivitas untuk penelusuran akses", "Membagikan semua data kepada publik", "Menghapus seluruh bukti akses", "Menggantikan NDA secara otomatis"], "answer": 0, "explanation": "Log aktivitas membantu penelusuran kejadian dan pengawasan akses."}, {"slide": 19, "q": "Apa yang dimaksud cybersquatting dalam materi?", "options": ["Pendaftaran domain beritikad buruk yang membonceng merek pihak lain", "Pembelian server untuk situs resmi", "Pendaftaran merek sendiri secara sah", "Pembaruan software keamanan"], "answer": 0, "explanation": "Cybersquatting berkaitan dengan penyalahgunaan domain dan reputasi merek pihak lain."}]}, {"id": 6, "meeting": "6", "title": "Hak Cipta Digital & Pelindungan Karya Kreatif", "tag": "Kekayaan intelektual", "description": "Kenali hak moral, hak ekonomi, lisensi, dan pelindungan konten digital.", "file": "materi/05-Pert.-6-Hukum-Hak-Cipta-Digital-dan-Pelindungan-Karya-Kreatif.pptx", "slides": ["\n\nPERSPEKTIF HUKUM MODERN\nHUKUM HAK CIPTA DIGITAL\nDAN PELINDUNGAN KARYA\n\nMenjaga Kreativitas di Era Transformasi Digital\n\nDISAJIKAN OLEH\nDr. Apik Anitasari Intan Saputri S.H.,M.H\n\nUNIVERSITAS AMIKOM PURWOKERTO", "\nDaftar Isi\n\nSTRUKTUR PRESENTASI\n\n01\nPendahuluan Hukum Hak Cipta Digital\n\n02\nDasar Hukum Undang-Undang Hak Cipta\n\n03\nObjek Hak Cipta dalam Bisnis Digital\n\n04\nPelindungan Desain Antarmuka UI dan UX\n\n05\nHak Cipta bagi Konten Kreator\n\n06\nMemahami Hak Moral Pencipta\n\n07\nMemahami Hak Ekonomi Pencipta\n\n08\nDurasi Pelindungan Hak Cipta\n\n09\nPengalihan Hak dan Lisensi Digital\n\n10\nPenegakan Hukum dan Pemblokiran Situs\n\n11\nStudi Kasus Pelanggaran Konten Kreator\n\n12\nStrategi Pencegahan Pelanggaran Hak Cipta\n\n13\nKesimpulan dan Sesi Tanya Jawab", "\nSesi Pertemuan Keenam: Era Digital 2026\n\nPelindungan Karya Kreatif\n\nSelamat datang di sesi keenam. Di era digital 2026, pelindungan karya menjadi sangat krusial, sebagaimana peluncuran maskot tematik oleh pihak DJKI baru-baru ini.\n\nAnalisis Objek Multimedia\n\nSesi ini bertujuan menganalisis objek hak cipta pada multimedia dan desain UI/UX sesuai dengan tren regulasi terbaru yang berlaku dalam industri digital saat ini.\nPendahuluan Hukum Hak Cipta Digital\n\nHUKUM HAK CIPTA DIGITAL DAN PELINDUNGAN KARYA KREATIF", "\nHukum Hak Cipta Digital dan Pelindungan Karya Kreatif\n\nREGULASI KEKAYAAN INTELEKTUAL\n\nDasar Hukum Undang-Undang Hak Cipta\n\nLandasan Utama UU No. 28 Tahun 2014\nIndustri kreatif wajib memahami hak cipta dan hak terkait guna melindungi karya digital secara komprehensif sesuai regulasi nasional.\n\nPeran Strategis DJKI & Penegakan\nDJKI aktif melakukan pengawasan dan operasi penegakan hukum untuk mengamankan bukti pelanggaran hak cipta di berbagai wilayah.\n\nUU No. 28 Tahun 2014 Sebagai Landasan\n\nPrinsip Pelindungan Deklaratif Otomatis\n\nPengawasan Aktif Oleh DJKI", "\nObjek Hak Cipta dalam Bisnis Digital\n\nKarya Tulis & Blog\nCakupan perlindungan karya tulis dan publikasi blog yang dikelola secara profesional pada berbagai platform digital saat ini.\n\nFotografi & Grafis\nKarya fotografi serta seni grafis yang diciptakan khusus untuk mendukung kebutuhan komersial dalam ekosistem digital.\n\nVideografi & Audio\nKarya videografi dan konten audio visual yang kini menjadi elemen krusial dalam pertumbuhan industri kreatif modern.\n\nFokus Perlindungan Utama\nPemerintah melalui DJKI terus memperkuat regulasi untuk memastikan aset digital mendapatkan perlindungan hukum yang maksimal bagi para kreator.\nPelindungan Karya Kreatif\n\nHUKUM HAK CIPTA DIGITAL", "\nHukum Hak Cipta Digital dan Pelindungan Karya Kreatif\n\nKEAMANAN ASET DIGITAL\n\nPelindungan Desain Antarmuka UI dan UX\n\n\nAspek Visual UI sebagai Objek Hak Cipta\nElemen visual seperti ikon dan tata letak dilindungi sebagai karya seni rupa. Industri menetapkan batasan ketat antara inspirasi dan modifikasi ilegal.\n\n\nPelindungan Alur Pengalaman Pengguna (UX)\nPelindungan mencakup alur pengalaman pengguna yang orisinal dalam aplikasi untuk menghindari pelanggaran hak cipta atas struktur fungsional desain.\n\n\nBatasan Modifikasi dan Inspirasi Desain\nIndustri kreatif membedakan secara tegas antara mencari inspirasi dengan penyalinan struktur UX guna menjaga integritas karya kreatif digital.\n", "\nHak Cipta bagi Konten Kreator\n\nHUKUM HAK CIPTA DIGITAL DAN PELINDUNGAN KARYA KREATIF\nStatus Hukum Konten Media Sosial\nSetiap konten yang diunggah tetap dilindungi oleh Undang-Undang sebagai karya orisinal milik kreator. Pelindungan hukum ini mencakup berbagai bentuk ekspresi kreatif di platform digital modern secara otomatis sejak karya tersebut diciptakan.\n\n\nStatus hukum konten media sosial secara resmi dilindungi UU sebagai hak eksklusif yang melekat pada diri setiap konten kreator.\n\n\nKepemilikan karya orisinal di platform digital diakui secara hukum untuk melindungi integritas dan nilai ekonomi dari sebuah konten kreatif.\n\n\nDokumentasi proses kreatif sangat krusial sebagai bukti sah kepemilikan di ranah digital untuk mencegah klaim sepihak dari pihak lain.\n\n\nMelindungi hak moral dan ekonomi melalui pemahaman hukum yang tepat guna memastikan keberlanjutan ekosistem ekonomi kreatif digital.", "\n\nPrinsip Hak Moral\n•\nHak untuk tetap mencantumkan nama pencipta pada setiap salinan karya yang digunakan secara publik.\n•\nHak untuk melarang perubahan atau modifikasi karya yang dapat merusak kehormatan atau reputasi pencipta.\n\nSifat Perlindungan\nBerbeda dengan hak ekonomi, hak moral memiliki sifat yang kekal dan secara hukum tidak dapat dialihkan selama pencipta masih hidup atau sesuai regulasi.\n\nTujuan Utama\nMenjamin integritas karya kreatif dan melindungi hubungan emosional serta profesional antara pencipta dan karyanya di era transformasi digital saat ini.\nHukum Hak Cipta Digital\n\nPELINDUNGAN KARYA KREATIF\nMemahami Hak Moral Pencipta", "\nMemahami Hak Ekonomi Pencipta\n\nHUKUM HAK CIPTA DIGITAL DAN PELINDUNGAN KARYA KREATIF\nDistribusi Pemanfaatan Digital\n\n\nKomersial Digital\n\n\nNon-Komersial\n\n\nHak eksklusif untuk mendapatkan imbalan finansial secara sah atas setiap penggunaan karya oleh pihak lain.\n\n\nMencakup berbagai jenis hak ekonomi seperti penerbitan, penggandaan, serta pendistribusian karya secara luas.\n\n\nFokus utama pada pemanfaatan karya untuk tujuan komersial yang dilakukan sepenuhnya di ranah digital saat ini.", "\n\n\n\nKetentuan Umum Pelindungan\n•\nMasa berlaku hak cipta seumur hidup ditambah 70 tahun setelah wafat sesuai UU No. 28 Tahun 2014.\n•\nDurasi pelindungan khusus untuk karya program komputer dan sinematografi selama 50 tahun.\n•\nKetentuan durasi untuk karya seni terapan berlaku selama 25 tahun sejak pengumuman.\n\n\nPelindungan Seumur Hidup\nBerdasarkan UU Hak Cipta, pelindungan berlaku selama masa hidup pencipta hingga 70 tahun setelah meninggal dunia untuk karya kreatif standar.\n\n\nKarya Digital & Fotografi\nProgram komputer, sinematografi, dan fotografi dilindungi 50 tahun sejak pengumuman, sementara seni terapan memiliki durasi 25 tahun.\nDurasi Pelindungan Hak Cipta\n\nHUKUM HAK CIPTA DIGITAL DAN PELINDUNGAN KARYA KREATIF", "\n\n\n\nCopyright Assignment\n•\nMekanisme ini mencakup pengalihan hak eksklusif secara penuh dari pencipta kepada pihak lain dalam ekosistem digital.\n•\nMemahami perbedaan mendasar antara menjual seluruh hak karya secara permanen dengan hanya memberikan izin penggunaan.\n\nPerjanjian Lisensi Digital\nMemberikan izin penggunaan karya digital secara terbatas. Pemegang hak tetap memegang kendali penuh tanpa harus melepas hak cipta aslinya.\n\nPemanfaatan Ekosistem\nPenting bagi kreator untuk mengidentifikasi apakah mereka melakukan penjualan hak sepenuhnya atau sekadar izin pakai guna melindungi nilai ekonomi karya.\nHukum Hak Cipta Digital dan Pelindungan Karya Kreatif\n\nMEKANISME PERLINDUNGAN ASET DIGITAL\nPengalihan Hak dan Lisensi Digital", "\nHukum Hak Cipta Digital dan Pelindungan Karya Kreatif\n\nREGULASI EKOSISTEM DIGITAL\n\nPenegakan Hukum dan Pemblokiran Situs\n\nDJKI mengambil tindakan tegas dengan memblokir 1.004 situs bajakan untuk memperkuat sistem pelindungan ekosistem digital nasional secara menyeluruh.\n\n\nPemerintah aktif membahas regulasi AI dan kebijakan hak cipta bersama platform global guna memastikan keamanan konten di ruang digital Indonesia.\n\n\nTerdapat konsekuensi hukum yang berat bagi pengelola platform konten ilegal yang melanggar aturan distribusi karya kreatif di wilayah hukum Indonesia.\n\n\nLangkah penegakan ini bertujuan meningkatkan kepercayaan kreator lokal dan menjaga keberlanjutan ekonomi kreatif berbasis digital di masa depan.\n", "\nStudi Kasus Pelanggaran Konten Kreator\n\n\nAnalisis Fenomena Re-upload Ilegal\n\n\nPelindungan Hak Cipta Lagu Viral\nAnalisis Re-upload Ilegal \nFenomena re-upload tanpa izin di TikTok dan Instagram melanggar hukum hak cipta digital. Tindakan pembajakan konten ini merugikan kreator asli secara ekonomi serta melanggar hak moral pemilik karya.\nLangkah Hukum Kreator \nPahami batasan hak cipta pada lagu dan video viral. Kreator dapat mengambil langkah hukum tegas seperti mengirimkan somasi atau melakukan pelaporan pelanggaran melalui fitur resmi yang disediakan platform.\n\nSomasi Hukum\n\nFitur Pelaporan\n\nHak Moral & Ekonomi\nHukum Hak Cipta Digital\n\nPELINDUNGAN KARYA KREATIF DI ERA DIGITAL", "\nStrategi Pencegahan Pelanggaran Hak Cipta\nMelindungi karya kreatif memerlukan langkah proaktif melalui teknologi dan hukum. Implementasi strategi ini sangat krusial untuk mencegah re-upload ilegal dan memastikan keamanan aset digital di internet.\n\nWatermark & Metadata\n\nPenerapan identitas visual dan informasi teknis tersembunyi pada aset digital untuk melacak kepemilikan dan membatasi penyalahgunaan pihak lain.\n\nSistem e-Hak Cipta DJKI\n\nMelakukan pendaftaran resmi melalui portal pemerintah untuk mendapatkan perlindungan hukum yang kuat dan prioritas hak dalam ekosistem digital.\n\nSyarat & Ketentuan\n\nMenetapkan Terms of Use yang jelas untuk mengatur batasan lisensi, hak reproduksi, dan sanksi bagi pelanggar demi mencegah distribusi ilegal.\nHukum Hak Cipta Digital\n\nPELINDUNGAN KARYA KREATIF DI ERA MODERN", "\n\nRingkasan Materi Pelindungan Hak Cipta\n\n\n\n1\nPenegakan Hukum Intensif\n\n\n\n2\nEdukasi Publik Krusial\n\n\n\n3\nPendorong Inovasi Baru\n\n\n\n4\nEkosistem Kreatif Aman\n\nPentingnya Kekayaan Intelektual\n\nPelindungan melalui penegakan hukum dan edukasi sangat krusial untuk menjaga ekosistem kreatif. Menghargai KI adalah kunci pendorong inovasi berkelanjutan.\n\nDiskusi Terbuka Tantangan Masa Depan\n\nMari berdiskusi mengenai strategi menghadapi tantangan pelanggaran konten di masa depan. Gunakan kesempatan ini untuk memperjelas strategi pelindungan karya.\nKesimpulan dan Tanya Jawab\n\nHUKUM HAK CIPTA DIGITAL DAN PELINDUNGAN KARYA KREATIF"], "questions": [{"slide": 4, "q": "Apa dasar hukum hak cipta yang disebut dalam presentasi?", "options": ["UU No. 28 Tahun 2014", "UU No. 30 Tahun 2000", "UU No. 40 Tahun 2007", "UU No. 8 Tahun 1999"], "answer": 0, "explanation": "Presentasi merujuk UU No. 28 Tahun 2014 tentang Hak Cipta."}, {"slide": 5, "q": "Manakah contoh karya digital yang dibahas?", "options": ["Fotografi dan video orisinal", "Gagasan bisnis yang belum diwujudkan", "Nama badan usaha semata", "Nomor registrasi perusahaan"], "answer": 0, "explanation": "Fotografi, grafis, tulisan, serta audiovisual merupakan contoh karya dalam materi."}, {"slide": 7, "q": "Apakah mengunggah karya orisinal ke media sosial otomatis melepaskan hak cipta?", "options": ["Tidak, unggahan bukan otomatis pelepasan hak cipta", "Ya, semua unggahan menjadi domain publik", "Ya, jika unggahan mendapat banyak likes", "Ya, jika akun tidak berbayar"], "answer": 0, "explanation": "Publikasi daring tidak dengan sendirinya menghapus hak pencipta; periksa juga ketentuan lisensi platform."}, {"slide": 8, "q": "Hak pencipta untuk dicantumkan namanya termasuk apa?", "options": ["Hak moral
