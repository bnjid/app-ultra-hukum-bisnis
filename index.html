const MODULES = [{"id":1,"meeting":"1","title":"Pengantar Hukum Bisnis & Lanskap Regulasi Ekonomi Digital","tag":"Fondasi","description":"Kenali hubungan hukum, kepatuhan, dan etika dalam ekonomi digital.","slides":["Pengertian hukum bisnis digital\n\nHukum bisnis digital mengatur transaksi, platform, data, dan hak di ruang digital.","Tujuan pembelajaran\n\nMemahami dasar regulasi, risiko, dan kewajiban pelaku usaha digital.","Lanskap regulasi\n\nUU ITE, peraturan perlindungan data, dan kebijakan ekonomi digital saling terkait.","Etika dan kepatuhan\n\nKepatuhan menyangkut transparansi, keamanan data, dan akuntabilitas platform.","Kesimpulan\n\nBisnis digital tetap membutuhkan landasan hukum yang jelas dan konsisten."],"questions":[{"question":"Apa yang menjadi fokus utama hukum bisnis digital?","options":["Transaksi, data, platform, dan hak di ruang digital","Hanya pajak perusahaan","Hanya desain antarmuka","Hanya pemasaran offline"],"correct":0},{"question":"Kenapa kepatuhan penting dalam bisnis digital?","options":["Agar transaksi aman, transparan, dan dapat dipertanggungjawabkan","Untuk menambah biaya operasional","Untuk menghapus semua regulasi","Agar bisnis tidak perlu memiliki data"],"correct":0},{"question":"Salah satu sumber utama regulasi digital adalah…","options":["UU ITE","Aturan tentang warna logo","Ketentuan penggunaan font","Pedoman desain cetak"],"correct":0},{"question":"Apa dampak dari belum mematuhi hukum digital?","options":["Risiko sanksi, sengketa, dan kerugian reputasi","Tidak ada dampak karena semua online","Semua transaksi otomatis aman","Tidak ada hubungan dengan etika"],"correct":0},{"question":"Apa yang dimaksud dengan etika digital?","options":["Prinsip tanggung jawab, kejujuran, dan perlindungan pengguna","Kecepatan loading website","Membuat iklan semenarik mungkin","Hanya fokus pada keuntungan"],"correct":0},{"question":"Mengapa perlindungan data penting?","options":["Karena data pelanggan adalah aset dan hak yang perlu dilindungi","Karena data tidak berpengaruh","Karena data hanya untuk promosi","Karena data tidak perlu disimpan"],"correct":0},{"question":"Peran hukum bisnis digital dalam platform adalah…","options":["Mengatur hubungan antara penyedia, pengguna, dan pihak lain","Menghapus semua kontrak","Menghilangkan kebutuhan audit","Membatasi semua inovasi"],"correct":0},{"question":"Yang paling tepat menggambarkan kepatuhan adalah…","options":["Memenuhi aturan, prinsip, dan tanggung jawab","Mencegah semua pembelajaran","Mengikuti hanya tren","Tidak perlu dokumentasi"],"correct":0},{"question":"Salah satu tujuan utama regulasi ekonomi digital adalah…","options":["Menciptakan ekosistem yang adil dan terlindungi","Menghentikan semua transaksi online","Menghilangkan persaingan","Membatasi penggunaan internet"],"correct":0},{"question":"Amanat hukum dalam bisnis digital tidak akan optimal jika…","options":["Tidak diterapkan secara konsisten dan tertanam dalam praktik","Semua orang memahami hukum","Platform sudah sangat besar","Semua transaksi bersifat lokal"],"correct":0}]},{"id":2,"meeting":"2","title":"Kontrak Digital, E-Commerce, dan Perlindungan Konsumen","tag":"Transaksi","description":"Pahami kontrak elektronik, transaksi online, dan hak konsumen digital.","slides":["Kontrak digital\n\nKontrak dapat dibuat secara elektronik selama memenuhi syarat kesepakatan dan objek yang jelas.","E-commerce\n\nMarketplace, payment gateway, dan penyedia layanan logistik membentuk ekosistem transaksi digital.","Perlindungan konsumen\n\nKonsumen berhak atas informasi yang jelas, keamanan, dan mekanisme pengaduan.","Praktik bisnis yang sehat\n\nPenjual wajib menjelaskan syarat, harga, pengiriman, dan kebijakan retur.","Kesimpulan\n\nTransaksi digital tetap memerlukan perlindungan hukum yang adil."],"questions":[{"question":"Kontrak digital sah apabila…","options":["Ada kesepakatan, subjek, dan syarat yang jelas","Tidak perlu bukti digital","Hanya dibuat lewat telepon","Hanya dibuat oleh pengusaha besar"],"correct":0},{"question":"Salah satu risiko utama e-commerce adalah…","options":["Kegagalan pengiriman dan ketidakjelasan syarat","Tidak ada sistem pembayaran","Semua produk otomatis aman","Tidak ada transaksi"],"correct":0},{"question":"Hak konsumen dalam transaksi online meliputi…","options":["Informasi jelas, keamanan transaksi, dan pengaduan","Hak untuk menunda semua pembayaran","Hak untuk menghapus semua regulasi","Hak untuk tidak menerima bukti transaksi"],"correct":0},{"question":"Dalam transaksi digital, syarat yang harus jelas adalah…","options":["Harga, produk, pengiriman, dan kebijakan retur","Warna halaman","Jumlah tombol website","Desain logo"],"correct":0},{"question":"Mengapa bukti elektronik penting?","options":["Karena menjadi alat pembuktian transaksi digital","Karena tidak perlu disimpan","Karena menggantikan seluruh hukum","Karena semua transaksi otomatis tercatat"],"correct":0},{"question":"Peran marketplace dalam e-commerce adalah…","options":["Menghubungkan penjual dan pembeli serta menyediakan platform transaksi","Hanya mengirim produk","Menghapus semua persetujuan","Mengubah semua konsumen menjadi penjual"],"correct":0},{"question":"Apa yang menjadi fokus perlindungan konsumen digital?","options":["Kejelasan informasi dan keamanan transaksi","Ukuran font website","Jumlah iklan","Bahasa promosi"],"correct":0},{"question":"Yang paling tepat tentang transaksi online adalah…","options":["Masih tunduk pada aturan hukum dan prinsip keadilan","Tidak perlu kontrak","Semua kesepakatan dianggap sah tanpa bukti","Tidak ada kewajiban penjual"],"correct":0},{"question":"Hubungan antara marketplace dan penjual harus…","options":["Jelas, tertulis, dan sesuai peraturan","Tidak perlu dijelaskan","Hanya berdasarkan komunikasi verbal","Hanya berdasarkan promosi"],"correct":0},{"question":"Apa tujuan perlindungan konsumen digital?","options":["Menjaga kepastian, keamanan, dan keadilan transaksi","Menyembunyikan semua biaya","Membatasi akses pembeli","Menghapus semua laporan"],"correct":0}]},{"id":3,"meeting":"3","title":"Bisnis Data, Privasi, dan Kebijakan Informasi","tag":"Data","description":"Memahami pengelolaan data, privasi, dan kewajiban pemrosesan informasi pelanggan.","slides":["Data sebagai aset\n\nData pelanggan adalah aset strategis yang harus dikelola secara aman dan bertanggung jawab.","Privasi\n\nPrivasi mencakup hak individu atas pengelolaan data pribadi serta penggunaan yang sah.","Kebijakan informasi\n\nPengguna perlu diberi informasi yang jelas mengenai apa yang dikumpulkan dan bagaimana data diproses.","Tanggung jawab pemroses data\n\nPemilik data dan platform harus memenuhi prinsip keamanan, minimalisasi, dan akuntabilitas.","Kesimpulan\n\nBisnis yang mengelola data harus menyusun tata kelola yang adil dan transparan."],"questions":[{"question":"Data pelanggan dalam bisnis digital termasuk aset yang…","options":["Perlu dikelola dengan aman dan bertanggung jawab","Tidak perlu dilindungi jika sudah dikumpulkan","Hanya relevan untuk keperluan promosi","Tidak dapat dijadikan bukti"],"correct":0},{"question":"Apa yang dimaksud dengan privasi digital?","options":["Hak individu atas pengelolaan data pribadi secara sah dan terukur","Kebebasan menampilkan data tanpa aturan","Hak untuk mempublikasikan semua data orang","Kebijakan memblokir semua data"],"correct":0},{"question":"Kebijakan informasi bertujuan agar pengguna…","options":["Memahami apa yang dikumpulkan dan bagaimana data diproses","Tidak perlu diberi penjelasan","Hanya menerima syarat tanpa detail","Tidak dibatasi dalam memakai data"],"correct":0},{"question":"Prinsip utama pengelolaan data adalah…","options":["Minimalisasi, keamanan, dan akuntabilitas","Kumpulan data tanpa batas","Menyimpan semua data tanpa batas waktu","Tidak perlu dokumentasi"],"correct":0},{"question":"Apa risiko jika data pelanggan disalahgunakan?","options":["Sengketa hukum, kerugian finansial, dan rusaknya reputasi","Tidak ada risiko karena data sudah online","Semua data otomatis aman","Data tidak memengaruhi bisnis"],"correct":0},{"question":"Siapa yang bertanggung jawab atas keamanan data?","options":["Pemilik data, platform, dan pihak yang memproses data","Hanya konsumen","Hanya pihak auditor","Hanya pembeli"],"correct":0},{"question":"Mengapa transparansi penting dalam pengelolaan data?","options":["Agar pengguna memahami dan menyetujui penggunaan data","Agar tidak perlu persetujuan","Agar data tidak perlu dicatat","Agar semua orang bisa mengakses data bebas"],"correct":0},{"question":"Praktik pengumpulan data yang baik adalah…","options":["Hanya mengambil yang diperlukan dan menjelaskan tujuannya","Mengumpulkan semua data tanpa alasan","Membiarkan data dibagikan secara terbuka","Tidak memerlukan persetujuan"],"correct":0},{"question":"Apa yang harus ada pada kebijakan privasi?","options":["Tujuan, pengguna, penyimpanan, keamanan, dan mekanisme pengaduan","Hanya slogan perusahaan","Hanya daftar produk","Hanya kontak admin"],"correct":0},{"question":"Data pribadi harus diperlakukan dengan prinsip…","options":["Hormat, aman, dan sesuai hukum yang berlaku","Sementara saja tanpa kontrol","Bebas diubah oleh siapa pun","Tanpa dokumentasi"],"correct":0}]},{"id":4,"meeting":"4","title":"Hak Kekayaan Intelektual di Platform Digital","tag":"HKI","description":"Mengenal hak cipta, merek, dan perlindungan inovasi di ekosistem digital.","slides":["HKI digital\n\nKarya digital seperti konten, logo, dan desain dapat dilindungi oleh hak cipta atau merek.","Inovasi dan lisensi\n\nLisensi mengatur penggunaan karya dan menjaga kepastian hukum antar pihak.","Tantangan platform\n\nPlatform sering menjadi tempat konten pengguna, sehingga perlu mekanisme pemantauan dan penanggulangan.","Enforcement\n\nPerlindungan HKI memerlukan klaim, bukti, dan prosedur yang jelas.","Kesimpulan\n\nKekayaan intelektual digital bukan sekadar aset, tetapi juga bagian dari strategi bisnis dan reputasi."],"questions":[{"question":"Apa yang biasanya dilindungi oleh hak cipta dalam platform digital?","options":["Konten tulisan, gambar, video, dan karya kreatif digital","Nama perusahaan","Alamat kantor","Nomor rekening"],"correct":0},{"question":"Apa fungsi merek dalam bisnis digital?","options":["Membedakan produk/jasa dan membangun reputasi","Menghilangkan kebutuhan promosi","Mengganti seluruh strategi hukum","Menutup semua akses pasar"],"correct":0},{"question":"Lisensi digunakan untuk…","options":["Mengatur cara pihak lain menggunakan karya atau teknologi","Menyembunyikan hak milik","Menghapus hak pencipta","Menjamin semua penggunaan tanpa batas"],"correct":0},{"question":"Tantangan utama platform digital terkait HKI adalah…","options":["Konten pengguna yang banyak dan potensi pelanggaran hak cipta","Tidak ada data pelanggan","Semua konten pasti sah","Semua desain tidak perlu diawasi"],"correct":0},{"question":"Apa yang dibutuhkan untuk menegakkan hak HKI?","options":["Bukti, klaim, dan prosedur yang jelas","Hanya slogan promosi","Hanya pengumuman publik","Hanya alamat email"],"correct":0},{"question":"Hak cipta pada karya digital biasanya muncul karena…","options":["Karya diciptakan dan terekspos secara original","Karya dibeli oleh banyak orang","Karya disebarkan secara gratis","Karya tidak ditandai"],"correct":0},{"question":"Mengapa platform perlu memiliki mekanisme pemantauan?","options":["Agar pelanggaran konten dapat ditangani secara adil dan cepat","Agar platform tidak perlu mengawasi apa pun","Agar semua konten bisa digunakan tanpa izin","Agar platform tidak perlu mengelola data"],"correct":0},{"question":"Prinsip utama dalam pengelolaan HKI adalah…","options":["Kepastian, penghormatan, dan perlindungan hak","Penghapusan aturan","Pemusatan semua hak pada satu pihak","Pembiaran tanpa identitas"],"correct":0},{"question":"Apa peran lisensi dalam ekosistem digital?","options":["Menetapkan ruang penggunaan dan hak yang dikelola secara legal","Mengganti kebutuhan kontrak","Menghapus klaim artis","Membuka semua akses tanpa kontrol"],"correct":0},{"question":"Bisnis digital yang peduli terhadap HKI akan…","options":["Mendorong inovasi sekaligus menghormati hak pihak lain","Membatasi semua kreativitas","Mengabaikan merek","Menolak semua lisensi"],"correct":0}]},{"id":5,"meeting":"5","title":"Merek, Branding, dan Persaingan Sehat di Internet","tag":"Merek","description":"Pahami perlindungan merek, strategi merek digital, dan batas persaingan sehat.","slides":["Merek digital\n\nMerek bukan hanya nama, tetapi reputasi, identitas, dan kepercayaan konsumen.","Persaingan sehat\n\nMerek perlu dibangun tanpa meniru atau merusak identitas pesaing.","Branding online\n\nLogo, visual, copy, dan konten harus konsisten agar membangun pengenalan yang kuat.","Enforcement\n\nPelanggaran merek harus ditangani dengan bukti, notifikasi, dan langkah hukum yang tepat.","Kesimpulan\n\nStrategi merek yang sehat akan memperkuat posisi dan kepercayaan di pasar digital."],"questions":[{"question":"Merek berfungsi sebagai…","options":["Identitas, pembeda, dan sumber reputasi bisnis","Ribuan kata tanpa arti","Nomor kontak pelanggan","Hanya elemen desain"],"correct":0},{"question":"Persaingan sehat berart i…","options":["Bersaing dengan cara yang legal, jujur, dan tidak meniru merek pesaing","Meniru semua ide pesaing","Mengikuti semua strategi tanpa riset","Membatasi inovasi"],"correct":0},{"question":"Branding online mencakup…","options":["Logo, visual, pesan, dan konsistensi komunikasi digital","Hanya warna latar belakang","Hanya promosi lewat iklan","Hanya tombol pada website"],"correct":0},{"question":"Kenapa konsistensi identitas penting?","options":["Agar merek mudah diingat dan dipercaya konsumen","Karena semua merek harus sama","Agar tidak perlu promosi","Agar logo lebih kecil"],"correct":0},{"question":"Apa risikonya kalau merek ditiru?","options":["Kebingungan konsumen, kerusakan reputasi, dan sengketa hukum","Tidak berpengaruh karena internet ramai","Semua brand di internet sama","Tidak ada pengaruh pasar"],"correct": ab","Hanya mematuhi target penjualan","Hanya mengutamakan profit","Tidak perlu peduli konsumen"],"correct":0},{"question":"Yang termasuk perlindungan konsumen adalah…","options":["Informasi jelas, transaksi aman, dan mekanisme pengaduan","Biaya promosi yang murah","Banyak fitur tanpa kontrol","Pengurangan stok"],"correct":0},{"question":"Apa fungsi kode etik perusahaan?","options":["Mengarahkan perilaku dan menjaga integritas bisnis","Menghapus kebutuhan audit","Menghilangkan laporan pelanggan","Membatasi semua komunikasi"],"correct":0},{"question":"Mengapa tanggung jawab sosial penting?","options":["Karena bisnis berdampak pada masyarakat dan lingkungan digital","Karena semua bisnis sama","Karena semua konsumen tidak penting","Karena hanya fokus pada keuntungan"],"correct":0},{"question":"Praktik yang tidak etis dalam bisnis digital adalah…","options":["Menipu data, menyembunyikan informasi, dan memanipulasi pengguna","Memberikan layanan dengan jelas","Menjelaskan syarat secara transparan","Menghormati hak konsumen"],"correct":0},{"question":"Perlindungan konsumen menuntut bisnis untuk…","options":["Memberikan kejelasan, keamanan, dan saluran pengaduan yang mudah","Menyembunyikan seluruh masalah","Meningkatkan biaya tersembunyi","Menghapus semua kontak"],"correct":0},{"question":"Apa manfaat etika bisnis bagi reputasi?","options":["Meningkatkan kepercayaan publik dan daya saing","Menyebabkan semua pelanggan meninggalkan bisnis","Menghilangkan kebutuhan inovasi","Mengganti semua peraturan"],"correct":0},{"question":"Bisnis yang tanggung jawab terhadap sosial akan…","options":["Mempertimbangkan dampak pengguna dan komunitas di sekitarnya","Hanya fokus pada promosi besar","Mengesampingkan hak masyarakat","Mengutamakan volume penjualan"],"correct":0},{"question":"Tujuan utama kode etik adalah…","options":["Menjaga integritas dan konsistensi keputusan","Menghilangkan pertanyaan legal","Menghapus semua prosedur","Membatasi komunikasi internal"],"correct":0},{"question":"Prinsip yang sebaiknya dijunjung dalam bisnis digital adalah…","options":["Keadilan, transparansi, keamanan, dan akuntabilitas","Kecepatan tanpa evaluasi","Keuntungan tanpa batas","Kebebasan tanpa tanggung jawab"],"correct":0}]},{"id":7,"meeting":"7","title":"Siber, Keamanan, dan Risiko Platform Digital","tag":"Siber","description":"Pahami keamanan siber, perlindungan data, dan risiko operasional pada platform digital.","slides":["Keamanan siber\n\nPlatform digital harus melindungi sistem, data, transaksi, dan identitas pengguna.","Risiko operasional\n\nSerangan siber, kebocoran data, dan gangguan sistem dapat mengganggu layanan dan reputasi.","Mitigasi\n\nPengamanan berlapis, audit, dan respons insiden adalah bagian dari kepatuhan digital.","Kewajiban platform\n\nPlatform perlu menyediakan prosedur keamanan dan komunikasi cadangan saat terjadi insiden.","Kesimpulan\n\nKeamanan siber bukan sekadar teknis, tetapi juga persoalan tata kelola dan kepercayaan."],"questions":[{"question":"Apa yang dimaksud dengan keamanan siber?","options":["Upaya melindungi sistem, data, dan layanan digital dari ancaman","Proses pemasangan iklan","Menambah fitur baru secara terus-menerus","Tidak perlu diatur"],"correct":0},{"question":"Salah satu risiko utama platform digital adalah…","options":["Kebocoran data dan serangan siber","Peningkatan jumlah pelanggan tanpa batas","Semua transaksi otomatis aman","Tidak ada ancaman teknologi"],"correct":0},{"question":"Mitigasi risiko yang tepat adalah…","options":["Audit keamanan, pembatasan akses, dan respons insiden","Tidak perlu pengujian","Membiarkan semua user mengelola sistem","Menghapus seluruh autentikasi"],"correct":0},{"question":"Apa yang harus diperhatikan dalam tata kelola keamanan?","options":["Kebijakan, peran, prosedur, dan pemantauan berkelanjutan","Hanya tampilan website","Hanya desain antarmuka","Hanya desain logo"],"correct":0},{"question":"Apa dampak insiden keamanan terhadap bisnis?","options":["Kerugian finansial, reputasi, dan hilangnya kepercayaan pengguna","Tidak berdampak jika produk bagus","Semua pengguna tetap puas","Tidak ada konsekuensi hukum"],"correct":0},{"question":"Platform perlu menyediakan mekanisme respons terhadap insiden untuk…","options":["Mempercepat pemulihan dan memperjelas komunikasi kepada pengguna","Meningkatkan biaya operasional tanpa hasil","Menunda semua pembaruan","Menghapus semua sistem log"],"correct":0},{"question":"Mengapa audit keamanan penting?","options":["Untuk menemukan celah sebelum celah disalahgunakan","Karena semua sistem pasti aman","Karena teknologi tidak berubah","Karena keamanan hanya tugas IT"],"correct":0},{"question":"Kepercayaan pengguna pada platform sangat dipengaruhi oleh…","options":["Keamanan, transparansi, dan konsistensi layanan","Jumlah lengkapnya beranda","Jumlah halaman","Desain footer"],"correct":0},{"question":"Pengelolaan data yang buruk dapat menimbulkan…","options":["Risiko kebocoran, sengketa, dan kerugian hukum","Tidak memiliki konsekuensi bila data kecil","Semua data tidak bernilai","Tidak perlu dokumentasi"],"correct":0},{"question":"Keamanan siber harus dipahami sebagai…","options":["Bagian dari tata kelola bisnis dan perlindungan pengguna","Masalah teknis semata","Perkara desain marketing","Masalah yang hanya relevan pada perusahaan besar"],"correct":0}]},{"id":8,"meeting":"8","title":"Platform Digital, Intermediasi, dan Tanggung Jawab Penyedia","tag":"Platform","description":"Mengenal peran platform digital, kewajiban intermediasi, dan regulasi penyedia layanan.","slides":["Intermediasi digital\n\nPlatform menjadi penghubung antara penyedia layanan, produk, dan pengguna digital.","Tanggung jawab penyedia\n\nPenyedia platform tidak bisa lepas tangan terhadap praktik yang merugikan pengguna atau pihak lain.","Penyelesaian sengketa\n\nPlatform perlu menyediakan mekanisme keluhan, analisis, dan penyelesaian yang adil.","Risk management\n\nPlatform harus menjaga sistem, konten, dan tata kelola agar penerapan aturan konsisten.","Kesimpulan\n\nPlatform digital harus menjadi pengelola ekosistem yang aman, adil, dan dapat dipertanggungjawabkan."],"questions":[{"question":"Apa peran utama platform digital?","options":["Menghubungkan penyedia layanan, produk, dan pengguna dalam ekosistem digital","Menyimpan semua data tanpa batas","Membuat semua transaksi otomatis","Menghapus kebutuhan pengaduan"],"correct":0},{"question":"Tanggung jawab penyedia platform mencakup…","options":["Pemantauan, pengelolaan risiko, dan mekanisme penyelesaian sengketa","Hanya membuat desain antarmuka","Hanya menambah fitur","Hanya mengelola promosi"],"correct":0},{"question":"Mengapa platform perlu menyediakan keluhan?","options":["Agar pengguna bisa melaporkan masalah dan meminta pemulihan yang adil","Agar platform tidak perlu bertanggung jawab","Agar semua pengguna menutup akun","Agar semua transaksi otomatis diselesaikan"],"correct":0},{"question":"Apa yang dibutuhkan agar platform dapat menilai risiko?","options":["Kebijakan, pemantauan, dan mekanisme evaluasi terus-menerus","Hanya laporan penjualan","Hanya jumlah kunjungan","Hanya desain utama"],"correct":0},{"question":"Sengketa di platform digital sering berkaitan dengan…","options":["Konten, transaksi, data, dan hak pengguna","Jumlah tombol menu","Warna latar belakang","Ukuran logo"],"correct":0},{"question":"Platform yang baik akan mengutamakan…","options":["Keamanan, akuntabilitas, dan kejelasan aturan","Keuntungan tanpa aturan","Banyak fitur tanpa kontrol","Semua izin tanpa dokumentasi"],"correct":0},{"question":"Peran intermediasi menuntut platform untuk…","options":["Mengatur hubungan agar tidak merugikan pihak yang terlibat","Menghapus semua komunikasi antara pihak","Menyediakan layanan tanpa standar","Mengabaikan keluhan"],"correct":0},{"question":"Apa manfaat mekanisme penyelesaian sengketa yang jelas?","options":["Meningkatkan kepastian hukum dan kepercayaan pengguna","Menambah biaya pelanggan","Menyebabkan semua masalah segera berhenti","Mengurangi kebutuhan regulasi"],"correct":0},{"question":"Manakah yang paling tepat mengenai platform digital?","options":["Platform tidak bisa sepenuhnya netral jika berpengaruh pada transaksi dan data pengguna","Platform tidak punya kewajiban hukum","Semua platform aman tanpa risiko","Platform tidak memengaruhi hak pengguna"],"correct":0},{"question":"Tanggung jawab penyedia tidak bisa hanya sebatas teknis; ia juga mencakup…","options":["Tata kelola, kebijakan, dan perlindungan kepentingan pengguna","Hanya pembaruan fitur","Hanya promosi","Hanya pengaturan internal"],"correct":0}]},{"id":9,"meeting":"9","title":"Integrasi Hukum, Etika, dan Strategi Bisnis Digital yang Berkelanjutan","tag":"Integrasi","description":"Mengaitkan semua materi dalam kerangka hukum, etika, dan strategi bisnis yang berkelanjutan.","slides":["Integrasi konsep\n\nHukum, etika, keamanan, dan strategi bisnis harus berjalan bersamaan dalam ekosistem digital.","Keberlanjutan\n\nBisnis yang sehat adalah bisnis yang dapat tumbuh dengan kepercayaan, kepatuhan, dan inovasi yang bertanggung jawab.","Strategi berkelanjutan\n\nPlatform dan bisnis digital perlu mengembangkan sistem yang adil, aman, dan mudah dipahami pengguna.","Akhir pembelajaran\n\nKemampuan adaptasi hukum dan etika menjadi pembeda utama dalam persaingan digital.","Kesimpulan\n\nHukum bisnis digital bukan hambatan, tetapi fondasi agar inovasi tetap berkelanjutan."],"questions":[{"question":"Integrasi hukum dan etika dalam bisnis digital bertujuan agar…","options":["Bisnis berkembang dengan keadilan, kepastian, dan kepercayaan","Semua inovasi terus tanpa kontrol","Hanya fokus pada keuntungan cepat","Semua kebijakan dapat diabaikan"],"correct":0},{"question":"Apa yang membangun keberlanjutan bisnis digital?","options":["Kepatuhan, keamanan, dan reputasi yang sehat","Kecepatan promosi semata","Jumlah akun tanpa kualitas","Ukuran perusahaan saja"],"correct":0},{"question":"Kenapa inovasi harus dibatasi oleh prinsip hukum dan etika?","options":["Agar inovasi tidak merugikan pengguna, pihak lain, atau sistem secara luas","Agar inovasi berhenti berkembang","Agar semua inovasi harus lama","Agar tidak ada perubahan"],"correct":0},{"question":"Bisnis digital yang berkelanjutan biasanya…","options":["Mengintegrasikan kepatuhan, keamanan, dan nilai sosial","Tidak perlu mengelola data","Menolak semua regulasi","Mengurangi semua layanan"],"correct":0},{"question":"Apa yang menjadi ukuran keberhasilan ekosistem digital?","options":["Kepercayaan pengguna, kepastian hukum, dan kualitas layanan","Jumlah halaman tanpa interaksi","Jumlah iklan tanpa evaluasi","Banyak fitur tanpa manfaat"],"correct":0},{"question":"Apa pentingnya kemampuan adaptasi hukum bagi pelaku digital?","options":["Karena aturan dan teknologi terus berubah, sehingga perlu respons yang bijak","Karena hukum tidak berubah","Karena teknologi tidak berdampak hukum","Karena semua risiko sudah hilang"],"correct":0},{"question":"Mengapa kepercayaan publik menjadi aset utama?","options":["Karena kepercayaan mendorong loyalitas, reputasi, dan keberlanjutan pasar","Karena publik tidak peduli terhadap produk","Karena reputasi tidak memengaruhi bisnis","Karena pelanggan hanya membeli produk murah"],"correct":0},{"question":"Prinsip yang paling tepat untuk strategi bisnis digital adalah…","options":["Inovatif, bertanggung jawab, dan berlandaskan hukum","Cepat, tanpa evaluasi, dan besar","Tanpa kajian, asal viral","Tanpa konsumen"],"correct":0},{"question":"Apa hubungan antara etika dan eksistensi platform digital?","options":["Etika membentuk kepercayaan dan kelangsungan platform di tengah persaingan","Etika tidak relevan karena platform otomatis","Etika hanya persoalan internal","Etika hanya berlaku pada bisnis tradisional"],"correct":0},{"question":"Kesimpulan utama dari seluruh materi adalah…","options":["Hukum bisnis digital adalah fondasi yang membuat inovasi tetap sah, aman, dan berkelanjutan","Semua bisnis digital tidak memerlukan hukum","Kepatuhan hanya menghambat pertumbuhan","Etika hanya bersifat optional"],"correct":0}]}];
const KEY='ultra-hukum-bisnis-v1';
const storageKey='ultra-hukum-progress-v1';
let progress={},page='library',quiz=null,currentModule=null,selectedFilter='Semua',quizTimer=null;
function loadProgress(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))progress=saved;}catch{} }
function saveProgress(){try{localStorage.setItem(storageKey,JSON.stringify(progress));}catch{} }
function showToast(msg){const el=document.querySelector('#toast');el.textContent=msg;el.style.display='block';clearTimeout(showToast._t);showToast._t=setTimeout(()=>el.style.display='none',2600);} 
function safeText(v){return String(v ?? '').replace(/[&<>"']/g,char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[char]));}
function stats(){const items=MODULES.map(m=>progress[m.id]).filter(Boolean).filter(x=>Number.isFinite(x.best));return {done:items.length,avg:items.length?Math.round(items.reduce((a,p)=>a+p.best,0)/items.length):0,top:items.length?Math.max(...items.map(x=>x.best)):0};}
function renderPage(name){page=name;document.querySelectorAll('.nav').forEach(btn=>btn.classList.toggle('active', btn.dataset.page===name));
  if(name==='library') renderLibrary();
  if(name==='progress') renderProgress();
  if(name==='about') renderAbout();
}
function renderLibrary(){
  const s=stats();
  const main=document.querySelector('#main');
  main.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Ruang Belajar Bisnis Digital</div><h1>Pahami hukumnya.<br><em>Bangun bisnisnya.</em></h1><p class="sub">Akses 9 modul, latihan interaktif, dan pembahasan yang membantu memahami hukum bisnis digital dengan lebih praktis.</p><div class="cta-row"><button data-action="start-all">Mulai belajar</button><button class="secondary" data-action="jump-progress">Lihat riwayat</button></div></div><div class="stats"><div class="stat"><strong>${s.done}</strong><span>Modul selesai</span></div><div class="stat"><strong>${s.avg}</strong><span>Rata-rata skor</span></div><div class="stat"><strong>${s.top}</strong><span>Skor tertinggi</span></div></div></section>
  <section class="panel" style="margin-top:18px"><div class="filter-wrap">${['Semua','Fondasi & bisnis','Kekayaan intelektual','Siber & platform'].map(filter=>`<button class="filter ${selectedFilter===filter?'active':''}" data-filter="${filter}">${filter}</button>`).join('')}</div><div class="module-grid">${MODULES.filter(m=>selectedFilter==='Semua'||(selectedFilter==='Fondasi & bisnis'&&m.id<=3)||(selectedFilter==='Kekayaan intelektual'&&m.id>=4&&m.id<=7)||(selectedFilter==='Siber & platform'&&m.id>=8)).map(m=>{const p=progress[m.id]||{};const score=Number.isFinite(p.best)?p.best:0;return `<article class="module-card"><div class="tag">Pertemuan ${m.meeting}</div><h3>${safeText(m.title)}</h3><p>${safeText(m.description)}</p><div class="meta"><span>${score ? 'Skor '+score : 'Belum mulai'}</span><span>${m.questions.length} soal</span></div><div class="badge-row"><span class="badge">${safeText(m.tag)}</span></div><div class="controls"><button data-module="${m.id}">Buka modul</button></div></article>`;}).join('')}</div></section>`;
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const action=btn.getAttribute('data-action'); if(action==='start-all') { const first=MODULES[0]; if(first) openModule(first.id); else showToast('Tidak ada modul tersedia'); }
    if(action==='jump-progress') renderPage('progress');
  }));
  document.querySelectorAll('[data-module]').forEach(btn=>btn.addEventListener('click',()=>openModule(Number(btn.getAttribute('data-module')))));
  document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{selectedFilter=btn.getAttribute('data-filter'); renderLibrary();}));
}
function openModule(id){
  const module=MODULES.find(m=>m.id===id); if(!module) return;
  currentModule=module;
  const main=document.querySelector('#main');
  const p=progress[module.id]||{};
  const progressPct = Number.isFinite(p.completion) ? p.completion : 0;
  main.innerHTML=`<section class="prose"><div class="eyebrow">Pertemuan ${module.meeting}</div><h2>${safeText(module.title)}</h2><p>${safeText(module.description)}</p><div class="material-shell"><div class="slide-card"><div class="progress-bar"><span style="width:${progressPct}%"></span></div><h3 style="margin:16px 0 8px">Ringkasan materi</h3><p>${safeText(module.slides[0] || 'Materi belum tersedia.')}</p><div class="controls"><button data-action="start-quiz" data-module-id="${module.id}">Mulai kuis</button><button class="secondary" data-action="back-library">Kembali</button></div></div><div class="side-panel"><div class="panel"><strong>Modul</strong><p>${safeText(module.tag)}</p><strong>Jumlah soal</strong><p>${module.questions.length} pertanyaan</p></div><div class="panel"><strong>Progress</strong><p>${progressPct}% selesai</p><strong>Skor terbaik</strong><p>${Number.isFinite(p.best)?p.best:0}/100</p></div></div></div></section>`;
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const action=btn.getAttribute('data-action');
    if(action==='start-quiz'){ startQuiz(Number(btn.getAttribute('data-module-id'))); }
    if(action==='back-library'){ renderPage('library'); }
  }));
}
function startQuiz(moduleId){
  const module=MODULES.find(m=>m.id===moduleId); if(!module) return;
  const questions=module.questions.map(q=>({
    ...q,
    options: [...q.options].sort(()=>Math.random()-0.5)
  }));
  quiz={module, questions, index:0, answers:[], start:Date.now(), locked:false, deadline:Date.now()+20000};
  renderQuiz();
}
function renderQuiz(){
  const main=document.querySelector('#main');
  const q=quiz.questions[quiz.index];
  main.innerHTML=`<div class="quiz-shell"><div class="question-card"><div class="question-head"><div><div class="eyebrow">Pertemuan ${quiz.module.meeting}</div><h2 style="margin:10px 0 0">${safeText(quiz.module.title)}</h2></div><div id="timer" class="timer">20</div></div><p style="margin-top:16px;font-weight:800">Soal ${quiz.index+1} / ${quiz.questions.length}</p><h3>${safeText(q.question)}</h3><div class="options">${q.options.map((option, i)=>`<button class="option" data-option-index="${i}">${safeText(option)}</button>`).join('')}</div></div></div>`;
  document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click', answerQuestion));
  updateTimer();
  clearInterval(quizTimer);
  quizTimer=setInterval(updateTimer,1000);
}
function updateTimer(){
  if(!quiz) return;
  const left=Math.max(0, Math.ceil((quiz.deadline - Date.now())/1000));
  const el=document.querySelector('#timer'); if(el) el.textContent=left;
  if(left<=0){ answerQuestion(null, true); }
}
function answerQuestion(event, forced=false){
  if(!quiz || quiz.locked) return;
  const isTimeout = forced || event===null;
  const selectedIndex = event ? Number(event.currentTarget.dataset.optionIndex) : null;
  quiz.locked=true; clearInterval(quizTimer);
  const q=quiz.questions[quiz.index];
  const correctIndex=q.correct;
  const correct = selectedIndex===correctIndex && !isTimeout;
  quiz.answers.push({ selectedIndex, correct, timeout:isTimeout });
  const buttons = [...document.querySelectorAll('.option')];
  buttons.forEach((btn, i)=>{
    const isCorrect = i===correctIndex;
    btn.disabled=true;
    btn.classList.toggle('correct', isCorrect);
    if(!isTimeout && selectedIndex===i && i!==correctIndex){ btn.classList.add('wrong'); }
  });
  setTimeout(()=>{
    if(quiz.index < quiz.questions.length-1){ quiz.index++; quiz.locked=false; quiz.deadline=Date.now()+20000; renderQuiz(); }
    else finishQuiz();
  }, 1200);
}
function finishQuiz(){
  const answers=quiz.answers;
  const correctCount=answers.filter(a=>a.correct).length;
  const rawScore=Math.round((correctCount / quiz.questions.length)*100);
  progress[quiz.module.id]={
    ...progress[quiz.module.id],
    best: Math.max(Number.isFinite(progress[quiz.module.id]?.best)?progress[quiz.module.id].best:0, rawScore),
    completion: 100,
    lastScore: rawScore
  };
  saveProgress();
  const main=document.querySelector('#main');
  main.innerHTML=`<div class="quiz-shell"><section class="panel result-hero"><div><div class="eyebrow">Latihan selesai</div><h2 style="margin:10px 0 8px">${safeText(quiz.module.title)}</h2><p style="color:var(--muted);margin:0">Anda menyelesaikan modul ini dengan hasil berikut.</p></div><div class="score">${rawScore}<small> / 100</small></div></section><div class="mini-grid" style="margin-top:18px"><div class="mini-card"><strong>${correctCount}</strong><span>Jawaban benar</span></div><div class="mini-card"><strong>${quiz.questions.length}</strong><span>Total soal</span></div></div><div class="controls" style="margin-top:18px"><button data-action="restart-module" data-module-id="${quiz.module.id}">Coba lagi</button><button class="secondary" data-action="back-library">Kembali ke beranda</button></div></div>`;
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{
    const action=btn.getAttribute('data-action');
    if(action==='restart-module'){ startQuiz(Number(btn.getAttribute('data-module-id'))); }
    if(action==='back-library'){ renderPage('library'); }
  }));
  quiz=null; clearInterval(quizTimer);
}
function renderProgress(){
  const main=document.querySelector('#main');
  const records=MODULES.map(m=>({module:m, score: progress[m.id]?.best ?? 0})).sort((a,b)=>b.score-a.score);
  main.innerHTML=`<section class="prose"><div class="eyebrow">Riwayat belajar</div><h2>Langkah kecil, pemahaman baru.</h2><p>Gunakan catatan ini untuk melihat modul mana yang sudah dikuasai dan modul mana yang perlu diulang.</p><div class="panel"><div class="module-grid">${records.map(({module,score})=>`<article class="module-card"><div class="tag">Pertemuan ${module.meeting}</div><h3>${safeText(module.title)}</h3><div class="meta"><span>Skor</span><span>${score}/100</span></div><div class="progress-bar"><span style="width:${score}%"></span></div></article>`).join('')}</div></div></section>`;
}
function renderAbout(){
  const main=document.querySelector('#main');
  main.innerHTML=`<section class="prose"><div class="eyebrow">Panduan pembelajaran</div><h2>Ruang belajar yang mengikuti ritme Anda.</h2><p>Gunakan modul secara berurutan untuk membangun pemahaman yang stabil, lalu kerjakan kuis singkat untuk menguji penguasaan materi.</p><ul class="bullet-list"><li>Mulai dari modul pertama dan ikuti urutan pertemuan.</li><li>Kerjakan kuis dengan waktu 20 detik per soal untuk melatih respons cepat.</li><li>Ulangi modul yang nilainya masih rendah agar penguasaan semakin kuat.</li><li>Gunakan kategori filter untuk melihat topik yang ingin dipelajari.</li></ul></section>`;
}
loadProgress();
renderPage('library');
window.addEventListener('beforeunload',()=>{ if(quiz) { quiz=null; clearInterval(quizTimer); } });
</script></body></html>
